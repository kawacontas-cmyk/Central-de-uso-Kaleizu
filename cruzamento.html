<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #060B1F; --surface: #0e1530; --surface2: #131a38; --card: #0f1428;
  --border: rgba(255,255,255,0.08); --border-hover: rgba(255,255,255,0.18);
  --text: #e8eaf6; --muted: #8b93b8; --hint: #3a4060;
  --gold: #CDA04C; --gold-light: #e8c97a; --gold-dim: rgba(205,160,76,0.12);
  --teal: #7cc4a8; --danger: #e05a5a; --success: #5fcd8a;
  --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  --r: 8px; --r2: 12px;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* TOPBAR */
.topbar { height: 56px; background: #0a0e1f; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 14px; position: sticky; top: 0; z-index: 50; }
.topbar-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.topbar-logo img { width: 32px; height: 32px; object-fit: contain; mix-blend-mode: lighten; }
.topbar-name { font-size: 14px; font-weight: 500; color: var(--gold); padding-left: 10px; border-left: 1px solid var(--border); white-space: nowrap; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.btn-topbar { background: none; border: 1px solid var(--border); border-radius: var(--r); padding: 6px 14px; font-size: 12px; color: var(--muted); cursor: pointer; font-family: var(--font); transition: all .15s; }
.btn-topbar:hover { color: var(--text); border-color: var(--gold); }
.btn-topbar.gold { border-color: rgba(205,160,76,0.4); color: var(--gold); }
.btn-topbar.gold:hover { background: var(--gold-dim); }

/* MAIN */
.main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.page-title { font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--muted); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 7px 14px; border-radius: var(--r); font-size: 12px; cursor: pointer; font-family: var(--font); transition: all .15s; border: 1px solid var(--border); }
.btn-primary { background: var(--gold); color: #060B1F; border-color: var(--gold); font-weight: 500; }
.btn-primary:hover { background: var(--gold-light); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--card); color: var(--text); border-color: var(--gold); }
.btn-danger { background: transparent; color: var(--danger); border-color: rgba(224,90,90,0.3); }
.btn-danger:hover { background: rgba(224,90,90,0.1); }

/* SECTION LABEL */
.section-label { font-size: 10px; font-family: var(--mono); color: var(--gold); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }

/* PRODUCT TOGGLE */
.product-toggle { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; align-items: center; }
.ptab { padding: 7px 16px; border: 1px solid var(--border); border-radius: 99px; background: var(--surface); cursor: pointer; font-size: 12px; color: var(--muted); transition: all .15s; font-family: var(--font); }
.ptab:hover { border-color: var(--gold-light); color: var(--gold-light); }
.ptab.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold-light); font-weight: 500; }

/* TABS */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.tab { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); cursor: pointer; font-size: 12px; color: var(--muted); transition: all .15s; font-family: var(--font); }
.tab:hover { border-color: var(--border-hover); color: var(--text); }
.tab.active { background: var(--surface2); border-color: var(--gold); color: var(--gold-light); font-weight: 500; }

/* METRICS */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
.metric { background: var(--card); border: 1px solid var(--border); border-radius: var(--r2); padding: 16px; border-top: 2px solid var(--gold); }
.metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: var(--mono); margin-bottom: 6px; }
.metric-value { font-size: 26px; font-weight: 500; color: var(--gold-light); letter-spacing: -.5px; line-height: 1; }
.metric-sub { font-size: 11px; color: var(--hint); margin-top: 4px; font-family: var(--mono); }

/* CHART */
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r2); padding: 20px 22px; }
.legend { display: flex; gap: 16px; margin-bottom: 18px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
.chart-wrap { position: relative; width: 100%; }

/* LOADING / EMPTY */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .3; }
.empty-state p { font-size: 14px; }
.empty-state small { font-size: 12px; color: var(--hint); display: block; margin-top: 4px; }
.loading-state { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

/* MODAL */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.modal { background: var(--card); border: 1px solid var(--gold); border-radius: var(--r2); padding: 24px; width: 560px; max-width: 95vw; max-height: 88vh; overflow-y: auto; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; color: var(--gold-light); }
.modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.field input, .field select { width: 100%; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); font-size: 13px; color: var(--text); font-family: var(--font); outline: none; }
.field input:focus, .field select:focus { border-color: var(--gold); }
.field select option { background: #0e1530; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* UPLOAD AREA */
.upload-area { border: 2px dashed var(--border); border-radius: var(--r2); padding: 28px; text-align: center; cursor: pointer; transition: all .15s; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.upload-area:hover, .upload-area.drag { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.upload-area svg { width: 32px; height: 32px; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto; }

/* TOAST */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 16px; font-size: 13px; color: var(--text); opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; z-index: 300; max-width: 320px; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { border-color: var(--danger); color: var(--danger); }
.toast.success { border-color: var(--success); color: var(--success); }

/* PREVIEW TABLE */
.preview-wrap { overflow-x: auto; max-height: 200px; border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 12px; }
.preview-wrap table { width: 100%; border-collapse: collapse; font-size: 11px; }
.preview-wrap th { background: var(--surface); padding: 6px 10px; color: var(--gold); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); white-space: nowrap; }
.preview-wrap td { padding: 5px 10px; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; }

/* ADMIN BADGE */
.admin-only { display: none; }
.is-admin .admin-only { display: flex; }
</style>
</head>

  </div>
  <div class="topbar-right">
    <button class="btn admin-only btn-ghost" style="font-size:12px;padding:6px 14px;" onclick="openImportModal()">&#8593; Importar CSV</button>

</header>

<div class="main">

    <div>

      <div class="page-sub">Leads × Compradores · Pesquisa de Captação · Prof. Kaleizu</div>
    </div>
    <div class="btn-row admin-only">

    </div>
  </div>

  <div id="app-content">
    <div class="loading-state">Carregando dados...</div>
  </div>
</div>

<div class="overlay" id="importOverlay" onclick="closeImportModal(event)">
  <div class="modal">
    <div class="modal-title">Importar novo lançamento</div>
    <div class="modal-sub">Adicione os dados de cruzamento via CSV no formato padrão.</div>

    <div class="field">
      <label>Nome do lançamento</label>
      <input type="text" id="import-name" placeholder="Ex: L18 — Vet360" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field">
        <label>Total de leads</label>
        <input type="number" id="import-leads" placeholder="Ex: 500" />
      </div>
      <div class="field">
        <label>Total de compradores</label>
        <input type="number" id="import-buyers" placeholder="Ex: 30" />
      </div>
    </div>

    <div class="field">
      <label>Arquivo CSV <span style="color:var(--hint)">(use o template abaixo)</span></label>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('csvInput').click()"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')"
        ondrop="handleDrop(event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M8 12l4-4 4 4M12 8v8"/></svg>
        <span id="uploadLabel">Clique ou arraste o CSV aqui</span>
      </div>
      <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="handleFileSelect(this)" />
    </div>

    <div id="previewArea" style="display:none">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Preview — primeiras linhas:</div>
      <div class="preview-wrap" id="previewTable"></div>
    </div>

    <div style="margin-bottom:14px">
      <button class="btn btn-ghost" style="font-size:11px;padding:5px 10px;" onclick="downloadTemplate()">&#8595; Baixar template CSV</button>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeImportModal(null,true)">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmImport()">Salvar no banco</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ── TOAST ─────────────────────────────────────────────
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── INIT ──────────────────────────────────────────────
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    isAdmin = session.user?.user_metadata?.role === 'admin';
    if (isAdmin) document.body.classList.add('is-admin');
  }

  // Sempre faz upsert do seed para garantir dados atualizados
  const { count } = await sb.from('cruzamentos').select('*', { count: 'exact', head: true });
  if (count === 0) {
    toast('Primeira execução — populando banco...');
  }
  for (const p of SEED) {
    await sb.from('cruzamentos').upsert(
      { id: p.id, name: p.name, total_leads: p.total_leads, total_buyers: p.total_buyers, dados: p.dados },
      { onConflict: 'id' }
    );
  }

  await loadProducts();
}

async function loadProducts() {
  document.getElementById('app-content').innerHTML = '<div class="loading-state">Carregando dados...</div>';
  const { data, error } = await sb.from('cruzamentos').select('*').order('criado_em');
  if (error) { document.getElementById('app-content').innerHTML = `<div class="loading-state" style="color:var(--danger)">Erro: ${error.message}</div>`; return; }
  if (!data || data.length === 0) { renderEmpty(); return; }
  PRODUCTS = data.map(r => ({ ...r, ...r.dados }));
  selectedProducts = new Set([PRODUCTS[PRODUCTS.length - 1].id]);
  renderApp();
}

function buildProductToggle() {
  const container = document.getElementById('product-toggle');
  container.innerHTML = '';
  PRODUCTS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'ptab' + (selectedProducts.has(p.id) ? ' active' : '');
    btn.textContent = p.name;
    btn.dataset.id = p.id;
    btn.onclick = () => {
      if (selectedProducts.has(p.id)) {
        if (selectedProducts.size === 1) return;
        selectedProducts.delete(p.id);
        btn.classList.remove('active');
      } else {
        selectedProducts.add(p.id);
        btn.classList.add('active');
      }
      updateDeleteBtn();
      render();
    };
    container.appendChild(btn);
  });

  // Botão remover (admin)
  if (isAdmin) {
    const del = document.createElement('button');
    del.id = 'btn-delete';
    del.className = 'btn btn-danger admin-only';
    del.style.cssText = 'font-size:12px;padding:6px 12px;margin-left:4px;display:none';
    del.textContent = '✕ Remover selecionados';
    del.onclick = deleteSelected;
    container.appendChild(del);
  }
}

function updateDeleteBtn() {
  const btn = document.getElementById('btn-delete');
  if (btn) btn.style.display = selectedProducts.size > 0 && isAdmin ? 'flex' : 'none';
}

function buildCategoryTabs() {

function renderMetrics() {

  const selected = PRODUCTS.filter(p => selectedProducts.has(p.id));

    const d = selected[0];
    const ratio = ((d.total_buyers / d.total_leads) * 100).toFixed(1);
    el.innerHTML = `
      <div class="metric"><div class="metric-label">Total de leads</div><div class="metric-value">${d.total_leads.toLocaleString('pt-BR')}</div></div>
      <div class="metric"><div class="metric-label">Compradores</div><div class="metric-value">${d.total_buyers}</div></div>
      <div class="metric"><div class="metric-label">Taxa de conversão</div><div class="metric-value">${ratio}%</div></div>`;
  } else {
    el.innerHTML = selected.map(d => {

        <div class="metric-label">${d.name}</div>

function renderChart() {
  const wrap = document.getElementById('chart-wrap');
  if (!wrap) return;
  if (chart) { chart.destroy(); chart = null; }
  wrap.innerHTML = '<canvas id="mainChart"></canvas>';

  const selected = PRODUCTS.filter(p => selectedProducts.has(p.id));
  if (!selected.length) return;

  const catData = selected[0][currentCategory] || selected[0].dados?.[currentCategory];
  if (!catData) return;

  const labels = catData.labels;
  const datasets = [];
  datasetsCountsRef = [];

  const LEADS_COLOR   = { bg: 'rgba(205,160,76,0.75)',  border: '#CDA04C' };
  const BUYERS_COLOR  = { bg: 'rgba(124,196,168,0.75)', border: '#7cc4a8' };

  const conversionByProduct = [];
  const barOpts = selected.length > 1
    ? { categoryPercentage: 0.78, barPercentage: 0.9 }
    : { categoryPercentage: 0.8, barPercentage: 0.9 };
  selected.forEach((p, i) => {
    const d = p[currentCategory] || p.dados?.[currentCategory];
    if (!d) return;
    datasets.push({ label: `${p.name} — Leads`,       data: d.leads,  backgroundColor: LEADS_COLOR.bg,  borderColor: LEADS_COLOR.border,  borderWidth: 1, borderRadius: 3, ...barOpts });
    datasetsCountsRef.push(d.leads_n);
    datasets.push({ label: `${p.name} — Compradores`, data: d.buyers, backgroundColor: BUYERS_COLOR.bg, borderColor: BUYERS_COLOR.border, borderWidth: 1, borderRadius: 3, ...barOpts });
    datasetsCountsRef.push(d.buyers_n);
    conversionByProduct.push({ name: p.name, short: p.id.toUpperCase(), leads: d.leads, buyers: d.buyers, leads_n: d.leads_n, buyers_n: d.buyers_n });
  });

  const barH = Math.max(labels.length * (selected.length > 1 ? selected.length * 58 : 52) + 80, 220);
  wrap.style.height = barH + 'px';

  // Plugin que desenha label do lançamento à esquerda e índice à direita
  const conversionPlugin = {
    id: 'conversionIndex',
    afterDatasetsDraw(chartInstance) {
      const ctx = chartInstance.ctx;
      const xScale = chartInstance.scales.x;

      labels.forEach((label, labelIdx) => {
        conversionByProduct.forEach((prod, prodIdx) => {
          const lp = prod.leads[labelIdx] || 0;
          const bp = prod.buyers[labelIdx] || 0;

          // Centro real do par de barras (leads + compradores) deste lançamento
          const metaLeads  = chartInstance.getDatasetMeta(prodIdx * 2);
          const metaBuyers = chartInstance.getDatasetMeta(prodIdx * 2 + 1);
          if (!metaLeads.data[labelIdx] || !metaBuyers.data[labelIdx]) return;
          const yPos = (metaLeads.data[labelIdx].y + metaBuyers.data[labelIdx].y) / 2;

          // Label do lançamento à esquerda (só quando múltiplos selecionados)
          if (selected.length > 1) {
            const xLeft = xScale.getPixelForValue(0) - 8;
            ctx.save();
            ctx.font = `500 10px 'DM Mono', monospace`;
            ctx.fillStyle = '#8b93b8';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText(prod.short, xLeft, yPos);
            ctx.restore();
          }

          // Índice de conversão à direita
          if (lp === 0) return;
          const index = bp / lp;
          const text  = index.toFixed(2) + 'x';
          const color = index > 1.05 ? '#5fcd8a' : index >= 0.95 ? '#e8c97a' : '#e05a5a';
          const xPos  = xScale.getPixelForValue(xScale.max) + 6;

          ctx.save();
          ctx.font = `500 11px 'DM Mono', monospace`;
          ctx.fillStyle = color;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, xPos, yPos);
          ctx.restore();
        });
      });
    }
  };

  chart = new Chart(document.getElementById('mainChart'), {
    type: 'bar',
    data: { labels, datasets },
    plugins: [conversionPlugin],
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: 52, left: selected.length > 1 ? 72 : 0 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0f1428', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
          titleColor: '#e8eaf6', bodyColor: '#8b93b8', padding: 10,
          callbacks: {
            label: ctx => {
              const pct = ctx.parsed.x.toFixed(1);
              const n   = datasetsCountsRef[ctx.datasetIndex]?.[ctx.dataIndex] ?? '—';
              // Calcula índice para o tooltip também
              const isLeads   = ctx.datasetIndex % 2 === 0;
              const prodIdx   = Math.floor(ctx.datasetIndex / 2);
              const prod      = conversionByProduct[prodIdx];
              if (prod && !isLeads) {
                const lp = prod.leads[ctx.dataIndex] || 0;
                const bp = prod.buyers[ctx.dataIndex] || 0;
                if (lp > 0) {
                  const idx = bp / lp;
                  return [
                    ` ${ctx.dataset.label}: ${pct}%  (n = ${n})`,
                    ` Índice de conversão: ${idx.toFixed(2)}x`
                  ];
                }
              }
              return ` ${ctx.dataset.label}: ${pct}%  (n = ${n})`;
            }
          }
        }
      },
      scales: {
        x: { max: 100, ticks: { callback: v => v + '%', font: { size: 11, family: "'DM Mono',monospace" }, color: '#3a4060' }, grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: 'rgba(255,255,255,0.06)' } },
        y: { ticks: { font: { size: 11, family: "'DM Sans',sans-serif" }, color: '#8b93b8', autoSkip: false }, grid: { display: false }, border: { color: 'rgba(255,255,255,0.06)' } }
      }
    }
  });
}

async function deleteSelected() {
  if (!selectedProducts.size) return;
  const names = PRODUCTS.filter(p => selectedProducts.has(p.id)).map(p => p.name).join(', ');
  if (!confirm(`Remover: ${names}?\n\nEsta ação não pode ser desfeita.`)) return;

  await loadProducts();
}

// ── CSV IMPORT ────────────────────────────────────────
function openImportModal() {
  parsedCSV = null;
  document.getElementById('import-name').value = '';
  document.getElementById('import-leads').value = '';
  document.getElementById('import-buyers').value = '';
  document.getElementById('uploadLabel').textContent = 'Clique ou arraste o CSV aqui';
  document.getElementById('previewArea').style.display = 'none';
  document.getElementById('importOverlay').classList.add('open');
}

function closeImportModal(e, force) {
  if (force || (e && e.target === document.getElementById('importOverlay')))
    document.getElementById('importOverlay').classList.remove('open');
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadArea').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) processCSVFile(file);
}

function handleFileSelect(input) {
  if (input.files[0]) processCSVFile(input.files[0]);
}

function processCSVFile(file) {
  document.getElementById('uploadLabel').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    parsedCSV = parseCSV(text);
    showPreview(parsedCSV);
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  const lines = text.trim().split('\n').map(l => l.split(';').map(c => c.trim().replace(/^"|"$/g, '')));
  if (lines.length < 2) return null;
  // Formato: categoria;label;leads_pct;leads_n;buyers_pct;buyers_n
  const rows = lines.slice(1).filter(r => r.length >= 6 && r[0]);
  const dados = {};
  rows.forEach(([cat, label, lp, ln, bp, bn]) => {
    if (!dados[cat]) dados[cat] = { labels: [], leads: [], leads_n: [], buyers: [], buyers_n: [] };
    dados[cat].labels.push(label);
    dados[cat].leads.push(parseFloat(lp) || 0);
    dados[cat].leads_n.push(parseInt(ln) || 0);
    dados[cat].buyers.push(parseFloat(bp) || 0);
    dados[cat].buyers_n.push(parseInt(bn) || 0);
  });
  return { rows, dados };
}

function showPreview(parsed) {
  if (!parsed) return;
  const area = document.getElementById('previewArea');
  const table = document.getElementById('previewTable');
  const preview = parsed.rows.slice(0, 8);
  table.innerHTML = `<table><thead><tr><th>Categoria</th><th>Label</th><th>Leads %</th><th>Leads n</th><th>Compradores %</th><th>Compradores n</th></tr></thead>
    <tbody>${preview.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  area.style.display = 'block';
}

async function confirmImport() {
  const name = document.getElementById('import-name').value.trim();
  const total_leads = parseInt(document.getElementById('import-leads').value) || 0;
  const total_buyers = parseInt(document.getElementById('import-buyers').value) || 0;

  if (!name) { toast('Informe o nome do lançamento', 'error'); return; }
  if (!parsedCSV) { toast('Selecione um arquivo CSV', 'error'); return; }

  const id = name.toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');
  const { error } = await sb.from('cruzamentos').upsert({
    id, name, total_leads, total_buyers, dados: parsedCSV.dados
  });

  if (error) { toast('Erro ao salvar: ' + error.message, 'error'); return; }
  toast('Lançamento importado com sucesso!', 'success');
  closeImportModal(null, true);
  await loadProducts();
}
