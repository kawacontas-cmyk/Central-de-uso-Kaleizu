<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Pesquisas — Prof. Kaleizu</title>
<link rel="icon" type="image/png" href="/Icone_Kaleizu.png">
<link rel="apple-touch-icon" href="/Icone_Kaleizu.png">

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060B1F;--surface:#0a0f20;--card:#0f1428;--border:#1a2035;
  --text:#dde3f5;--muted:#6b7494;--hint:#3a4060;
  --gold:#c9a84c;--gold-light:#e8c97a;--gold-dim:rgba(201,168,76,.15);
  --accent2:#7cc4a8;--danger:#e05a5a;--success:#5ac48a;
  --topbar:#0a0e1f;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:6px;--r2:10px;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}
.topbar{height:56px;background:var(--topbar);border-bottom:2px solid #1A1E31;display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:50}
.topbar-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-logo img{width:32px;height:32px;object-fit:contain;mix-blend-mode:lighten}
.topbar-name{font-size:14px;font-weight:500;color:var(--gold);padding-left:10px;border-left:1px solid var(--border);white-space:nowrap}

.topbar-search input::placeholder{color:var(--hint)}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-count{font-size:12px;color:var(--muted);font-family:var(--mono)}
.btn-topbar{background:none;border:1px solid var(--border);border-radius:var(--r);padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .15s}
.btn-topbar:hover{color:var(--text);border-color:var(--gold)}

.main-full{max-width:1100px;margin:0 auto;padding:28px 24px 60px}

/* ── lista de lançamentos ── */
.lanc-sec{margin-bottom:30px}
.lanc-sec-t{font-size:10px;font-family:var(--mono);color:var(--gold);letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.lanc-sec-t span{background:var(--surface);color:var(--muted);border-radius:99px;padding:1px 8px;letter-spacing:0}
.lanc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}

.lanc-card{position:relative;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);padding:16px 18px;overflow:hidden;transition:border-color .15s,transform .15s}
.lanc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c)}
.lanc-card::after{content:'';position:absolute;top:-40px;right:-40px;width:110px;height:110px;
  border-radius:50%;background:var(--c);opacity:.07;pointer-events:none}
.lanc-card:hover{border-color:var(--c);transform:translateY(-2px)}

.lanc-top{margin-bottom:12px}
.lanc-nome{font-size:13px;font-weight:500;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lanc-num{font-size:27px;font-weight:500;color:var(--c);line-height:1;letter-spacing:-.5px}
.lanc-lbl{font-size:11px;color:var(--hint);font-family:var(--mono);margin-top:3px;margin-bottom:14px}

.lanc-acoes{display:flex;gap:6px}
.btn-lanc{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:7px 8px;border-radius:var(--r);font-size:11px;font-family:var(--font);
  cursor:pointer;transition:all .15s;background:transparent;
  border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.btn-lanc:hover{border-color:var(--c);color:var(--text)}
.btn-lanc.primario{border-color:rgba(var(--crgb),.45);color:var(--c)}
.btn-lanc.primario:hover{background:rgba(var(--crgb),.13);border-color:var(--c)}

.check-line{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);
  cursor:pointer;margin-bottom:4px}
.check-line input{margin-top:2px;accent-color:var(--gold);cursor:pointer;flex-shrink:0}
.check-hint{font-size:11px;color:var(--hint);margin:0 0 12px 22px}
.check-line{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);
  cursor:pointer;margin-bottom:4px}
.check-line input{margin-top:2px;accent-color:var(--gold);cursor:pointer;flex-shrink:0}
.check-hint{font-size:11px;color:var(--hint);margin:0 0 12px 22px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.page-title{font-size:20px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:10px}
.page-sub{font-size:12px;color:var(--muted);margin-top:4px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:var(--r);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s;border:1px solid var(--border)}
.btn-primary{background:var(--gold);color:#060B1F;border-color:var(--gold);font-weight:500}
.btn-primary:hover{background:var(--gold-light)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--card);color:var(--text);border-color:var(--gold)}

.toolbar input[type=text]{width:180px}
.toolbar select:focus,.toolbar input:focus{border-color:var(--gold)}

thead{position:sticky;top:0;z-index:2}
th{background:var(--surface);padding:8px 12px;text-align:left;color:var(--gold);font-weight:400;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(201,168,76,.04)}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;font-family:var(--mono)}
.badge-cap{background:rgba(201,168,76,.2);color:var(--gold-light)}
.badge-alu{background:rgba(124,196,168,.15);color:#7cc4a8}

.pagination button{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:4px 9px;font-size:11px;cursor:pointer;color:var(--muted);font-family:var(--mono);transition:all .15s}
.pagination button:hover{color:var(--text);border-color:var(--gold)}
.pagination button.active{background:var(--gold);color:#060B1F;border-color:var(--gold);font-weight:500}
.pag-info{font-size:11px;color:var(--hint);margin-left:4px;font-family:var(--mono)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--gold);border-radius:var(--r2);padding:22px;width:500px;max-width:95vw;max-height:88vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:500;margin-bottom:16px;color:var(--gold-light)}
.field{margin-bottom:10px}
.field label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;font-size:13px;color:var(--text);font-family:var(--font);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:55px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-sep{border:none;border-top:1px solid var(--border);margin:14px 0}
.upload-area{border:1.5px dashed var(--border);border-radius:var(--r2);padding:24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:10px}
.upload-area:hover,.upload-area.drag{border-color:var(--gold);background:var(--gold-dim)}
.upload-area input{display:none}
.upload-label{font-size:13px;color:var(--muted)}
.upload-label span{color:var(--gold);cursor:pointer}
.upload-preview{font-size:11px;color:var(--accent2);margin-top:6px;font-family:var(--mono)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--gold);border-radius:var(--r2);padding:12px 18px;font-size:13px;color:var(--text);z-index:999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{border-color:var(--danger);color:var(--danger)}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);font-size:13px;gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--hint)}
.empty-row{text-align:center;padding:32px;color:var(--hint)}
@media(max-width:700px){.main-full{max-width:1100px;margin:0 auto;padding:28px 24px 60px}}
</style>
</head>

function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show' + (type?' '+type:'');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'),3500);
}
function showLoading(el) { el.innerHTML = '<div class="loading"><div class="spinner"></div> carregando...</div>'; }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function openModal(title, body, footer) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = footer;
  document.getElementById('modalOverlay').classList.add('open');
}

async function fetchSheets() {
  const { data, error } = await sb.from('lancamentos').select('*').order('criado_em');
  if (error) throw error;
  return data;
}
async function fetchRows(id) {
  if (rowsCache[id]) return rowsCache[id];
  const { data, error } = await sb.from('respostas').select('id,dados,criado_em').eq('lancamento_id',id).order('criado_em');
  if (error) throw error;
  const rows = data.map(r => ({ _id:r.id, _criado:r.criado_em, ...r.dados }));
  rowsCache[id] = rows;
  return rows;
}
async function insertRow(id, dados) {
  const { error } = await sb.from('respostas').insert({ lancamento_id:id, dados });
  if (error) throw error;
  const s = sheets.find(x=>x.id===id);
  if (s) { await sb.from('lancamentos').update({ total: s.total+1 }).eq('id',id); s.total++; }
  rowsCache[id] = null;
}
async function insertRows(id, dadosList) {
  const inserts = dadosList.map(d => ({ lancamento_id:id, dados:d }));
  const { error } = await sb.from('respostas').insert(inserts);
  if (error) throw error;
  const s = sheets.find(x=>x.id===id);
  if (s) { await sb.from('lancamentos').update({ total: s.total+dadosList.length }).eq('id',id); s.total+=dadosList.length; }
  rowsCache[id] = null;
}
async function createLancamento(id, tipo, cols) {
  const { error } = await sb.from('lancamentos').insert({ id, tipo, total:0, cols });
  if (error) throw error;
}

async function seedIfEmpty() {
  const { count } = await sb.from('lancamentos').select('*',{ count:'exact', head:true });
  if (count > 0) return;
  toast('Primeira execução — populando banco...');
  for (const s of SEED_SHEETS) {
    await sb.from('lancamentos').upsert({ id:s.id, tipo:s.tipo, total:s.total, cols:s.cols });
  }
  toast('Banco populado com ' + SEED_SHEETS.length + ' lançamentos!');
}

  try {

// Paleta que se repete a cada 8 cards, para diferenciar as pesquisas
const CORES_LANC = [
  {hex:'#CDA04C', rgb:'205,160,76'},  {hex:'#7cc4a8', rgb:'124,196,168'},
  {hex:'#5b8aff', rgb:'91,138,255'},  {hex:'#a98bff', rgb:'169,139,255'},
  {hex:'#f07ab0', rgb:'240,122,176'}, {hex:'#4dc9f6', rgb:'77,201,246'},
  {hex:'#5fcd8a', rgb:'95,205,138'},  {hex:'#ffb94a', rgb:'255,185,74'}
];

// Cor fixa por nome: o mesmo lançamento mantém a cor mesmo mudando de posição
function corDoLancamento(id) {
  let n = 0;
  for (let i=0; i<id.length; i++) n = (n*31 + id.charCodeAt(i)) >>> 0;
  return CORES_LANC[n % CORES_LANC.length];
}

function renderLancamentos() {
  const total = sheets.reduce((s,x)=>s+x.total, 0);
  document.getElementById('topbarCount').textContent = total.toLocaleString('pt-BR') + ' respostas';

  const cap = sheets.filter(s=>s.tipo==='Captação');
  const alu = sheets.filter(s=>s.tipo!=='Captação');

  const card = s => {
    const cor = corDoLancamento(s.id);
    const esc = s.id.replace(/'/g,"\\'");
    return `
    <div class="lanc-card" style="--c:${cor.hex};--crgb:${cor.rgb}">
      <div class="lanc-top">
        <div class="lanc-nome" title="${s.id}">${s.id}</div>
      </div>
      <div class="lanc-num">${s.total.toLocaleString('pt-BR')}</div>
      <div class="lanc-lbl">respostas</div>
      <div class="lanc-acoes">
        <button class="btn-lanc primario" onclick="exportCSV('${esc}')">&#8595; Exportar</button>
        <button class="btn-lanc" onclick="openImportCSV('${esc}')">&#8593; Importar</button>
      </div>
    </div>`;
  };

  const grupo = (titulo, lista) => !lista.length ? '' : `
    <div class="lanc-sec">
      <div class="lanc-sec-t">${titulo} <span>${lista.length}</span></div>
      <div class="lanc-grid">${lista.map(card).join('')}</div>
    </div>`;

  document.getElementById('main').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Pesquisas</div>
        <div class="page-sub">${sheets.length} lançamentos · ${total.toLocaleString('pt-BR')} respostas no total</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="openImportCSV()">+ Novo lançamento</button>
      </div>
    </div>
    ${sheets.length ? grupo('Captação', cap) + grupo('Alunos', alu)
      : '<div class="loading">Nenhum lançamento ainda. Crie o primeiro acima.</div>'}`;
}

async function exportCSV(id) {
  const sheet = sheets.find(s=>s.id===id);
  toast('Preparando ' + id + '...');
  let rows;
  try { rows = await fetchRows(id); }
  catch(e) { toast('Erro ao exportar: '+e.message,'error'); return; }

  if (!rows.length) { toast('Este lançamento não tem respostas.','error'); return; }

  // Colunas: as cadastradas no lançamento ou, na falta, as das próprias respostas
  let cols = (sheet && sheet.cols && sheet.cols.length) ? sheet.cols.slice() : [];
  if (!cols.length) {
    const vistas = new Set();
    rows.forEach(r => Object.keys(r).forEach(k => { if(!k.startsWith('_')) vistas.add(k); }));
    cols = [...vistas];
  }

  const esc = v => '"' + (v==null?'':v).toString().replace(/"/g,'""') + '"';
  const csv = [cols.join(';'), ...rows.map(r => cols.map(c => esc(r[c])).join(';'))].join('\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = id.replace(/[^\w\-]+/g,'_') + '.csv';
  a.click();
  toast(rows.length.toLocaleString('pt-BR') + ' respostas exportadas!');
}

      ondrop="handleDrop(event)">
      <input type="file" id="csvInput" accept=".csv" onchange="handleCSVFile(this.files[0])">

      <div class="upload-preview" id="uploadPreview"></div>
    </div>

    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>

function onDestinoChange() {
  const v = document.getElementById('import-sheet').value;
  const novo = v === '__novo__';
  document.getElementById('blocoNovo').style.display = novo ? 'block' : 'none';
  document.getElementById('blocoSubstituir').style.display = novo ? 'none' : 'block';
  if (novo) {
    const nome = document.getElementById('novo-nome');
    if (!nome.value && csvNomeArquivo) nome.value = sugereNome(csvNomeArquivo);
  }
}

// Tenta adivinhar o nome a partir do arquivo (ex: "..._L21KR__..." → "L21KR - Captação")
function sugereNome(arquivo) {
  const m = arquivo.match(/L\d+KR/i);
  return m ? m[0].toUpperCase() + ' - Captação' : '';
}

function handleCSVFile(file) {
  if(!file) return;
  csvNomeArquivo = file.name;
  const reader=new FileReader();
  reader.onload=e=>{
    csvParsed=parseCSV(e.target.result);
    if(!csvParsed.length){ toast('Não consegui ler nenhuma linha desse arquivo.','error'); return; }

    document.getElementById('uploadPreview').textContent =
      file.name + ' — ' + csvParsed.length.toLocaleString('pt-BR') + ' respostas';

    const nome = document.getElementById('novo-nome');
    if (nome && !nome.value) nome.value = sugereNome(file.name);

    const cols=Object.keys(csvParsed[0]||{});
    const prev=csvParsed.slice(0,3);
    document.getElementById('importPreview').innerHTML=`
      <p style="font-size:11px;color:var(--muted);margin:10px 0 6px">${cols.length} colunas · prévia das 3 primeiras linhas:</p>
      <div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--r)">
        <table style="width:100%;border-collapse:collapse;font-size:11px">
          <thead><tr>${cols.map(c=>`<th style="padding:5px 8px;color:var(--gold);background:var(--surface);text-align:left;white-space:nowrap">${c}</th>`).join('')}</tr></thead>
          <tbody>${prev.map(r=>`<tr>${cols.map(c=>`<td style="padding:4px 8px;border-top:1px solid var(--border);white-space:nowrap">${(r[c]||'').slice(0,40)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>`;
    document.getElementById('btnImport').style.display='inline-block';
  };
  reader.readAsText(file,'UTF-8');
}

function handleDrop(e){e.preventDefault();document.getElementById('uploadArea').classList.remove('drag');const f=e.dataTransfer.files[0];if(f)handleCSVFile(f);}
function parseCSV(text) {
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const headers=splitLine(lines[0]);
  return lines.slice(1).map(l=>{const v=splitLine(l);return Object.fromEntries(headers.map((h,i)=>[h.trim(),(v[i]||'').trim()]));});
}
function splitLine(line) {
  const r=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){r.push(cur);cur='';}else{cur+=c;}}
  r.push(cur);return r;
}
async function confirmImport() {
  if(!csvParsed.length) return;
  const btn = document.getElementById('btnImport');
  const destino = document.getElementById('import-sheet').value;
  const criarNovo = destino === '__novo__';
  const cols = Object.keys(csvParsed[0]||{});

  let id = destino;
  if (criarNovo) {
    id = (document.getElementById('novo-nome').value||'').trim();
    if (!id) { toast('Dê um nome ao lançamento.','error'); return; }
    if (sheets.some(s=>s.id===id)) { toast('Já existe um lançamento com esse nome.','error'); return; }
  }

  const substituir = !criarNovo && document.getElementById('import-substituir').checked;
  const atual = sheets.find(s=>s.id===id);
  if (substituir && atual && atual.total) {
    if (!confirm(`Isso apaga as ${atual.total.toLocaleString('pt-BR')} respostas atuais de ${id} e coloca as ${csvParsed.length.toLocaleString('pt-BR')} do arquivo no lugar.\n\nConfirmar?`)) return;
  }

  btn.textContent='Importando...'; btn.disabled=true;
  try {
    if (criarNovo) {
      await createLancamento(id, document.getElementById('novo-tipo').value, cols);
      sheets.push({ id, tipo: document.getElementById('novo-tipo').value, total: 0, cols });
    } else {
      // guarda as colunas do arquivo para a exportação sair completa
      await sb.from('lancamentos').update({ cols }).eq('id', id);
      const s = sheets.find(x=>x.id===id); if (s) s.cols = cols;
    }

    if (substituir) {
      const { error } = await sb.from('respostas').delete().eq('lancamento_id', id);
      if (error) throw error;
      await sb.from('lancamentos').update({ total: 0 }).eq('id', id);
      const s = sheets.find(x=>x.id===id); if (s) s.total = 0;
    }

    const lote = 500;
    for (let i=0; i<csvParsed.length; i+=lote) {
      await insertRows(id, csvParsed.slice(i, i+lote));
      btn.textContent = `Importando... ${Math.min(i+lote, csvParsed.length)}/${csvParsed.length}`;
    }

    closeModal();
    toast(csvParsed.length.toLocaleString('pt-BR')+' respostas importadas em '+id+'!');
    sheets = await fetchSheets();
    renderLancamentos();
  } catch(e) {
    toast('Erro: '+e.message,'error');
    btn.textContent='Importar para o banco'; btn.disabled=false;
  }
}

function openNewLancamento() {
  openModal('Novo lançamento',
    `<div class="field"><label>ID do lançamento</label>
      <input id="nl-id" placeholder="Ex: L17KR" oninput="this.value=this.value.toUpperCase()">

    <div class="field"><label>Tipo</label>

    <div class="field"><label>Campos</label>
      <textarea id="nl-cols" rows="7">Email\nTelefone\nFaixa etária\nSexo\nOcupação\nRegião\nNicho\nTempo form.\nDesafio\nConhece Kaleizu</textarea>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="saveNewLancamento()">Criar lançamento</button>`);
}
async function saveNewLancamento() {
  const id=document.getElementById('nl-id').value.trim();
  const tipo=document.getElementById('nl-tipo').value;
  const cols=document.getElementById('nl-cols').value.split('\n').map(c=>c.trim()).filter(Boolean);
  if(!id){toast('Informe um ID','error');return;}
  if(sheets.find(s=>s.id===id)){toast('ID já existe','error');return;}
  if(!cols.length){toast('Defina ao menos um campo','error');return;}
  try {
    await createLancamento(id,tipo,cols);
    sheets.push({id,tipo,total:0,cols});
    colsCache[id]=cols; rowsCache[id]=[];
    closeModal(); toast('Lançamento '+id+' criado!');
    renderLancamentos();
  } catch(e){toast('Erro: '+e.message,'error');}
}
