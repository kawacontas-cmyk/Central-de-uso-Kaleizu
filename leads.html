<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Leads — Prof. Kaleizu</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060B1F;--surface:#0a0f20;--card:#0f1428;--border:#1a2035;
  --text:#dde3f5;--muted:#6b7494;--hint:#3a4060;
  --gold:#c9a84c;--gold-light:#e8c97a;--gold-dim:rgba(201,168,76,.15);
  --accent2:#7cc4a8;--danger:#e05a5a;--success:#5ac48a;--amber:#e8c97a;--blue:#5b8aff;
  --topbar:#0a0e1f;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:6px;--r2:10px;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}
button{font-family:inherit;color:inherit}

.topbar{height:56px;background:var(--topbar);border-bottom:2px solid #1A1E31;display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:50}
.topbar-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-logo img{width:32px;height:32px;object-fit:contain;mix-blend-mode:lighten}
.topbar-name{font-size:14px;font-weight:500;color:var(--gold);padding-left:10px;border-left:1px solid var(--border);white-space:nowrap}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-count{font-size:12px;color:var(--muted);font-family:var(--mono)}
.btn-topbar{background:none;border:1px solid var(--border);border-radius:var(--r);padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .15s}
.btn-topbar:hover{color:var(--text);border-color:var(--gold)}

.main-full{max-width:1100px;margin:0 auto;padding:28px 24px 60px}
.main-wide{max-width:1500px;margin:0 auto;padding:28px 24px 60px}

.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.page-title{font-size:20px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:10px}
.page-sub{font-size:12px;color:var(--muted);margin-top:4px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:var(--r);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s;border:1px solid var(--border);background:transparent;color:var(--muted)}
.btn-primary{background:var(--gold);color:#060B1F;border-color:var(--gold);font-weight:500}
.btn-primary:hover{background:var(--gold-light)}
.btn-ghost:hover{background:var(--card);color:var(--text);border-color:var(--gold)}
.btn-danger:hover{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ── cards de lançamento ── */
.lanc-sec{margin-bottom:30px}
.lanc-sec-t{font-size:10px;font-family:var(--mono);color:var(--gold);letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.lanc-sec-t span{background:var(--surface);color:var(--muted);border-radius:99px;padding:1px 8px;letter-spacing:0}
.lanc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lanc-card{position:relative;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);padding:16px 18px;overflow:hidden;transition:border-color .15s,transform .15s}
.lanc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c)}
.lanc-card::after{content:'';position:absolute;top:-40px;right:-40px;width:110px;height:110px;
  border-radius:50%;background:var(--c);opacity:.07;pointer-events:none}
.lanc-card:hover{border-color:var(--c);transform:translateY(-2px)}
.lanc-top{margin-bottom:12px;display:flex;align-items:flex-start;gap:6px}
.lanc-nome{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.btn-renomear{background:none;border:none;color:var(--hint);cursor:pointer;font-size:13px;line-height:1;
  padding:0 2px;flex-shrink:0;transition:color .15s;position:relative;z-index:1}
.btn-renomear:hover{color:var(--c)}
.lanc-num{font-size:27px;font-weight:500;color:var(--c);line-height:1;letter-spacing:-.5px}
.lanc-lbl{font-size:11px;color:var(--hint);font-family:var(--mono);margin-top:3px;margin-bottom:14px}
.lanc-acoes{display:flex;gap:6px;flex-wrap:wrap}
.btn-lanc{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:7px 8px;border-radius:var(--r);font-size:11px;font-family:var(--font);
  cursor:pointer;transition:all .15s;background:transparent;
  border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.btn-lanc:hover{border-color:var(--c);color:var(--text)}
.btn-lanc.primario{border-color:rgba(var(--crgb),.45);color:var(--c)}
.btn-lanc.primario:hover{background:rgba(var(--crgb),.13);border-color:var(--c)}
.btn-lanc.largo{flex-basis:100%}

/* ── detalhe ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--gold))}
.kpi-lbl{font-size:10px;font-family:var(--mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.kpi-num{font-size:24px;font-weight:500;color:var(--kc,var(--text));margin-top:6px;letter-spacing:-.5px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:7px 10px;font-size:12px;color:var(--text);font-family:var(--font);outline:none}
.toolbar input[type=search]{width:230px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--gold)}
.toolbar .sep{flex:1}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:6px 12px;
  font-size:11px;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .15s}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-light);background:var(--gold-dim)}

.table-wrap{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;background:var(--card)}
.table-scroll{overflow:auto;max-height:62vh}
table{border-collapse:collapse;width:100%;font-size:13px}
thead{position:sticky;top:0;z-index:2}
th{background:var(--surface);padding:8px 12px;text-align:left;color:var(--gold);font-weight:400;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;
  max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(201,168,76,.04)}
td.nulo{color:var(--hint)}
.col-sel{width:36px;padding-right:0}
.col-sel input{accent-color:var(--gold);width:15px;height:15px;cursor:pointer;vertical-align:middle}
tr.sel td{background:var(--gold-dim)}
.selbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 14px;margin-bottom:10px;border:1px solid var(--gold);
  border-radius:var(--r2);background:var(--gold-dim);font-size:13px}
.selbar .qtd{font-weight:600;color:var(--gold-light)}
.selbar .link{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.selbar .link:hover{color:var(--text)}
.selbar .sep{flex:1}
.selbar[hidden]{display:none}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;font-family:var(--mono);margin-right:4px}
.badge-rep{background:rgba(232,201,122,.16);color:var(--amber)}
.badge-rec{background:rgba(91,138,255,.16);color:var(--blue)}

.pagination{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap}
.pagination button{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:4px 9px;
  font-size:11px;cursor:pointer;color:var(--muted);font-family:var(--mono);transition:all .15s}
.pagination button:hover:not([disabled]){color:var(--text);border-color:var(--gold)}
.pagination button[disabled]{opacity:.35;cursor:not-allowed}
.pag-info{font-size:11px;color:var(--hint);font-family:var(--mono);margin-left:auto}

/* ── modal ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--gold);border-radius:var(--r2);padding:22px;width:520px;max-width:95vw;max-height:88vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:500;margin-bottom:16px;color:var(--gold-light)}
.field{margin-bottom:10px}
.field label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.field input,.field select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;font-size:13px;color:var(--text);font-family:var(--font);outline:none}
.field input:focus,.field select:focus{border-color:var(--gold)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.check-line{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);cursor:pointer;margin-bottom:4px}
.check-line input{margin-top:2px;accent-color:var(--gold);cursor:pointer;flex-shrink:0}
.check-hint{font-size:11px;color:var(--hint);margin:0 0 12px 22px}
.upload-area{border:1.5px dashed var(--border);border-radius:var(--r2);padding:24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:10px}
.upload-area:hover,.upload-area.drag{border-color:var(--gold);background:var(--gold-dim)}
.upload-area input{display:none}
.upload-label{font-size:13px;color:var(--muted)}
.upload-label span{color:var(--gold)}
.upload-preview{font-size:11px;color:var(--accent2);margin-top:6px;font-family:var(--mono)}

.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--gold);border-radius:var(--r2);padding:12px 18px;font-size:13px;color:var(--text);z-index:999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:340px}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{border-color:var(--danger);color:var(--danger)}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);font-size:13px;gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--hint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<main class="main-full" id="main">

</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://iabugpuqlcfftwabuxsj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhYnVncHVxbGNmZnR3YWJ1eHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwOTA5MTIsImV4cCI6MjA5MTY2NjkxMn0.Rs2OJlbd8_2TMroE9iehTtZLFdBImVfBpKEH-RT_3UY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const POR_PAGINA = 100;
const LOTE = 500;

let isAdmin = false;
let lancs = [];                 // [{id, rotulo, cols, total, unicos}]
let csvParsed = [];             // [{COL: valor}]
let csvCols = [];
let csvNomeArquivo = '';

const det = {                   // estado da tela de detalhe
  lanc: null, leads: [], filtrados: [], pagina: 1,
  soRepetidos: false, soRecorrentes: false,
  sel: new Set()                // ids (texto) dos leads marcados
};

/* ── utilidades ── */
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 3500);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function openModal(title, body, footer) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = footer;
  document.getElementById('modalOverlay').classList.add('open');
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Number(n||0).toLocaleString('pt-BR');

// Matizes alternados de propósito: cards vizinhos nunca saem parecidos
const CORES_LANC = [
  {hex:'#CDA04C', rgb:'205,160,76'},  {hex:'#5b8aff', rgb:'91,138,255'},
  {hex:'#5fcd8a', rgb:'95,205,138'},  {hex:'#f07ab0', rgb:'240,122,176'},
  {hex:'#4dc9f6', rgb:'77,201,246'},  {hex:'#ffb94a', rgb:'255,185,74'},
  {hex:'#a98bff', rgb:'169,139,255'}, {hex:'#7cc4a8', rgb:'124,196,168'},
  {hex:'#e0705a', rgb:'224,112,90'},  {hex:'#b7c44e', rgb:'183,196,78'},
  {hex:'#ff8fd0', rgb:'255,143,208'}, {hex:'#54d6c2', rgb:'84,214,194'}
];
// A cor vem da posição na lista, não do nome: com 8 cores e 9 lançamentos
// o resto do hash repetia (L1 e L2KR caíam na mesma).
function corDoLancamento(id) {
  const i = lancs.findIndex(l => l.id === id);
  return CORES_LANC[(i < 0 ? 0 : i) % CORES_LANC.length];
}

// Ordena L1, L2KR, L10KR na ordem certa — texto puro põe L10 antes de L2
function ordenarLancs(lista) {
  return lista.slice().sort((a,b) => {
    const na = parseInt((a.id.match(/\d+/)||[0])[0], 10);
    const nb = parseInt((b.id.match(/\d+/)||[0])[0], 10);
    if (na !== nb) return na - nb;
    return a.id.localeCompare(b.id, 'pt-BR');
  });
}

/* ── banco ── */
async function fetchLancs() {
  const { data, error } = await sb
    .from('lead_lancamentos_resumo')
    .select('id, rotulo, cols, total, unicos')
    .order('id');
  if (error) throw error;
  return ordenarLancs(data || []);
}
async function fetchLeads(id) {
  const out = [];
  let de = 0;
  while (true) {
    const { data, error } = await sb.from('leads')
      .select('id, dados, email').eq('lancamento_id', id).order('id').range(de, de+999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
    de += 1000;
  }
  return out;
}

/* ── início ── */
async function init() {
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    isAdmin = session.user?.user_metadata?.role === 'admin';
    lancs = await fetchLancs();
    renderLancamentos();
  } catch(e) {
    document.getElementById('main').innerHTML =
      `<div class="loading" style="color:var(--danger)">Erro: ${esc(e.message)}</div>`;
  }
}

/* ── tela 1: grade de lançamentos ── */
function renderLancamentos() {
  document.querySelector('main').className = 'main-full';
  const total = lancs.reduce((s,x)=>s+Number(x.total||0), 0);
  document.getElementById('topbarCount').textContent = nf(total) + ' leads';

  const card = l => {
    const cor = corDoLancamento(l.id);
    const id = esc(l.id).replace(/'/g,"\\'");
    return `
    <div class="lanc-card" style="--c:${cor.hex};--crgb:${cor.rgb}">
      <div class="lanc-top">
        <div class="lanc-nome" title="${esc(l.rotulo || l.id)}">${esc(l.rotulo || l.id)}</div>
        ${isAdmin ? `<button class="btn-renomear" title="Renomear" onclick="openRenomear('${id}')">&#9998;</button>` : ''}
      </div>
      <div class="lanc-num">${nf(l.total)}</div>
      <div class="lanc-lbl">leads · ${nf(l.unicos)} e-mails únicos</div>
      <div class="lanc-acoes">
        <button class="btn-lanc primario largo" onclick="abrirDetalhe('${id}')">Ver leads</button>
        <button class="btn-lanc" onclick="exportCSV('${id}')">&#8595; Exportar</button>
        ${isAdmin ? `<button class="btn-lanc" onclick="openImportCSV('${id}')">&#8593; Importar</button>` : ''}
      </div>
    </div>`;
  };

  document.getElementById('main').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Leads</div>
        <div class="page-sub">${lancs.length} lançamentos · ${nf(total)} leads no total</div>
      </div>
      <div class="btn-row">
        ${isAdmin ? '<button class="btn btn-primary" onclick="openImportCSV()">+ Novo lançamento</button>' : ''}
      </div>
    </div>
    ${lancs.length ? `
      <div class="lanc-sec">
        <div class="lanc-sec-t">Lançamentos <span>${lancs.length}</span></div>
        <div class="lanc-grid">${lancs.map(card).join('')}</div>
      </div>`
    : '<div class="loading">Nenhum lançamento importado ainda. Comece pelo botão acima.</div>'}`;
}

/* ── tela 2: detalhe de um lançamento ── */
async function abrirDetalhe(id) {
  const lanc = lancs.find(l => l.id === id);
  if (!lanc) return;
  document.querySelector('main').className = 'main-wide';
  document.getElementById('main').innerHTML =
    '<div class="loading"><div class="spinner"></div> carregando leads...</div>';

  let leads, recorrentes = {};
  try {
    leads = await fetchLeads(id);
    const { data, error } = await sb.rpc('leads_recorrentes', { p_lanc: id });
    if (error) toast('Os leads carregaram, mas a marcação de recorrência falhou.', 'error');
    else (data || []).forEach(r => { recorrentes[r.email] = r.lancamentos; });
  } catch(e) {
    document.getElementById('main').innerHTML =
      `<div class="loading" style="color:var(--danger)">Erro ao carregar: ${esc(e.message)}</div>`;
    return;
  }

  const conta = {};
  leads.forEach(l => { if (l.email) conta[l.email] = (conta[l.email]||0)+1; });

  det.lanc = lanc;
  det.leads = leads.map(l => ({
    id: l.id, dados: l.dados, email: l.email,
    rep: !!(l.email && conta[l.email] > 1),
    rec: recorrentes[l.email] || null
  }));
  det.pagina = 1; det.soRepetidos = false; det.soRecorrentes = false; det.sel = new Set();

  renderDetalhe();
  aplicarFiltros();
}

function renderDetalhe() {
  const l = det.lanc;
  const cor = corDoLancamento(l.id);
  const cols = l.cols || [];
  const opcoes = (campo) => {
    const vals = [...new Set(det.leads.map(x => (x.dados[campo]||'').trim()).filter(Boolean))].sort();
    return vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  };

  document.getElementById('main').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title" style="color:${cor.hex}">${esc(l.rotulo || l.id)}</div>

      ${cols.includes('DATA') ? `<select id="fData" onchange="aplicarFiltros()"><option value="">Todas as datas</option>${opcoes('DATA')}</select>` : ''}

      <div class="table-scroll">
        <table>
          <thead><tr>${isAdmin ? '<th class="col-sel"><input type="checkbox" id="selPagina" onchange="selecionarPagina(this.checked)" aria-label="Selecionar os leads desta página"></th>' : ''}<th>Situação</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
          <tbody id="tbody"></tbody>
        </table>

      <div class="pagination">
        <button id="pPrev" onclick="mudarPagina(-1)">Anterior</button>

}

function voltarParaLista() {
  det.lanc = null; det.leads = []; det.filtrados = [];
  renderLancamentos();
}

function toggleChip(qual) {
  if (qual === 'rep') {
    det.soRepetidos = !det.soRepetidos;
    document.getElementById('cRep').setAttribute('aria-pressed', String(det.soRepetidos));
  } else {
    det.soRecorrentes = !det.soRecorrentes;
    document.getElementById('cRec').setAttribute('aria-pressed', String(det.soRecorrentes));
  }
  aplicarFiltros();
}

function aplicarFiltros() {
  const termo = (document.getElementById('fBusca')?.value || '').trim().toLowerCase();
  const origem = document.getElementById('fSource')?.value || '';
  const data = document.getElementById('fData')?.value || '';

  det.filtrados = det.leads.filter(l => {
    if (det.soRepetidos && !l.rep) return false;
    if (det.soRecorrentes && !l.rec) return false;
    if (origem && (l.dados.UTM_SOURCE||'').trim() !== origem) return false;
    if (data && (l.dados.DATA||'').trim() !== data) return false;
    if (termo && !Object.values(l.dados).join(' ').toLowerCase().includes(termo)) return false;
    return true;
  });
  det.pagina = 1;
  det.sel.clear();
  renderKPIs();
  renderTabela();
}

function renderKPIs() {
  document.getElementById('kTotal').textContent  = nf(det.leads.length);
  document.getElementById('kUnicos').textContent = nf(new Set(det.leads.map(l=>l.email).filter(Boolean)).size);
  document.getElementById('kRep').textContent    = nf(det.leads.filter(l=>l.rep).length);
  document.getElementById('kRec').textContent    = nf(det.leads.filter(l=>l.rec).length);
}

function renderTabela() {
  const cols = det.lanc.cols || [];
  const totalPag = Math.max(1, Math.ceil(det.filtrados.length / POR_PAGINA));
  if (det.pagina > totalPag) det.pagina = totalPag;
  const inicio = (det.pagina-1) * POR_PAGINA;
  const pagina = det.filtrados.slice(inicio, inicio + POR_PAGINA);

  const cel = v => {
    const s = (v||'').trim();
    return s ? `<td title="${esc(s)}">${esc(s)}</td>` : '<td class="nulo">—</td>';
  };

  document.getElementById('tbody').innerHTML = pagina.length
    ? pagina.map(l => {
        const selos =
          (l.rep ? '<span class="badge badge-rep">repetido</span>' : '') +
          (l.rec ? `<span class="badge badge-rec" title="Mesmo e-mail em: ${esc(l.rec.join(', '))}">veio em ${esc(l.rec.join(', '))}</span>` : '');
        const k = String(l.id);
        const marcado = det.sel.has(k);
        const caixa = isAdmin ? `<td class="col-sel"><input type="checkbox" data-id="${esc(k)}" ${marcado ? 'checked' : ''} onchange="marcarLead(this)" aria-label="Selecionar lead"></td>` : '';
        return `<tr${marcado ? ' class="sel"' : ''}>${caixa}${selos ? `<td>${selos}</td>` : '<td class="nulo">—</td>'}${cols.map(c=>cel(l.dados[c])).join('')}</tr>`;
      }).join('')
    : `<tr><td class="nulo" colspan="${cols.length + (isAdmin ? 2 : 1)}" style="text-align:center;padding:30px">Nenhum lead com esses filtros.</td></tr>`;

  document.getElementById('pInfo').textContent =
    `${nf(det.filtrados.length)} de ${nf(det.leads.length)} · página ${det.pagina}/${totalPag}`;
  document.getElementById('pPrev').disabled = det.pagina <= 1;
  document.getElementById('pNext').disabled = det.pagina >= totalPag;
  renderSelecao();
}

function mudarPagina(d) {
  det.pagina += d;
  renderTabela();
  document.querySelector('.table-scroll').scrollTop = 0;
}

/* ── seleção e exclusão de leads (admin) ── */
function leadsDaPagina() {
  const inicio = (det.pagina-1) * POR_PAGINA;
  return det.filtrados.slice(inicio, inicio + POR_PAGINA);
}
function marcarLead(cx) {
  if (cx.checked) det.sel.add(cx.dataset.id); else det.sel.delete(cx.dataset.id);
  cx.closest('tr').classList.toggle('sel', cx.checked);
  renderSelecao();
}
function selecionarPagina(marcar) {
  leadsDaPagina().forEach(l => marcar ? det.sel.add(String(l.id)) : det.sel.delete(String(l.id)));
  renderTabela();
}
function selecionarFiltrados() {
  det.filtrados.forEach(l => det.sel.add(String(l.id)));
  renderTabela();
}
function limparSelecao() {
  det.sel.clear();
  renderTabela();
}
function renderSelecao() {
  if (!isAdmin) return;
  const bar = document.getElementById('selbar');
  const cab = document.getElementById('selPagina');
  const pag = leadsDaPagina();
  const naPag = pag.filter(l => det.sel.has(String(l.id))).length;
  if (cab) {
    cab.checked = pag.length > 0 && naPag === pag.length;
    cab.indeterminate = naPag > 0 && naPag < pag.length;
  }
  const n = det.sel.size;
  bar.hidden = n === 0;
  if (!n) return;
  const todosFiltrados = det.filtrados.every(l => det.sel.has(String(l.id)));
  bar.innerHTML = `
    <span class="qtd">${nf(n)} ${n === 1 ? 'lead selecionado' : 'leads selecionados'}</span>
    ${!todosFiltrados ? `<button class="link" onclick="selecionarFiltrados()">Selecionar todos os ${nf(det.filtrados.length)} do filtro</button>` : ''}
    <button class="link" onclick="limparSelecao()">Limpar seleção</button>
    <span class="sep"></span>
    <button class="btn btn-ghost btn-danger" onclick="openExcluirLeads()">Excluir selecionados</button>`;
}
function openExcluirLeads() {
  const alvo = det.leads.filter(l => det.sel.has(String(l.id)));
  if (!alvo.length) return;
  const amostra = alvo.slice(0, 5).map(l => esc(l.dados.EMAIL || l.email || l.dados.NOME || '(sem e-mail)')).join('<br>');
  openModal('Excluir leads',
    `<p style="font-size:13px;margin-bottom:10px">Isso apaga <b>${nf(alvo.length)}</b> ${alvo.length === 1 ? 'lead' : 'leads'} de ${esc(det.lanc.rotulo || det.lanc.id)}. Não dá para desfazer.</p>
     <p style="font-size:12px;color:var(--muted);font-family:var(--mono);line-height:1.7">${amostra}${alvo.length > 5 ? `<br>e mais ${nf(alvo.length - 5)}` : ''}</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-ghost btn-danger" id="btnConfExcLeads" onclick="confirmExcluirLeads()">Excluir ${nf(alvo.length)}</button>`);
}
async function confirmExcluirLeads() {
  const btn = document.getElementById('btnConfExcLeads');
  btn.disabled = true; btn.textContent = 'Excluindo...';
  const ids = det.leads.filter(l => det.sel.has(String(l.id))).map(l => l.id);
  const lancId = det.lanc.id;
  const apagados = new Set();
  try {
    for (let i = 0; i < ids.length; i += 200) {
      const { data, error } = await sb.from('leads').delete()
        .eq('lancamento_id', lancId).in('id', ids.slice(i, i + 200)).select('id');
      if (error) throw error;
      (data || []).forEach(r => apagados.add(String(r.id)));
    }
  } catch (e) {
    toast('Erro ao excluir: ' + e.message, 'error');
  }
  closeModal();
  if (!apagados.size) { toast('Nenhum lead foi excluído. Confira se sua conta é admin.', 'error'); return; }

  const { count } = await sb.from('leads').select('id', { count:'exact', head:true }).eq('lancamento_id', lancId);
  if (typeof count === 'number') await sb.from('lead_lancamentos').update({ total: count }).eq('id', lancId);

  // atualiza a tela sem recarregar tudo
  det.leads = det.leads.filter(l => !apagados.has(String(l.id)));
  const conta = {};
  det.leads.forEach(l => { if (l.email) conta[l.email] = (conta[l.email]||0)+1; });
  det.leads.forEach(l => { l.rep = !!(l.email && conta[l.email] > 1); });
  det.sel.clear();
  lancs = await fetchLancs();
  renderDetalhe();
  aplicarFiltros();
  toast(`${nf(apagados.size)} ${apagados.size === 1 ? 'lead excluído' : 'leads excluídos'}.`,
        apagados.size < ids.length ? 'error' : '');
}

/* ── exportar ── */
async function exportCSV(id, apenasFiltrados) {
  let lanc, linhas;
  if (apenasFiltrados && det.lanc && det.lanc.id === id) {
    lanc = det.lanc;
    linhas = det.filtrados;
  } else {
    lanc = lancs.find(l => l.id === id);
    toast('Preparando ' + id + '...');
    try {
      const brutos = await fetchLeads(id);
      linhas = brutos.map(l => ({ dados: l.dados, rep:false, rec:null }));
    } catch(e) { toast('Erro ao exportar: ' + e.message, 'error'); return; }
  }
  if (!linhas.length) { toast('Não há leads para exportar.', 'error'); return; }

  let cols = (lanc && lanc.cols && lanc.cols.length) ? lanc.cols.slice() : [];
  if (!cols.length) {
    const vistas = new Set();
    linhas.forEach(l => Object.keys(l.dados).forEach(k => vistas.add(k)));
    cols = [...vistas];
  }

  const q = v => '"' + (v==null?'':String(v)).replace(/"/g,'""') + '"';
  const csv = [
    [...cols, 'SITUACAO'].join(';'),
    ...linhas.map(l => {
      const marcas = [l.rep?'repetido':'', l.rec?('recorrente: '+l.rec.join(' ')):''].filter(Boolean).join(' ');
      return [...cols.map(c=>q(l.dados[c])), q(marcas)].join(';');
    })
  ].join('\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = id.replace(/[^\w\-]+/g,'_') + '.csv';
  a.click();
  toast(nf(linhas.length) + ' leads exportados!');
}

     <div class="field"><label>Lançamento de destino</label>
       <select id="imp-destino" onchange="onDestinoChange()">

function onDestinoChange() {
  const novo = document.getElementById('imp-destino').value === '__novo__';
  document.getElementById('blocoNovo').style.display = novo ? 'block' : 'none';
  document.getElementById('blocoSubstituir').style.display = novo ? 'none' : 'block';
  if (novo) {
    const campo = document.getElementById('novo-id');
    if (campo && !campo.value && csvNomeArquivo) campo.value = sugereId(csvNomeArquivo);
  }
}
function sugereId(arquivo) {
  const m = arquivo.match(/L\d+[A-Z\-]*/i);
  return m ? m[0].toUpperCase().replace(/[_\-]+$/,'') : '';
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadArea').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f) handleCSVFile(f);
}

function handleCSVFile(file) {
  if (!file) return;
  csvNomeArquivo = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    const linhas = parseCSV(e.target.result);
    if (linhas.length < 2) { toast('Não consegui ler cabeçalho e linhas nesse arquivo.', 'error'); return; }
    csvCols = linhas[0].map(c=>c.trim()).filter(Boolean);
    csvParsed = linhas.slice(1).map(l => {
      const o = {};
      csvCols.forEach((c,i) => { o[c] = (l[i]||'').trim(); });
      return o;
    });

    document.getElementById('uploadPreview').textContent =
      file.name + ' — ' + nf(csvParsed.length) + ' leads';
    const campo = document.getElementById('novo-id');
    if (campo && !campo.value) campo.value = sugereId(file.name);

    const emails = csvParsed.map(r => (r.EMAIL||'').toLowerCase()).filter(Boolean);
    const repetidos = emails.length - new Set(emails).size;
    const prev = csvParsed.slice(0,3);
    document.getElementById('importPreview').innerHTML = `
      <p style="font-size:11px;color:var(--muted);margin:10px 0 6px">
        ${csvCols.length} colunas · ${emails.length ? repetidos + ' e-mail(s) repetido(s) no arquivo, todos serão importados e marcados' : 'sem coluna EMAIL: repetidos e recorrentes ficam sem marcação'}
      </p>
      <div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--r)">
        <table style="font-size:11px">
          <thead><tr>${csvCols.map(c=>`<th style="padding:5px 8px">${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>${prev.map(r=>`<tr>${csvCols.map(c=>`<td style="padding:4px 8px">${esc((r[c]||'').slice(0,40))}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>`;
    document.getElementById('btnImport').style.display = 'inline-block';
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(texto) {
  if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);
  const primeira = texto.split('\n')[0];
  const sep = (primeira.match(/;/g)||[]).length > (primeira.match(/,/g)||[]).length ? ';' : ',';
  const linhas = [];
  let linha = [], valor = '', aspas = false;
  for (let i=0;i<texto.length;i++) {
    const c = texto[i];
    if (aspas) {
      if (c === '"') { if (texto[i+1] === '"') { valor+='"'; i++; } else aspas = false; }
      else valor += c;
    } else {
      if (c === '"') aspas = true;
      else if (c === sep) { linha.push(valor); valor=''; }
      else if (c === '\n') { linha.push(valor); linhas.push(linha); linha=[]; valor=''; }
      else if (c !== '\r') valor += c;
    }
  }
  if (valor !== '' || linha.length) { linha.push(valor); linhas.push(linha); }
  return linhas.filter(l => l.some(c => c.trim() !== ''));
}

async function confirmImport() {
  if (!csvParsed.length) return;
  const btn = document.getElementById('btnImport');
  const destino = document.getElementById('imp-destino').value;
  const criarNovo = destino === '__novo__';

  let id = destino, rotulo = null;
  if (criarNovo) {
    id = (document.getElementById('novo-id').value||'').trim();
    rotulo = (document.getElementById('novo-rotulo').value||'').trim() || null;
    if (!id) { toast('Dê um código ao lançamento.', 'error'); return; }
    if (lancs.some(l => l.id === id)) { toast('Já existe um lançamento com esse código.', 'error'); return; }
  }

  const substituir = !criarNovo && document.getElementById('imp-substituir').checked;

  btn.textContent = 'Importando...'; btn.disabled = true;
  try {
    const registro = { id, cols: csvCols, total: csvParsed.length, atualizado_em: new Date().toISOString() };
    if (rotulo) registro.rotulo = rotulo;
    const { error: e1 } = await sb.from('lead_lancamentos').upsert(registro);
    if (e1) throw e1;

    if (substituir) {
      const { error: e2 } = await sb.from('leads').delete().eq('lancamento_id', id);
      if (e2) throw e2;
    }

    for (let i=0;i<csvParsed.length;i+=LOTE) {
      const lote = csvParsed.slice(i, i+LOTE).map(dados => ({ lancamento_id:id, dados }));
      const { error: e3 } = await sb.from('leads').insert(lote);
      if (e3) throw e3;
      btn.textContent = `Importando... ${Math.min(i+LOTE, csvParsed.length)}/${csvParsed.length}`;
    }

    const { count } = await sb.from('leads').select('id', { count:'exact', head:true }).eq('lancamento_id', id);
    if (typeof count === 'number') await sb.from('lead_lancamentos').update({ total: count }).eq('id', id);

    closeModal();
    toast(nf(csvParsed.length) + ' leads importados em ' + id + '!');
    lancs = await fetchLancs();
    renderLancamentos();
  } catch(e) {
    toast('Erro: ' + e.message, 'error');
    btn.textContent = 'Importar para o banco'; btn.disabled = false;
  }
}

/* ── renomear ── */

async function confirmRenomear(idAtual) {
  const novoId = (document.getElementById('ren-id').value||'').trim();
  const novoRotulo = (document.getElementById('ren-rotulo').value||'').trim() || null;
  if (!novoId) { toast('O código não pode ficar vazio.', 'error'); return; }
  if (novoId !== idAtual && lancs.some(l => l.id === novoId)) {
    toast('Já existe um lançamento com esse código.', 'error'); return;
  }

  const btn = document.getElementById('btnRenomear');
  btn.textContent = 'Salvando...'; btn.disabled = true;
  const { error } = await sb.from('lead_lancamentos')
    .update({ id: novoId, rotulo: novoRotulo, atualizado_em: new Date().toISOString() })
    .eq('id', idAtual);

  if (error) {
    const fk = /foreign key|violates|constraint/i.test(error.message);
    toast(fk ? 'O banco recusou a troca de código: falta rodar o leads_rename.sql.' : 'Erro: ' + error.message, 'error');
    btn.textContent = 'Salvar'; btn.disabled = false;
    return;
  }

  closeModal();
  toast('Lançamento atualizado.');
  lancs = await fetchLancs();
  if (det.lanc && det.lanc.id === idAtual) {
    det.lanc = lancs.find(l => l.id === novoId) || det.lanc;
    renderDetalhe(); aplicarFiltros();
  } else {
    renderLancamentos();
  }
}

/* ── excluir ── */
function openExcluir() {
  const l = det.lanc;
  openModal('Excluir lançamento',
    `<p style="font-size:12px;color:var(--muted);margin-bottom:12px">
       Isso apaga ${nf(det.leads.length)} leads de ${esc(l.id)}. Não dá para desfazer.</p>
     <div class="field"><label>Digite o código para confirmar</label>
       <input type="text" id="exc-confirma" autocomplete="off"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-ghost btn-danger" onclick="confirmExcluir()">Excluir</button>`);
}
async function confirmExcluir() {
  const l = det.lanc;
  if ((document.getElementById('exc-confirma').value||'').trim() !== l.id) {
    toast('O código digitado não confere.', 'error'); return;
  }
  const { error } = await sb.from('lead_lancamentos').delete().eq('id', l.id);
  if (error) { toast('Não foi possível excluir: ' + error.message, 'error'); return; }
  closeModal();
  toast('Lançamento ' + l.id + ' excluído.');
  lancs = await fetchLancs();
  voltarParaLista();
}

async function doLogout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

init();
</script>
</body>
</html>
