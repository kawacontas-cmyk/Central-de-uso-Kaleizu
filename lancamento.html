<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Lançamento · Instituto Kaleizu</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="acesso.js" data-tool="lancamento"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#060B1F; --surface:#0e1530; --card:#0f1428; --border:rgba(255,255,255,0.08);
  --text:#e8eaf6; --muted:#8b93b8; --hint:#3a4060; --gold:#CDA04C; --gold-light:#e8c97a;
  --green:#5fcd8a; --red:#e05a5a; --blue:#5b8aff; --purple:#a98bff;
}
*{box-sizing:border-box;margin:0;padding:0}

/* barra superior — mesma da Central de Leads */
.topbar{height:56px;background:#0a0e1f;border-bottom:2px solid #1A1E31;display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:50}
.topbar-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-logo img{width:32px;height:32px;object-fit:contain;mix-blend-mode:lighten}
.topbar-name{font-size:14px;font-weight:500;color:var(--gold);padding-left:10px;border-left:1px solid var(--border);white-space:nowrap}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-count{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace}
.btn-topbar{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-topbar:hover{color:var(--text);border-color:var(--gold)}
.btn-topbar.voltar-app{border-color:rgba(205,160,76,0.4);color:#CDA04C}
@media (max-width:520px){.topbar-count{display:none}}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.mono{font-family:'DM Mono',monospace}
.wrap{max-width:1600px;margin:0 auto;padding:24px}

/* topo */
.topo{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.voltar{color:var(--muted);text-decoration:none;font-size:13px}
.voltar:hover{color:var(--gold-light)}
.titulo{margin-right:auto;min-width:0}
.titulo h1{font-size:20px;font-weight:600}
.subtitulo{font-size:12px;color:var(--muted);margin-top:2px}

/* lista de lançamentos */
.lanc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.lanc-card{display:flex;flex-direction:column;gap:14px;text-align:left;padding:20px;cursor:pointer;color:var(--text);font:inherit;
  transition:border-color .15s,transform .15s}
.lanc-card:hover{border-color:rgba(205,160,76,.45);transform:translateY(-2px)}
.lanc-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lc-topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lc-nome{font-size:22px;font-weight:600;letter-spacing:-.01em}
.lc-periodo{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:-8px}
.selo{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:99px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.selo.andamento{background:rgba(95,205,138,.14);color:var(--green)}
.selo.andamento::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.selo.agendado{background:rgba(91,138,255,.14);color:var(--blue)}
.selo.encerrado{background:rgba(139,147,184,.12);color:var(--muted)}
.lc-nums{display:flex;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--border)}
.lc-nums b{display:block;font-family:'DM Mono',monospace;font-size:16px;font-weight:500;margin-top:4px}
.lc-meta{height:4px;background:var(--surface);border-radius:2px;overflow:hidden}
.lc-meta span{display:block;height:100%;background:var(--gold);border-radius:2px}
.lanc-novo{border:1px dashed rgba(205,160,76,.35);background:transparent;border-radius:12px;color:var(--muted);font:inherit;
  min-height:190px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lanc-novo:hover{border-color:var(--gold);color:var(--gold-light)}
.lanc-novo .mais{font-size:26px;line-height:1;color:var(--gold)}
.lista-vazia{color:var(--muted);padding:48px 0;text-align:center}
select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.status{display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.pulso{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(95,205,138,.6);animation:pulso 2s infinite}
.pulso.parado{background:var(--red);animation:none}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(95,205,138,0)}100%{box-shadow:0 0 0 0 rgba(95,205,138,0)}}
@media (prefers-reduced-motion:reduce){.pulso{animation:none}}
.btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--gold);color:var(--gold-light)}

/* cards */
.rotulo{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:20px}
.kpi .valor{font-family:'DM Mono',monospace;font-size:30px;font-weight:500;margin-top:8px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.destaque .valor{color:var(--gold-light)}

/* funil */
.funil{padding:20px;margin-bottom:16px}
.funil-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.funil-cab .desc{font-size:12px;color:var(--muted)}
.funil-trilho{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center;gap:8px}
.etapa{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:0}
.etapa .num{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;margin-top:6px;letter-spacing:-.02em}
.etapa .sub{font-size:12px;color:var(--muted);margin-top:2px}
.taxa{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px}
.taxa .pct{font-family:'DM Mono',monospace;font-size:15px;color:var(--gold-light);font-weight:500}
.taxa .rotulo{font-size:9px}
.taxa .seta{width:100%;height:1px;background:var(--border);position:relative;margin:4px 0}
.taxa .seta::after{content:"";position:absolute;right:-1px;top:-3px;border:3.5px solid transparent;border-left:5px solid var(--hint)}
.funil-aviso{font-size:12px;color:var(--muted);margin-top:12px}
@media (max-width:980px){
  .funil-trilho{grid-template-columns:1fr}
  .taxa{flex-direction:row;justify-content:center;gap:10px;min-width:0}
  .taxa .seta{display:none}
}

/* meta de leads */
.meta{padding:16px 20px;margin-bottom:16px;display:none}
.meta.on{display:block}
.meta .linha{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:12px;flex-wrap:wrap}
.meta .num{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted)}
.barra{height:8px;background:var(--surface);border-radius:4px;overflow:hidden;position:relative}
.barra .cheio{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:4px;transition:width .6s}
.barra .ritmo{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.5}

/* grade */
.grade{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.bloco{padding:20px}
.bloco h2{font-size:15px;font-weight:600;margin-bottom:4px}
.bloco .desc{font-size:12px;color:var(--muted);margin-bottom:16px}
.grafico{position:relative;height:300px}

/* tabelas */
.tabela-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
th:hover{color:var(--gold-light)}
th.ord{color:var(--gold)}
td{padding:10px;border-bottom:1px solid var(--border);text-align:right;font-family:'DM Mono',monospace;white-space:nowrap}
td:first-child{font-family:'DM Sans',sans-serif;white-space:normal;max-width:340px}
td .fraco{display:block;font-size:11px;color:var(--hint);font-family:'DM Mono',monospace}
tr:last-child td{border-bottom:none}
.bom{color:var(--green)} .ruim{color:var(--red)}
.vazio{color:var(--muted);text-align:center;padding:28px 10px;font-family:'DM Sans',sans-serif}
.barrinha{display:inline-block;height:4px;background:var(--gold);border-radius:2px;vertical-align:middle;margin-left:8px;opacity:.7}

/* aviso */
.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}
.aviso.erro{border-color:var(--red)}

[hidden]{display:none!important}
.btn.primario{background:var(--gold);border-color:var(--gold);color:#060B1F;font-weight:600}
.btn.primario:hover{background:var(--gold-light);color:#060B1F}
.btn:disabled{opacity:.5;cursor:wait}

/* modal */
dialog{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:0;width:calc(100% - 32px);max-width:640px;max-height:calc(100vh - 48px);margin:auto}
dialog::backdrop{background:rgba(6,11,31,.78);backdrop-filter:blur(3px)}
.modal-cab{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.modal-cab h2{font-size:17px;font-weight:600}
.fechar{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.fechar:hover{color:var(--text)}
.modal-corpo{padding:22px}

/* formulário */
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.form label.largo{grid-column:1/-1}
.form input{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font:inherit;font-weight:400}
.form input:focus{outline:none;border-color:var(--gold)}
.form input[readonly]{opacity:.6}
.form small{font-size:12px;color:var(--muted);font-weight:400}
.form .opc{color:var(--hint);font-weight:400}
.form .erro{grid-column:1/-1;color:var(--red);font-size:13px}
.acoes{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

/* checklist */
.check{list-style:none;display:flex;flex-direction:column;gap:4px;counter-reset:passo}
.check>li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--border);counter-increment:passo}
.check>li:last-child{border-bottom:none}
.check>li>div{min-width:0}
.check .st{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--hint);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
.check .st::before{content:counter(passo)}
.check li.ok .st{background:var(--green);border-color:var(--green);color:#060B1F}
.check li.ok .st::before{content:"✓";font-weight:700}
.check li.manual .st{border-color:var(--gold);color:var(--gold)}
.check b{font-size:14px;font-weight:600}
.check p{font-size:13px;color:var(--muted);margin-top:4px}
.check code{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold-light)}
.check .vivo{color:var(--text)}
.check li.ok .vivo{color:var(--green)}
.check details{margin-top:10px;font-size:13px}
.check summary{cursor:pointer;color:var(--muted)}
.check summary:hover{color:var(--gold-light)}
.copia{display:flex;gap:8px;align-items:stretch;margin-top:10px}
.copia code{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap;display:block}
.nota{font-size:12px;color:var(--hint);margin-top:14px}

/* filtro de data e abas */
.filtro{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;margin-bottom:14px}
.filtro::before{display:none}
.f-tit{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.f-tit svg{width:16px;height:16px;color:var(--gold);display:block}
.f-rot{font-size:12px;font-weight:400;color:var(--muted)}
.f-campos{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.f-campos input[type=date]{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;color-scheme:dark}
.f-campos input[type=date]:focus{outline:none;border-color:var(--gold)}
.link-btn{background:none;border:none;color:var(--gold);font:inherit;font-size:12px;cursor:pointer;padding:4px 6px}
.link-btn:hover{color:var(--gold-light)}
.abas{display:flex;gap:4px;padding:5px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:22px;overflow-x:auto}
.aba{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.aba svg{width:15px;height:15px}
.aba:hover{color:var(--text)}
.aba.on{background:var(--surface);color:var(--gold-light);box-shadow:inset 0 0 0 1px rgba(205,160,76,.3)}
.carregando{color:var(--muted);padding:40px 0;text-align:center}

/* visão macro */
.macro{padding:18px 20px}
.macro-linha{display:flex;align-items:center;gap:12px;margin-top:10px}
.macro-valor{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macro .sub{font-size:12px;color:var(--muted);margin-top:8px}
.grafico.alto{height:330px;margin-top:10px}
.mini{padding:18px 20px;min-height:280px;display:flex;flex-direction:column;min-width:0}
.mini-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.mini-sub{font-size:12px;color:var(--muted);margin:4px 0 14px}
.mini-vazio{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;padding:0 12px}
.explorar{cursor:pointer;transition:border-color .15s}
.explorar:hover,.explorar:focus-within{border-color:rgba(205,160,76,.45)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid rgba(205,160,76,.4);color:var(--gold-light);
  border-radius:99px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;opacity:0;transform:translateY(-2px);transition:opacity .15s,transform .15s}
.chip svg{width:13px;height:13px}
.explorar:hover .chip,.explorar:focus-within .chip,.chip:focus-visible{opacity:1;transform:none}
@media (hover:none){.chip{opacity:1;transform:none}}
.barras-h{display:flex;flex-direction:column;gap:9px;max-height:190px;overflow-y:auto;padding-right:4px}
.bh{display:grid;grid-template-columns:minmax(0,42%) 1fr auto;align-items:center;gap:10px;font-size:12px}
.bh-rot{color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-trilho{height:12px;background:var(--surface);border-radius:3px;overflow:hidden}
.bh-trilho span{display:block;height:100%;background:var(--green);border-radius:3px}
.bh-num{font-family:'DM Mono',monospace;color:var(--text);min-width:28px;text-align:right}
.funil-svg{width:100%;height:auto;max-height:210px;margin-top:auto}
.funil-svg .fv{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;fill:#fff}
.funil-svg .fr{font-family:'DM Sans',sans-serif;font-size:10px;fill:rgba(255,255,255,.8)}

/* janela Explorar */
#explorar{max-width:1200px;width:calc(100% - 32px);max-height:calc(100vh - 40px)}
#explorar .modal-corpo{background:var(--bg);max-height:calc(100vh - 110px);overflow-y:auto}
.exp-sub{font-size:12px;color:var(--muted);margin-top:2px}
.exp-b{margin-top:16px}
.lista-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.lista-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lista-acoes input{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;min-width:240px}
.lista-acoes input:focus{outline:none;border-color:var(--gold)}
#tabOrg td.esq{text-align:left;font-family:'DM Sans',sans-serif}
#tabOrg th:not(:first-child){text-align:left}
#tabOrg td:last-child,#tabOrg th:last-child{text-align:right}
.paginacao{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.paginacao:empty{display:none}
@media (max-width:640px){#explorar{width:100%;max-width:none;max-height:100vh;border-radius:0}.lista-acoes input{min-width:0;width:100%}}

/* respostas abertas */
.abertas{list-style:none;display:flex;flex-direction:column;gap:8px}
.abertas li{font-size:13px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;line-height:1.45}

/* cards das abas */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:26px}
.k{padding:18px;min-width:0}
.k-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.k-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.k-ico svg{width:16px;height:16px}
.k .valor{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;margin-top:10px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .valor .de{font-size:13px;color:var(--muted);margin-left:6px;letter-spacing:0}
.k .sub{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}
.secao{display:flex;align-items:center;gap:14px;margin:6px 0 14px;font-family:'DM Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.secao::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(205,160,76,.35),transparent)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}
.bloco.largo{margin-bottom:16px}
.faixa{padding:14px 18px;margin-bottom:22px;border-radius:12px;border:1px solid rgba(205,160,76,.3);background:rgba(205,160,76,.06);font-size:13px}
.faixa b{font-weight:600}
.faixa p{color:var(--muted);margin-top:3px;font-size:12px}
.faixa.verde{border-color:rgba(95,205,138,.3);background:rgba(95,205,138,.06)}
.faixa .btn{margin-top:10px}
.prog{height:8px;background:var(--surface);border-radius:4px;overflow:hidden;margin-top:14px}
.prog span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-light))}

function aviso(msg, erro = false) {
  const el = $('aviso');

  el.className = 'aviso on' + (erro ? ' erro' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'aviso', 3500);
}

function diasEntre(inicio, fim) {
  const out = [];
  const d = new Date(inicio + 'T12:00:00Z');
  const f = new Date(fim + 'T12:00:00Z');
  while (d <= f) { out.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 1); }
  return out;
}

function tempoAtras(iso) {
  if (!iso) return null;
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return 'agora';
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min / 60);
  return `há ${h} h`;
}

async function checarAdmin() {
  const { data } = await sb.auth.getUser();
  ehAdmin = data?.user?.user_metadata?.role === 'admin';
}

let atualId = null;

async function iniciar(selecionar) {
  await checarAdmin();
  const { data, error } = await sb.from('painel_lancamentos').select('*').order('inicio', { ascending: false });
  if (error) { aviso('Não foi possível ler os lançamentos: ' + error.message, true); return; }

  $('topbarCount').textContent = `${lancamentos.length} ${lancamentos.length === 1 ? 'lançamento' : 'lançamentos'}`;
  if (selecionar) history.replaceState(null, '', '?id=' + encodeURIComponent(selecionar));
  rotear();
}

function rotear() {
  const id = new URLSearchParams(location.search).get('id');
  if (id && lancamentos.some(l => l.id === id)) mostrarPainel(id);
  else mostrarLista();
}
window.addEventListener('popstate', rotear);

function abrirLancamento(id) {
  history.pushState(null, '', '?id=' + encodeURIComponent(id));

function voltarLista() {
  history.pushState(null, '', location.pathname);

function situacao(l) {
  const hoje = hojeSP();
  if (l.inicio > hoje) return { classe: 'agendado', txt: 'Agendado', ordem: 1 };
  if (l.fim && l.fim < hoje) return { classe: 'encerrado', txt: 'Encerrado', ordem: 2 };
  return { classe: 'andamento', txt: 'Em andamento', ordem: 0 };
}
function periodo(l) {
  const ini = fmtData(l.inicio);
  if (l.fim) return `${ini.slice(0, 5)} a ${fmtData(l.fim)}`;
  return l.inicio > hojeSP() ? `começa em ${ini}` : `desde ${ini}`;
}

function mostrarPainel(id) {
  const l = lancamentos.find(x => x.id === id);
  if (!l) return mostrarLista();
  atualId = id;
  $('telaLista').hidden = true;
  $('telaPainel').hidden = false;
  $('titulo').textContent = l.rotulo || l.id;
  $('subtitulo').textContent = `${periodo(l)} · ${situacao(l).txt}`;
  $('btnTodos').hidden = false;
  $('boxStatus').hidden = false;
  $('btnAtualizar').hidden = false;
  $('btnChecklist').hidden = $('btnEditar').hidden = !ehAdmin;
  $('btnNovo').hidden = true;
  document.title = `${l.rotulo || l.id} · Painel do Lançamento`;
  if (est.lanc?.id !== id) { $('conteudo').innerHTML = '<p class="carregando">Carregando…</p>'; $('abas').innerHTML = ''; }
  carregar();
}

async function mostrarLista() {
  clearTimeout(timer);
  atualId = null;
  $('telaPainel').hidden = true;
  $('telaLista').hidden = false;
  $('titulo').textContent = 'Painel do Lançamento';
  $('subtitulo').textContent = 'Escolha um lançamento para analisar';
  $('btnTodos').hidden = true;
  $('boxStatus').hidden = true;
  $('btnAtualizar').hidden = $('btnChecklist').hidden = $('btnEditar').hidden = true;
  $('btnNovo').hidden = !ehAdmin;
  document.title = 'Painel do Lançamento · Instituto Kaleizu';

  if (!lancamentos.length) {
    $('gradeLanc').innerHTML = ehAdmin
      ? '<button class="lanc-novo" onclick="abrirForm()"><span class="mais">+</span>Cadastrar o primeiro lançamento</button>'
      : '<p class="lista-vazia">Nenhum lançamento cadastrado ainda.</p>';
    return;
  }

  const [meta, lds] = await Promise.all([
    sb.from('painel_meta_diario').select('lancamento_id, gasto'),
    sb.from('painel_leads_diario').select('lancamento_id, leads'),
  ]);
  if (atualId) return; // o usuário já abriu um lançamento enquanto carregava
  const soma = (linhas, campo) => (linhas || []).reduce((m, r) => {
    m[r.lancamento_id] = (m[r.lancamento_id] || 0) + Number(r[campo]); return m;
  }, {});
  const gastos = soma(meta.data, 'gasto');
  const leads = soma(lds.data, 'leads');

  const ordenados = [...lancamentos].sort((a, b) =>
    situacao(a).ordem - situacao(b).ordem || b.inicio.localeCompare(a.inicio));

  $('gradeLanc').innerHTML = ordenados.map(l => {
    const st = situacao(l);
    const g = gastos[l.id] || 0, n = leads[l.id] || 0;
    const barra = l.meta_leads
      ? `<div class="lc-meta" title="${int.format(n)} de ${int.format(l.meta_leads)} leads"><span style="width:${Math.min(100, n / l.meta_leads * 100)}%"></span></div>`
      : '';
    return `<button class="card lanc-card" onclick="abrirLancamento('${esc(l.id)}')">

        <div><span class="rotulo">CPL</span><b>${n && g ? brl.format(g / n) : '—'}</b></div>
      </div>

  }).join('') + (ehAdmin ? '<button class="lanc-novo" onclick="abrirForm()"><span class="mais">+</span>Novo lançamento</button>' : '');

const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[n] || ''}</svg>`;

const moeda = v => v != null && isFinite(v) ? brl.format(v) : '—';
const taxa = v => v != null && isFinite(v) ? pct(v) : '—';
const ddmm = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';

// PostgREST devolve no máximo 1000 linhas por chamada: pagina até acabar.
async function buscarTudo(tabela, id, ordem) {
  const out = [];
  for (let de = 0; ; de += 1000) {
    let q = sb.from(tabela).select('*').eq('lancamento_id', id);
    for (const col of ordem) q = q.order(col);
    const { data, error } = await q.range(de, de + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

async function carregar(manual = false) {
  clearTimeout(timer);
  const lanc = lancamentos.find(l => l.id === atualId);
  if (!lanc) return;
  const trocou = est.lanc?.id !== lanc.id;
  try {
    const [adDia, utmDia, sync] = await Promise.all([
      buscarTudo('painel_meta_ad_dia', lanc.id, ['data', 'ad_id']),
      buscarTudo('painel_leads_utm_dia', lanc.id, ['data', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term']),
      sb.from('meta_insights').select('atualizado_em').order('atualizado_em', { ascending: false }).limit(1),
    ]);
    if (atualId !== lanc.id) return; // trocou de tela enquanto carregava
    Object.assign(est, { lanc, adDia, utmDia, sync: sync.data?.[0]?.atualizado_em });
    if (trocou) { est.aba = 'geral'; est.filtroMexido = false; }
    est.pesq = null;
    if (est.aba === 'pesquisa') await carregarPesquisa();
    definirPeriodoPadrao();
    if (!est.filtroMexido) { est.de = est.padraoDe; est.ate = est.padraoAte; }
    atualizarStatus();
    montarAbas();
    montarFiltro();
    if (!$('explorar').open) renderAba();
    if (manual === true) aviso('Painel atualizado');
  } catch (e) {
    aviso('Erro ao carregar: ' + e.message, true);
    $('pulso').classList.add('parado');
    $('txtStatus').textContent = 'erro ao carregar';
  }
  timer = setTimeout(carregar, INTERVALO);
}

function atualizarStatus() {
  const atras = tempoAtras(est.sync);
  const velho = !est.sync || (Date.now() - new Date(est.sync).getTime()) > 40 * 60000;
  $('pulso').classList.toggle('parado', velho);
  $('txtStatus').textContent = atras ? `Meta atualizado ${atras} · leads ao vivo` : 'Meta ainda sem dados · leads ao vivo';
}

// Período padrão: do começo dos anúncios (ou do primeiro lead, se veio antes)
// até o fim (ou o último lead, se veio depois), nunca além de hoje.
function definirPeriodoPadrao() {
  const l = est.lanc, hoje = hojeSP();
  const datas = est.utmDia.map(r => r.data).filter(Boolean).sort();
  let de = l.inicio, ate = l.fim && l.fim < hoje ? l.fim : hoje;
  if (datas.length) {
    if (datas[0] < de) de = datas[0];
    if (datas[datas.length - 1] > ate) ate = datas[datas.length - 1];
  }
  if (ate > hoje) ate = hoje;
  if (de > ate) de = ate;
  est.padraoDe = de; est.padraoAte = ate;
}

function montarAbas() {
  $('abas').innerHTML = ABAS.map(a =>
    `<button class="aba" role="tab" data-aba="${a.id}" onclick="trocarAba('${a.id}')">${ico(a.ico)}${a.nome}</button>`).join('');
}

function montarFiltro() {
  $('fIco').innerHTML = ico('calendario');
  $('fDe').value = est.de; $('fAte').value = est.ate;
  $('fDe').min = $('fAte').min = est.padraoDe;
  $('fDe').max = $('fAte').max = hojeSP();
  $('fRotulo').textContent = est.aba === 'metas' ? '· a aba Metas considera o lançamento inteiro'
    : est.aba === 'pesquisa' ? '· a aba Pesquisa considera todas as respostas'
    : `· ${ddmm(est.de)} — ${ddmm(est.ate)}`;
  $('fLimpar').hidden = !est.filtroMexido;
}

function mudarFiltro() {
  let de = $('fDe').value, ate = $('fAte').value;
  if (!de || !ate) return;
  if (de > ate) [de, ate] = [ate, de];
  Object.assign(est, { de, ate, filtroMexido: true });
  montarFiltro();
  renderAba();
}

function limparFiltro() {
  Object.assign(est, { de: est.padraoDe, ate: est.padraoAte, filtroMexido: false });
  montarFiltro();
  renderAba();
}

function trocarAba(id) {
  est.aba = id;
  montarFiltro();
  renderAba();
}

// O lead casa com o anúncio pelo utm_content (padrão novo, {{ad.name}});
// se não casar, tenta o utm_term (bases antigas usavam o nome do anúncio ali).
function casaLead(r, anuncio) {
  return casa(r.utm_content, anuncio) || casa(r.utm_term, anuncio);
}
function casa(valor, anuncio) {
  const u = norm(valor);
  return !!u && (u === norm(anuncio.ad_name) || u === norm(anuncio.ad_id));
}
function ehPago(r, nomesAnuncio) {
  const c = norm(r.utm_content), t = norm(r.utm_term);
  return (c && nomesAnuncio.has(c)) || (t && nomesAnuncio.has(t)) ||
    FONTES_PAGAS.includes(norm(r.utm_source)) || MEIOS_PAGOS.includes(norm(r.utm_medium));
}

function calcular(de, ate) {
  const dentro = d => d >= de && d <= ate;
  const ads = est.adDia.filter(a => dentro(a.data));
  const utm = est.utmDia.filter(r => dentro(r.data));
  const nomes = new Set();
  est.adDia.forEach(a => { if (norm(a.ad_name)) nomes.add(norm(a.ad_name)); nomes.add(norm(a.ad_id)); });

  const vazio = () => ({ gasto: 0, impr: 0, cliques: 0, lpv: 0, leadsMeta: 0, leads: 0, pagos: 0, organicos: 0 });
  const dias = diasEntre(de, ate);
  const porDia = Object.fromEntries(dias.map(d => [d, vazio()]));
  const t = vazio();
  const campos = [['gasto', 'gasto'], ['impr', 'impressoes'], ['cliques', 'cliques_link'], ['lpv', 'lpv'], ['leadsMeta', 'leads_meta']];
  for (const a of ads) {
    for (const [k, c] of campos) {
      const v = Number(a[c] || 0);
      t[k] += v;
      if (porDia[a.data]) porDia[a.data][k] += v;
    }
  }
  for (const r of utm) {
    const n = Number(r.leads);
    r._pago = ehPago(r, nomes);
    const k = r._pago ? 'pagos' : 'organicos';
    t.leads += n; t[k] += n;
    if (porDia[r.data]) { porDia[r.data].leads += n; porDia[r.data][k] += n; }
  }
  // Sem nenhum lead identificado como tráfego, usa a atribuição do Meta para as taxas.
  const trafego = t.pagos || t.leadsMeta;
  const trafegoDia = d => porDia[d].pagos || (t.pagos ? 0 : porDia[d].leadsMeta);
  return { de, ate, dias, porDia, t, ads, utm, nomes, trafego, trafegoDia, usaBanco: t.pagos > 0 };
}

function renderAba() {
  for (const k in charts) { charts[k].destroy(); delete charts[k]; }
  document.querySelectorAll('.aba').forEach(b => {
    const on = b.dataset.aba === est.aba;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });
  const inteiro = est.aba === 'metas' || est.aba === 'pesquisa';
  const c = inteiro ? calcular(est.padraoDe, est.padraoAte) : calcular(est.de, est.ate);
  ({ geral: abaGeral, midia: abaMidia, criativos: abaCriativos, origem: abaOrigem, organico: abaOrganico, pesquisa: abaPesquisa, metas: abaMetas })[est.aba](c);
}

function formatar(v, fmt) {
  if (v == null || !isFinite(v)) return '—';
  return fmt === 'moeda' ? brl.format(v) : fmt === 'pct' ? pct(v) : int.format(v);
}
function formatarEixo(v, fmt) {
  if (fmt === 'moeda') return 'R$ ' + int.format(v);
  if (fmt === 'pct') return (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
  return int.format(v);
}

function desenhar(id, tipo, labels, series, { empilhar = false } = {}) {
  const fmtEixo = eixo => (series.find(s => (s.eixo || 'y') === eixo) || {}).fmt || 'int';
  const usaY1 = series.some(s => s.eixo === 'y1');
  const escala = (eixo, extra) => ({
    beginAtZero: true,
    ticks: { callback: v => formatarEixo(v, fmtEixo(eixo)), ...(fmtEixo(eixo) === 'int' ? { precision: 0 } : {}) },
    ...extra,
  });
  charts[id] = new Chart($(id), {
    type: tipo,
    data: {
      labels,
      datasets: series.map(s => {
        const t = s.tipo || tipo;
        return {
          type: t, label: s.label, data: s.data, fmt: s.fmt || 'int', yAxisID: s.eixo || 'y',
          backgroundColor: s.area ? s.cor + '2e' : s.cor, borderColor: s.cor, fill: !!s.area,
          borderWidth: t === 'line' ? 2 : 0, borderRadius: 4, maxBarThickness: 34,
          pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: s.cor, tension: .3, spanGaps: true,
          stack: empilhar ? 'pilha' : undefined,
        };
      }),
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: series.length > 1, labels: { boxWidth: 10, boxHeight: 10 } },
        tooltip: {
          backgroundColor: '#0e1530', borderColor: 'rgba(205,160,76,.5)', borderWidth: 1, padding: 10,
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${formatar(ctx.raw, ctx.dataset.fmt)}` },
        },
      },
      scales: {
        x: { stacked: empilhar, grid: { display: false } },
        y: escala('y', { stacked: empilhar, grid: { color: 'rgba(255,255,255,.05)' } }),
        ...(usaY1 ? { y1: escala('y1', { position: 'right', grid: { display: false } }) } : {}),
      },
    },
  });
}

function funilSvg(camadas) {
  const W = 400, H = 44, gap = 4, n = camadas.length;
  const larg = i => W - (W * 0.55) * (i / n);      // topo de cada camada
  const cores = ['#6d4fd1', '#7f62dc', '#9277e4', '#a98bff'];
  return `<svg class="funil-svg" viewBox="0 0 ${W} ${n * (H + gap)}" role="img" aria-label="Funil do tráfego">
    ${camadas.map((c, i) => {
      const t = larg(i), b = larg(i + 1), y = i * (H + gap);
      const x1 = (W - t) / 2, x2 = (W + t) / 2, x3 = (W + b) / 2, x4 = (W - b) / 2;
      return `<polygon points="${x1},${y} ${x2},${y} ${x3},${y + H} ${x4},${y + H}" fill="${cores[i % cores.length]}"/>
        <text x="${W / 2}" y="${y + 19}" text-anchor="middle" class="fv">${esc(c.v)}</text>
        <text x="${W / 2}" y="${y + 33}" text-anchor="middle" class="fr">${esc(c.r)}</text>`;
    }).join('')}
  </svg>`;
}

// Dia do lead: DATA (dd/mm/aaaa ou aaaa-mm-dd) ou a hora de entrada
function diaDoLead(dados, criado) {
  const d = String(dados?.DATA || '');
  let m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(d);
  if (m) return `${m[3]}-${m[2]}-${m[1]}`;
  m = /^(\d{4}-\d{2}-\d{2})/.exec(d);
  if (m) return m[1];
  return diaSP(criado);
}

async function carregarOrganicos(c) {
  try {
    if (!exp.leads || exp.leads.id !== est.lanc.id) {
      const rows = [];
      for (let de = 0; ; de += 1000) {
        const { data, error } = await sb.from('leads').select('id, dados, criado_em')
          .eq('lancamento_id', est.lanc.id).order('criado_em').order('id').range(de, de + 999);
        if (error) throw error;
        rows.push(...data);
        if (data.length < 1000) break;
      }
      exp.leads = { id: est.lanc.id, rows };
    }
    const nomes = c.nomes;
    exp.base = exp.leads.rows.map(r => {
      const d = r.dados || {};
      const u = {
        utm_source: d.UTM_SOURCE || '(sem utm)', utm_medium: d.UTM_MEDIUM || '', utm_campaign: d.UTM_CAMPAIGN || '',
        utm_content: d.UTM_CONTENT || '', utm_term: d.UTM_TERM || '',
      };
      return { ...u, dia: diaDoLead(d, r.criado_em), nome: d.NOME || '', email: d.EMAIL || '', tel: d.TELEFONE || '', pago: ehPago(u, nomes) };
    }).filter(r => !r.pago && r.dia >= c.de && r.dia <= c.ate)
      .sort((a, b) => b.dia.localeCompare(a.dia));
    exp.pagina = 1; exp.busca = '';
    filtrarOrganicos();
  } catch (e) {
    $('orgResumo').textContent = 'Erro ao carregar os leads: ' + e.message;
  }
}

function buscarOrganicos(v) { exp.busca = norm(v); exp.pagina = 1; filtrarOrganicos(); }

function filtrarOrganicos() {
  const q = exp.busca;
  exp.filtrados = !q ? exp.base : exp.base.filter(r =>
    [r.nome, r.email, r.tel, r.utm_source, r.utm_medium, r.utm_campaign, r.utm_content].some(v => norm(v).includes(q)));
  desenharOrganicos();
}

function desenharOrganicos() {
  const POR = 50, total = exp.filtrados.length;
  const pags = Math.max(1, Math.ceil(total / POR));
  exp.pagina = Math.min(exp.pagina, pags);
  const pagina = exp.filtrados.slice((exp.pagina - 1) * POR, exp.pagina * POR);
  $('orgResumo').textContent = `${int.format(total)} ${total === 1 ? 'lead' : 'leads'}${exp.busca ? ' na busca' : ' no período'} · mais recentes primeiro`;
  $('tabOrg').innerHTML = !total
    ? '<tr><td class="vazio">Nenhum lead orgânico encontrado.</td></tr>'
    : `<thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Canal</th><th>Campanha</th><th>Data</th></tr></thead><tbody>` +
      pagina.map(r => `<tr>
        <td>${esc(r.nome) || '<span class="fraco">—</span>'}</td>
        <td class="esq">${esc(r.email)}</td>
        <td>${esc(r.tel)}</td>
        <td class="esq">${esc(r.utm_source)}${r.utm_medium ? ` / ${esc(r.utm_medium)}` : ''}</td>
        <td class="esq">${esc(r.utm_campaign) || '—'}</td>
        <td>${fmtData(r.dia)}</td>
      </tr>`).join('') + '</tbody>';
  $('orgPag').innerHTML = pags > 1 ? `
    <button class="btn" ${exp.pagina <= 1 ? 'disabled' : ''} onclick="exp.pagina--; desenharOrganicos()">Anterior</button>
    <span>${exp.pagina} de ${pags}</span>
    <button class="btn" ${exp.pagina >= pags ? 'disabled' : ''} onclick="exp.pagina++; desenharOrganicos()">Próxima</button>` : '';
}

function exportarOrganicos() {
  if (!exp.filtrados.length) { aviso('Nada para exportar', true); return; }
  const cel = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const linhas = [['Nome', 'Email', 'Telefone', 'UTM_SOURCE', 'UTM_MEDIUM', 'UTM_CAMPAIGN', 'UTM_CONTENT', 'Data'].join(';'),
    ...exp.filtrados.map(r => [r.nome, r.email, r.tel, r.utm_source, r.utm_medium, r.utm_campaign, r.utm_content, fmtData(r.dia)].map(cel).join(';'))];
  const blob = new Blob(['\ufeff' + linhas.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${est.lanc.id}_organicos_${est.de}_${est.ate}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

  $(alvoRender).innerHTML = `

// ---------- Origem (UTM) ----------
function tabelaGrupo(titulo, desc, linhas, total) {
  const ord = linhas.sort((a, b) => b.n - a.n);
  const topo = ord.slice(0, 12);
  const resto = ord.slice(12).reduce((s, r) => s + r.n, 0);
  if (resto) topo.push({ nome: `Outros (${ord.length - 12})`, n: resto });
  const max = topo[0]?.n || 1;
  return `
    <div class="card bloco">
      <h2>${titulo}</h2><p class="desc">${desc}</p>
      <div class="tabela-wrap"><table>
        ${topo.length ? `<thead><tr><th>${titulo.replace('Por ', '')}</th><th>Leads</th><th>%</th></tr></thead><tbody>` +
          topo.map(r => `<tr><td>${esc(r.nome)}${r.tag ? `<span class="tag ${r.tag}">${r.tag === 'pago' ? 'tráfego' : 'orgânico'}</span>` : ''}</td>
            <td>${int.format(r.n)}<span class="barrinha" style="width:${Math.round(r.n / max * 48)}px"></span></td>
            <td>${pct(r.n / total)}</td></tr>`).join('') + '</tbody>'
          : '<tr><td class="vazio">Nenhum lead no período.</td></tr>'}
      </table></div>
    </div>`;
}
function agrupar(rows, chave, comTag) {
  const m = {};
  for (const r of rows) {
    const k = chave(r) || '(vazio)';
    const x = m[k] ||= { nome: k, n: 0, pagos: 0 };
    x.n += Number(r.leads); if (r._pago) x.pagos += Number(r.leads);
  }
  return Object.values(m).map(x => ({ ...x, tag: comTag ? (x.pagos > x.n / 2 ? 'pago' : 'org') : '' }));
}
function abaOrigem(c) {
  const total = c.t.leads || 1;
  $('conteudo').innerHTML = `
    <div class="g2">
      ${tabelaGrupo('Por canal', 'utm_source / utm_medium de cada lead', agrupar(c.utm, r => r.utm_source + (r.utm_medium ? ' / ' + r.utm_medium : ''), true), total)}
      ${tabelaGrupo('Por campanha', 'utm_campaign', agrupar(c.utm, r => r.utm_campaign), total)}
    </div>
    ${tabelaGrupo('Por conteúdo', 'utm_content: nos anúncios, o nome do criativo', agrupar(c.utm, r => r.utm_content), total)}`;
}

// ---------- Pesquisa ----------
const pesquisaId = l => l.pesquisa_id || `${l.id} - Captação`;
const diaSP = iso => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date(iso));
const CAMPOS_CONTATO = /^(email|e-mail|telefone|nome|whatsapp|celular)$/i;

async function carregarPesquisa() {
  const id = pesquisaId(est.lanc);
  const rows = [];
  for (let de = 0; ; de += 1000) {
    const { data, error } = await sb.from('respostas').select('dados, criado_em')
      .eq('lancamento_id', id).order('criado_em').order('id').range(de, de + 999);
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000) break;
  }
  const { data: card } = await sb.from('lancamentos').select('id, cols, total').eq('id', id).maybeSingle();
  est.pesq = { id, card, rows };
}

function abaPesquisa(c) {
  if (!est.pesq) {
    $('conteudo').innerHTML = '<p class="carregando">Carregando respostas…</p>';
    carregarPesquisa()
      .then(() => { if (est.aba === 'pesquisa') renderAba(); })
      .catch(e => { $('conteudo').innerHTML = `<div class="faixa"><b>Não foi possível ler a pesquisa</b><p>${esc(e.message)}</p></div>`; });
    return;
  }
  const { id, card, rows } = est.pesq;
  if (!rows.length) {
    $('conteudo').innerHTML = `<div class="faixa"><b>Nenhuma resposta ainda</b>
      <p>As respostas chegam no card <b>${esc(id)}</b> da Central de Pesquisas pelo webhook da pesquisa. A URL pronta está no Checklist.</p>
      ${ehAdmin ? '<button class="btn" onclick="abrirChecklist()">Abrir checklist</button>' : ''}</div>`;
    return;
  }
  const hoje = hojeSP();
  const n = rows.length, leads = c.t.leads;
  const hojeN = rows.filter(r => diaSP(r.criado_em) === hoje).length;
  const ultima = rows[rows.length - 1].criado_em;
  const cols = (card?.cols?.length ? card.cols : [...new Set(rows.flatMap(r => Object.keys(r.dados || {})))])
    .filter(k => !k.startsWith('_'));
  const perguntas = cols.filter(k => !CAMPOS_CONTATO.test(k));
  const vivo = situacao(est.lanc).classe === 'andamento';

  const dias = diasEntre(diaSP(rows[0].criado_em), vivo ? hoje : diaSP(ultima));
  const porDia = Object.fromEntries(dias.map(d => [d, 0]));
  rows.forEach(r => { const d = diaSP(r.criado_em); if (d in porDia) porDia[d]++; });

  const blocos = perguntas.map((q, i) => {
    const vals = rows.map(r => String(r.dados?.[q] ?? '').trim()).filter(Boolean);
    const freq = {};
    vals.forEach(v => { freq[v] = (freq[v] || 0) + 1; });
    const opcoes = Object.entries(freq).sort((a, b) => b[1] - a[1]);
    if (!vals.length) return { html: '' };
    if (opcoes.length <= 12) {
      return {
        html: `<div class="card bloco"><h2>${esc(q)}</h2><p class="desc">${int.format(vals.length)} respostas · ${opcoes.length} opções</p>
          <div class="grafico" style="height:${Math.max(150, opcoes.length * 30 + 30)}px"><canvas id="gq${i}"></canvas></div></div>`,
        desenhar: () => desenharOpcoes(`gq${i}`, opcoes, vals.length),
      };
    }
    const recentes = rows.slice().reverse().map(r => String(r.dados?.[q] ?? '').trim()).filter(Boolean).slice(0, 6);
    return {
      html: `<div class="card bloco"><h2>${esc(q)}</h2><p class="desc">Pergunta aberta · ${int.format(vals.length)} respostas · as mais recentes:</p>
        <ul class="abertas">${recentes.map(v => `<li>${esc(v)}</li>`).join('')}</ul></div>`,
    };
  }).filter(b => b.html);

  $('conteudo').innerHTML = `
    <div class="g4">
      ${kcard('Respostas', int.format(n), esc(id), 'prancheta', COR.purple)}
      ${kcard('Taxa de resposta', leads ? taxa(n / leads) : '—', `${int.format(n)} de ${int.format(leads)} leads`, 'porcento', COR.gold)}
      ${vivo ? kcard('Hoje', int.format(hojeN), 'Respostas no dia', 'relogio', COR.blue)
             : kcard('Última resposta', fmtData(diaSP(ultima)), '', 'relogio', COR.blue)}
      ${kcard('Perguntas', int.format(perguntas.length), 'Sem contar nome, e-mail e telefone', 'bandeira', COR.teal)}
    </div>
    ${secao('Respostas por dia')}
    ${bloco('Respostas por dia', 'Quando cada resposta chegou', 'gResp', true)}
    ${secao('Respostas por pergunta')}
    <div class="g2">${blocos.map(b => b.html).join('')}</div>`;

  desenhar('gResp', 'bar', dias.map(ddmm), [{ label: 'Respostas', data: dias.map(d => porDia[d]), cor: COR.purple }]);
  blocos.forEach(b => b.desenhar && b.desenhar());
}

function desenharOpcoes(id, opcoes, total) {
  const curto = t => t.length > 34 ? t.slice(0, 33) + '…' : t;
  charts[id] = new Chart($(id), {
    type: 'bar',
    data: {
      labels: opcoes.map(o => o[0]),
      datasets: [{ data: opcoes.map(o => o[1]), backgroundColor: COR.gold, borderRadius: 4, maxBarThickness: 20 }],
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0e1530', borderColor: 'rgba(205,160,76,.5)', borderWidth: 1, padding: 10,
          callbacks: { title: ctx => ctx[0].label, label: ctx => ` ${int.format(ctx.raw)} · ${pct(ctx.raw / total)}` },
        },
      },
      scales: {
        x: { beginAtZero: true, grid: { color: 'rgba(255,255,255,.05)' }, ticks: { precision: 0 } },
        y: { grid: { display: false }, ticks: { callback: function (v) { return curto(this.getLabelForValue(v)); } } },
      },
    },
  });
}

// ---------- Metas ----------
function abaMetas(c) {
  const l = est.lanc, t = c.t, hoje = hojeSP(), st = situacao(l).classe;
  if (!l.meta_leads && !l.verba) {
    $('conteudo').innerHTML = `<div class="faixa"><b>Sem metas cadastradas</b>
      <p>Informe a meta de leads e a verba do lançamento para ver o progresso, o ritmo necessário e a projeção.</p>
      ${ehAdmin ? '<button class="btn primario" onclick="abrirForm(true)">Cadastrar metas</button>' : ''}</div>`;
    return;
  }
  const cplAlvo = l.meta_leads && l.verba ? l.verba / l.meta_leads : null;
  const cplAtual = div(t.gasto, t.leads);
  const prog = (rot, atual, alvo, fmt, icone, cor) => `
    <div class="card k">
      <div class="k-cab"><span class="rotulo">${rot}</span><span class="k-ico" style="--c:${cor}">${ico(icone)}</span></div>
      <div class="valor">${formatar(atual, fmt)}${alvo ? `<span class="de">/ ${formatar(alvo, fmt)}</span>` : ''}</div>
      ${alvo ? `<div class="prog"><span style="width:${Math.min(100, atual / alvo * 100)}%"></span></div><div class="sub">${pct(atual / alvo)} da meta</div>` : '<div class="sub">Sem meta cadastrada</div>'}
    </div>`;
  const dif = cplAlvo && cplAtual ? cplAtual / cplAlvo - 1 : null;

  let ritmo = '';
  if (!l.fim) {
    ritmo = `<div class="faixa"><b>Ritmo e projeção</b><p>Cadastre a data de fim em Editar para ver o ritmo necessário e a projeção.</p></div>`;
  } else if (st === 'agendado') {
    ritmo = `<div class="faixa"><b>Lançamento agendado</b><p>O ritmo e a projeção aparecem quando os anúncios começarem, em ${fmtData(l.inicio)}.</p></div>`;
  } else if (st === 'andamento') {
    const total = diasEntre(l.inicio, l.fim).length;
    const passados = diasEntre(l.inicio, hoje).length;
    const restantes = Math.max(0, total - passados);
    const base = Math.max(restantes, 1);
    const faltamLeads = l.meta_leads ? Math.max(0, l.meta_leads - t.leads) : null;
    const faltaVerba = l.verba ? Math.max(0, l.verba - t.gasto) : null;
    const mediaLeads = t.leads / passados, mediaGasto = t.gasto / passados;
    const projLeads = t.leads + mediaLeads * restantes, projGasto = t.gasto + mediaGasto * restantes;
    ritmo = `
      ${secao(`Ritmo necessário até ${fmtData(l.fim)}`)}
      <div class="g4">
        ${kcard('Dias restantes', int.format(restantes), `${passados} de ${total} dias decorridos`, 'relogio', COR.blue)}
        ${kcard('Leads por dia necessários', faltamLeads != null ? int.format(Math.ceil(faltamLeads / base)) : '—', faltamLeads != null ? `Faltam ${int.format(faltamLeads)} leads` : 'Sem meta de leads', 'pessoas', COR.purple)}
        ${kcard('Investir por dia', faltaVerba != null ? moeda(faltaVerba / base) : '—', faltaVerba != null ? `Faltam ${moeda(faltaVerba)}` : 'Sem verba cadastrada', 'dinheiro', COR.gold)}
        ${kcard('CPL necessário no restante', faltamLeads && faltaVerba != null ? moeda(faltaVerba / faltamLeads) : '—', cplAlvo ? `CPL alvo ${moeda(cplAlvo)}` : '', 'alvo', COR.green)}
      </div>
      ${secao('Projeção no ritmo atual')}
      <div class="g3">
        ${kcard('Leads projetados', int.format(Math.round(projLeads)), l.meta_leads ? `${pct(projLeads / l.meta_leads)} da meta` : `Média de ${int.format(Math.round(mediaLeads))} por dia`, 'tendencia', COR.purple)}
        ${kcard('Investimento projetado', moeda(projGasto), l.verba ? `${pct(projGasto / l.verba)} da verba` : `Média de ${brl0.format(mediaGasto)} por dia`, 'dinheiro', COR.gold)}
        ${kcard('CPL projetado', moeda(div(projGasto, projLeads)), cplAlvo ? `CPL alvo ${moeda(cplAlvo)}` : '', 'alvo', COR.red)}
      </div>`;
  } else {
    ritmo = `<div class="faixa"><b>Lançamento encerrado</b><p>O progresso acima é o resultado final do período de ${fmtData(l.inicio)} a ${fmtData(l.fim)}.</p></div>`;
  }

  $('conteudo').innerHTML = `
    <div class="faixa">
      <b>Planejamento da captação</b>
      <p>Meta: ${l.meta_leads ? `<b>${int.format(l.meta_leads)} leads</b>` : 'sem meta de leads'} · ${l.verba ? `<b>${moeda(l.verba)}</b> de investimento` : 'sem verba cadastrada'}${cplAlvo ? ` · CPL alvo <b>${moeda(cplAlvo)}</b>` : ''} · janela ${fmtData(l.inicio)} a ${l.fim ? fmtData(l.fim) : 'sem data de fim'}</p>
    </div>
    ${secao('Progresso das metas')}
    <div class="g3">
      ${prog('Leads', t.leads, l.meta_leads, 'int', 'pessoas', COR.purple)}
      ${prog('Investimento', t.gasto, l.verba, 'moeda', 'dinheiro', COR.gold)}
      <div class="card k">
        <div class="k-cab"><span class="rotulo">CPL atual vs meta</span><span class="k-ico" style="--c:${COR.red}">${ico('alvo')}</span></div>
        <div class="valor">${moeda(cplAtual)}${cplAlvo ? `<span class="de">/ meta ${moeda(cplAlvo)}</span>` : ''}</div>
        ${dif != null ? `<span class="selinho ${dif > 0 ? 'ruim' : 'bom'}">${pct(Math.abs(dif))} ${dif > 0 ? 'acima' : 'abaixo'} da meta</span>` : '<div class="sub">Precisa de meta de leads e verba</div>'}
      </div>
    </div>
    ${ritmo}`;
}

const COLS_CRIATIVOS = [
  { id: 'nome', nome: 'Anúncio' },
  { id: 'gasto', nome: 'Investido' },
  { id: 'leads', nome: 'Leads' },
  { id: 'cpl', nome: 'CPL' },
  { id: 'cpm', nome: 'CPM' },
  { id: 'ctr', nome: 'CTR' },
  { id: 'connect', nome: 'Connect' },
  { id: 'leads_meta', nome: 'Leads Meta' },
];

function ordenarCriativos(col) {
  const menorMelhor = ['cpl', 'cpm', 'nome'].includes(col);
  ordCriativos = { col, dir: ordCriativos.col === col ? -ordCriativos.dir : (menorMelhor ? 1 : -1) };
  desenharCriativos();
}

let cplGeral = null;
function desenharCriativos(cpl) {
  if (cpl !== undefined) cplGeral = cpl;
  if (!criativos.length) {
    $('tabCriativos').innerHTML = '<tr><td class="vazio">Nenhum anúncio com "' + esc(est.lanc?.filtro_campanha || '') + '" no nome veiculando no período.</td></tr>';
    return;
  }
  const { col, dir } = ordCriativos;
  const lista = [...criativos].sort((a, b) => {
    const va = a[col], vb = b[col];
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * dir;
  });
  const cor = c => c == null || cplGeral == null ? '' : c <= cplGeral * 0.85 ? 'bom' : c >= cplGeral * 1.25 ? 'ruim' : '';
  $('tabCriativos').innerHTML =
    '<thead><tr>' + COLS_CRIATIVOS.map(c => `<th class="${c.id === col ? 'ord' : ''}" onclick="ordenarCriativos('${c.id}')">${c.nome}${c.id === col ? (dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('') + '</tr></thead><tbody>' +
    lista.map(c => `<tr>
      <td>${esc(c.nome)}<span class="fraco">${esc(c.conjunto)}</span></td>
      <td>${brl.format(c.gasto)}</td>
      <td>${int.format(c.leads)}</td>
      <td class="${cor(c.cpl)}">${moeda(c.cpl)}</td>
      <td>${moeda(c.cpm)}</td>
      <td>${taxa(c.ctr)}</td>
      <td>${taxa(c.connect)}</td>
      <td>${int.format(c.leads_meta)}</td>
    </tr>`).join('') + '</tbody>';
}

function fecharModal() { $('modal').close(); }
$('modal').addEventListener('close', () => clearInterval(ckTimer));
$('explorar').addEventListener('close', () => { if (atualId) renderAba(); });

function sugerirCodigo() {
  const nums = lancamentos.map(l => +((/^L(\d+)KR$/.exec(l.id) || [])[1] || 0)).filter(n => n > 0);
  return nums.length ? `L${Math.max(...nums) + 1}KR` : '';
}
const fmtData = iso => iso ? iso.split('-').reverse().join('/') : '';

function abrirForm(editar = false) {
  const l = editar ? lancamentos.find(x => x.id === atualId) : null;
  if (editar && !l) return;
  const cod = l?.id || sugerirCodigo();
  const rot = l?.rotulo || cod.replace(/KR$/, '');
  abrirModal(editar ? `Editar ${l.rotulo || l.id}` : 'Novo lançamento', `
    <form id="formLanc" class="form" novalidate>
      <label>Código
        <input name="codigo" value="${esc(cod)}" ${editar ? 'readonly' : ''} placeholder="L24KR" autocomplete="off">
        <small>O mesmo da Central de Leads.</small>
      </label>
      <label>Nome de exibição
        <input name="rotulo" value="${esc(rot)}" placeholder="L24" autocomplete="off">
      </label>
      <label class="largo">Trecho no nome das campanhas do Meta
        <input name="filtro" value="${esc(l?.filtro_campanha || rot)}" placeholder="L24" autocomplete="off">
        <small>Toda campanha com esse trecho no nome entra no painel. Use um trecho que não apareça em outros lançamentos: "L2" também pegaria o L23 e o L24.</small>
      </label>
      <label>Início dos anúncios
        <input type="date" name="inicio" value="${esc(l?.inicio || hojeSP())}">
      </label>
      <label>Fim <span class="opc">opcional</span>
        <input type="date" name="fim" value="${esc(l?.fim || '')}">
      </label>
      <label>Meta de leads <span class="opc">opcional</span>
        <input type="number" name="meta" min="0" step="1" inputmode="numeric" value="${l?.meta_leads ?? ''}">
      </label>
      <label>Verba em reais <span class="opc">opcional</span>
        <input type="number" name="verba" min="0" step="0.01" inputmode="decimal" value="${l?.verba ?? ''}">
      </label>
      <p class="erro" id="formErro" hidden></p>
      <div class="acoes">
        <button type="button" class="btn" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn primario">${editar ? 'Salvar alterações' : 'Cadastrar lançamento'}</button>
      </div>
    </form>`);

  const f = $('formLanc');
  const campo = n => f.elements.namedItem(n);
  let rotuloMexido = editar, filtroMexido = editar;
  campo('codigo').oninput = () => {
    campo('codigo').value = campo('codigo').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!rotuloMexido) campo('rotulo').value = campo('codigo').value.replace(/KR$/, '');
    if (!filtroMexido) campo('filtro').value = campo('rotulo').value;
  };
  campo('rotulo').oninput = () => { rotuloMexido = true; if (!filtroMexido) campo('filtro').value = campo('rotulo').value; };
  campo('filtro').oninput = () => { filtroMexido = true; };

  f.onsubmit = async e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(f));
    const erro = msg => { $('formErro').textContent = msg; $('formErro').hidden = false; };
    if (!v.codigo) return erro('Informe o código do lançamento.');
    if (!editar && lancamentos.some(x => x.id === v.codigo)) return erro(`O ${v.codigo} já tem painel. Selecione-o e use "Editar".`);
    if (!v.filtro.trim()) return erro('Informe o trecho do nome das campanhas.');
    if (!v.inicio) return erro('Informe a data de início dos anúncios.');
    if (v.fim && v.fim < v.inicio) return erro('A data de fim é anterior à de início.');

    const btn = f.querySelector('.primario');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const { data: token, error } = await sb.rpc('salvar_lancamento', {
      p_id: v.codigo,
      p_rotulo: v.rotulo.trim() || v.codigo,
      p_filtro: v.filtro.trim(),
      p_inicio: v.inicio,
      p_fim: v.fim || null,
      p_meta: v.meta ? parseInt(v.meta, 10) : null,
      p_verba: v.verba ? Number(v.verba) : null,
    });
    if (error) {
      btn.disabled = false; btn.textContent = editar ? 'Salvar alterações' : 'Cadastrar lançamento';
      return erro(error.message);
    }
    await iniciar(v.codigo);
    if (editar) { fecharModal(); aviso('Alterações salvas'); }
    else abrirChecklist(v.codigo, token);
  };
}

const copiavel = txt => `<div class="copia"><code>${esc(txt)}</code><button type="button" class="btn" onclick="copiar(this)">Copiar</button></div>`;
async function copiar(btn) {
  try {
    await navigator.clipboard.writeText(btn.previousElementSibling.textContent);
    btn.textContent = 'Copiado';
    setTimeout(() => btn.textContent = 'Copiar', 1800);
  } catch { aviso('Não foi possível copiar. Selecione o texto e copie manualmente.', true); }
}

async function abrirChecklist(id = atualId, token = null) {
  const l = lancamentos.find(x => x.id === id);
  if (!l) return;
  if (!token) {
    const r = await sb.rpc('webhook_do_lancamento', { p_id: id });
    if (r.error) { aviso(r.error.message, true); return; }
    token = r.data;
  }
  const url = origem => `${WEBHOOK_BASE}?token=${token}&lanc=${encodeURIComponent(id)}&origem=${origem}`;
  const urlPesq = `${WEBHOOK_BASE.replace('lead-webhook', 'pesquisa-webhook')}?token=${token}&lanc=${encodeURIComponent(id)}`;
  const nome = esc(l.rotulo || l.id);

  abrirModal(`Checklist do ${l.rotulo || l.id}`, `
    <ol class="check">
      <li class="ok"><div class="st"></div><div>
        <b>Cadastro no painel e na Central de Leads</b>
        <p>Feito. O ${nome} já aparece nas duas ferramentas.</p>
      </div></li>

      <li id="ckMeta"><div class="st"></div><div>
        <b>Nome das campanhas no Meta</b>
        <p>Toda campanha do ${nome} precisa ter <code>${esc(l.filtro_campanha)}</code> no nome. O gasto entra sozinho, a cada 15 minutos.</p>
        <p class="vivo" id="ckMetaTxt">Verificando…</p>
      </div></li>

      <li class="manual"><div class="st"></div><div>
        <b>Parâmetros de URL nos anúncios</b>
        <p>Em cada anúncio, Rastreamento > Parâmetros de URL. Dá para aplicar em todos de uma vez: selecione os anúncios no Gerenciador e clique em Editar. É isso que liga cada lead ao criativo.</p>
        ${copiavel(UTM_ANUNCIOS)}
      </div></li>

      <li class="manual"><div class="st"></div><div>
        <b>Webhook no formulário de captura</b>
        <p>No Elementor: formulário > Ações após o envio > adicionar Webhook > colar a URL abaixo. Deixe "Dados avançados" desligado e clique em Atualizar.</p>
        ${copiavel(url('wordpress'))}
        <details>
          <summary>Vai captar pelo ActiveCampaign?</summary>
          <p>Na automação de entrada do lançamento, adicione a ação Webhook com esta URL. As UTMs precisam existir como campos do contato.</p>
          ${copiavel(url('activecampaign'))}
        </details>
      </div></li>

      <li id="ckPesq"><div class="st"></div><div>
        <b>Webhook da pesquisa</b>
        <p>No formulário da pesquisa, adicione a ação Webhook com a URL abaixo. As respostas entram no card <code>${esc(pesquisaId(l))}</code> da Central de Pesquisas, e cada pergunta vira uma coluna.</p>
        ${copiavel(urlPesq)}
        <p class="vivo" id="ckPesqTxt">Verificando…</p>
      </div></li>

      <li id="ckLead"><div class="st"></div><div>
        <b>Lead de teste</b>
        <p>Abra a página de captura com <code>?utm_source=teste&amp;utm_content=teste</code> no fim da URL e faça um cadastro.</p>
        <p class="vivo" id="ckLeadTxt">Verificando…</p>
        <p><button type="button" class="btn" id="btnApagarTeste" hidden onclick="apagarTestes('${esc(id)}')">Apagar leads de teste</button></p>
      </div></li>
    </ol>
    <p class="nota">Os passos 2, 5 e 6 se conferem sozinhos a cada 20 segundos enquanto esta janela estiver aberta.</p>
    <div class="acoes"><button type="button" class="btn primario" onclick="fecharModal()">Concluir</button></div>`);

  verificarChecklist(l);
  clearInterval(ckTimer);
  ckTimer = setInterval(() => verificarChecklist(l), 20000);
}

function marcar(id, ok, texto) {
  const li = $(id);
  if (!li) return;
  li.classList.toggle('ok', ok);
  $(id + 'Txt').textContent = texto;
}

async function verificarChecklist(l) {
  const [ads, utm, pesq] = await Promise.all([
    sb.from('painel_meta_anuncios').select('campaign_name').eq('lancamento_id', l.id),
    sb.from('painel_leads_utm').select('utm_source, leads').eq('lancamento_id', l.id),
    sb.from('respostas').select('id', { count: 'exact', head: true }).eq('lancamento_id', pesquisaId(l)),
  ]);
  if (!$('ckMeta')) return;

  const camps = [...new Set((ads.data || []).map(a => a.campaign_name).filter(Boolean))];
  marcar('ckMeta', camps.length > 0, camps.length
    ? `${camps.length} campanha(s) encontrada(s): ${camps.slice(0, 4).join(', ')}${camps.length > 4 ? '…' : ''}. Se aparecer alguma de outro lançamento, ajuste o trecho em Editar.`
    : `Nenhuma campanha com "${l.filtro_campanha}" no nome veiculando desde ${fmtData(l.inicio)} ainda.`);

  const linhas = utm.data || [];
  const total = linhas.reduce((s, r) => s + Number(r.leads), 0);
  const comUtm = linhas.filter(r => r.utm_source !== '(sem utm)').reduce((s, r) => s + Number(r.leads), 0);
  const testes = linhas.filter(r => r.utm_source.toLowerCase() === 'teste').reduce((s, r) => s + Number(r.leads), 0);
  marcar('ckLead', total > 0, total
    ? `${int.format(total)} lead(s) recebido(s), ${int.format(comUtm)} com UTM.` + (comUtm < total ? ' Leads sem UTM não entram no ranking de criativos: confira se a página mantém os parâmetros da URL.' : '')
    : 'Nenhum lead recebido ainda.');
  $('btnApagarTeste').hidden = testes === 0;
  const nPesq = pesq.count || 0;
  marcar('ckPesq', nPesq > 0, nPesq ? `${int.format(nPesq)} resposta(s) recebida(s).` : 'Nenhuma resposta recebida ainda.');
  if (testes) $('btnApagarTeste').textContent = `Apagar ${testes} lead(s) de teste`;
}

async function apagarTestes(id) {
  const btn = $('btnApagarTeste');
  btn.disabled = true;
  const { data, error } = await sb.rpc('apagar_leads_teste', { p_id: id });
  btn.disabled = false;
  if (error) { aviso(error.message, true); return; }
  aviso(`${data} lead(s) de teste apagado(s)`);
  const l = lancamentos.find(x => x.id === id);
  if (l) verificarChecklist(l);
  carregar();
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && atualId) carregar(); });
iniciar();
</script>
</body>
</html>
