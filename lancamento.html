<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Lançamento · Instituto Kaleizu</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="acesso.js" data-tool="lancamento"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#060B1F; --surface:#0e1530; --card:#0f1428; --border:rgba(255,255,255,0.08);
  --text:#e8eaf6; --muted:#8b93b8; --hint:#3a4060; --gold:#CDA04C; --gold-light:#e8c97a;
  --green:#5fcd8a; --red:#e05a5a; --blue:#5b8aff; --purple:#a98bff;
}
*{box-sizing:border-box;margin:0;padding:0}

/* barra superior — mesma da Central de Leads */
.topbar{height:56px;background:#0a0e1f;border-bottom:2px solid #1A1E31;display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:50}
.topbar-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-logo img{width:32px;height:32px;object-fit:contain;mix-blend-mode:lighten}
.topbar-name{font-size:14px;font-weight:500;color:var(--gold);padding-left:10px;border-left:1px solid var(--border);white-space:nowrap}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-count{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace}
.btn-topbar{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-topbar:hover{color:var(--text);border-color:var(--gold)}
.btn-topbar.voltar-app{border-color:rgba(205,160,76,0.4);color:#CDA04C}
@media (max-width:520px){.topbar-count{display:none}}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.mono{font-family:'DM Mono',monospace}
.wrap{max-width:1600px;margin:0 auto;padding:24px}

/* topo */
.topo{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.voltar{color:var(--muted);text-decoration:none;font-size:13px}
.voltar:hover{color:var(--gold-light)}
.titulo{margin-right:auto;min-width:0}
.titulo h1{font-size:20px;font-weight:600}
.subtitulo{font-size:12px;color:var(--muted);margin-top:2px}

/* lista de lançamentos */
.lanc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.lanc-card{display:flex;flex-direction:column;gap:14px;text-align:left;padding:20px;cursor:pointer;color:var(--text);font:inherit;
  transition:border-color .15s,transform .15s}
.lanc-card:hover{border-color:rgba(205,160,76,.45);transform:translateY(-2px)}
.lanc-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lc-topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lc-nome{font-size:22px;font-weight:600;letter-spacing:-.01em}
.lc-periodo{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:-8px}
.selo{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:99px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.selo.andamento{background:rgba(95,205,138,.14);color:var(--green)}
.selo.andamento::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.selo.agendado{background:rgba(91,138,255,.14);color:var(--blue)}
.selo.encerrado{background:rgba(139,147,184,.12);color:var(--muted)}
.lc-nums{display:flex;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--border)}
.lc-nums b{display:block;font-family:'DM Mono',monospace;font-size:16px;font-weight:500;margin-top:4px}
.lc-meta{height:4px;background:var(--surface);border-radius:2px;overflow:hidden}
.lc-meta span{display:block;height:100%;background:var(--gold);border-radius:2px}
.lanc-novo{border:1px dashed rgba(205,160,76,.35);background:transparent;border-radius:12px;color:var(--muted);font:inherit;
  min-height:190px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lanc-novo:hover{border-color:var(--gold);color:var(--gold-light)}
.lanc-novo .mais{font-size:26px;line-height:1;color:var(--gold)}
.lista-vazia{color:var(--muted);padding:48px 0;text-align:center}
select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.status{display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.pulso{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(95,205,138,.6);animation:pulso 2s infinite}
.pulso.parado{background:var(--red);animation:none}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(95,205,138,0)}100%{box-shadow:0 0 0 0 rgba(95,205,138,0)}}
@media (prefers-reduced-motion:reduce){.pulso{animation:none}}
.btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--gold);color:var(--gold-light)}

/* cards */
.rotulo{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:20px}
.kpi .valor{font-family:'DM Mono',monospace;font-size:30px;font-weight:500;margin-top:8px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.destaque .valor{color:var(--gold-light)}

/* funil */
.funil{padding:20px;margin-bottom:16px}
.funil-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.funil-cab .desc{font-size:12px;color:var(--muted)}
.funil-trilho{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center;gap:8px}
.etapa{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:0}
.etapa .num{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;margin-top:6px;letter-spacing:-.02em}
.etapa .sub{font-size:12px;color:var(--muted);margin-top:2px}
.taxa{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px}
.taxa .pct{font-family:'DM Mono',monospace;font-size:15px;color:var(--gold-light);font-weight:500}
.taxa .rotulo{font-size:9px}
.taxa .seta{width:100%;height:1px;background:var(--border);position:relative;margin:4px 0}
.taxa .seta::after{content:"";position:absolute;right:-1px;top:-3px;border:3.5px solid transparent;border-left:5px solid var(--hint)}
.funil-aviso{font-size:12px;color:var(--muted);margin-top:12px}
@media (max-width:980px){
  .funil-trilho{grid-template-columns:1fr}
  .taxa{flex-direction:row;justify-content:center;gap:10px;min-width:0}
  .taxa .seta{display:none}
}

/* meta de leads */
.meta{padding:16px 20px;margin-bottom:16px;display:none}
.meta.on{display:block}
.meta .linha{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:12px;flex-wrap:wrap}
.meta .num{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted)}
.barra{height:8px;background:var(--surface);border-radius:4px;overflow:hidden;position:relative}
.barra .cheio{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:4px;transition:width .6s}
.barra .ritmo{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.5}

/* grade */
.grade{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.bloco{padding:20px}
.bloco h2{font-size:15px;font-weight:600;margin-bottom:4px}
.bloco .desc{font-size:12px;color:var(--muted);margin-bottom:16px}
.grafico{position:relative;height:300px}

/* tabelas */
.tabela-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
th:hover{color:var(--gold-light)}
th.ord{color:var(--gold)}
td{padding:10px;border-bottom:1px solid var(--border);text-align:right;font-family:'DM Mono',monospace;white-space:nowrap}
td:first-child{font-family:'DM Sans',sans-serif;white-space:normal;max-width:340px}
td .fraco{display:block;font-size:11px;color:var(--hint);font-family:'DM Mono',monospace}
tr:last-child td{border-bottom:none}
.bom{color:var(--green)} .ruim{color:var(--red)}
.vazio{color:var(--muted);text-align:center;padding:28px 10px;font-family:'DM Sans',sans-serif}
.barrinha{display:inline-block;height:4px;background:var(--gold);border-radius:2px;vertical-align:middle;margin-left:8px;opacity:.7}

/* aviso */
.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}
.aviso.erro{border-color:var(--red)}

[hidden]{display:none!important}
.btn.primario{background:var(--gold);border-color:var(--gold);color:#060B1F;font-weight:600}
.btn.primario:hover{background:var(--gold-light);color:#060B1F}
.btn:disabled{opacity:.5;cursor:wait}

/* modal */
dialog{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:0;width:calc(100% - 32px);max-width:640px;max-height:calc(100vh - 48px);margin:auto}
dialog::backdrop{background:rgba(6,11,31,.78);backdrop-filter:blur(3px)}
.modal-cab{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.modal-cab h2{font-size:17px;font-weight:600}
.fechar{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.fechar:hover{color:var(--text)}
.modal-corpo{padding:22px}

/* formulário */
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.form label.largo{grid-column:1/-1}
.form input{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font:inherit;font-weight:400}
.form input:focus{outline:none;border-color:var(--gold)}
.form input[readonly]{opacity:.6}
.form small{font-size:12px;color:var(--muted);font-weight:400}
.form .opc{color:var(--hint);font-weight:400}
.form .erro{grid-column:1/-1;color:var(--red);font-size:13px}
.acoes{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

/* checklist */
.check{list-style:none;display:flex;flex-direction:column;gap:4px;counter-reset:passo}
.check>li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--border);counter-increment:passo}
.check>li:last-child{border-bottom:none}
.check>li>div{min-width:0}
.check .st{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--hint);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
.check .st::before{content:counter(passo)}
.check li.ok .st{background:var(--green);border-color:var(--green);color:#060B1F}
.check li.ok .st::before{content:"✓";font-weight:700}
.check li.manual .st{border-color:var(--gold);color:var(--gold)}
.check b{font-size:14px;font-weight:600}
.check p{font-size:13px;color:var(--muted);margin-top:4px}
.check code{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold-light)}
.check .vivo{color:var(--text)}
.check li.ok .vivo{color:var(--green)}
.check details{margin-top:10px;font-size:13px}
.check summary{cursor:pointer;color:var(--muted)}
.check summary:hover{color:var(--gold-light)}
.copia{display:flex;gap:8px;align-items:stretch;margin-top:10px}
.copia code{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap;display:block}
.nota{font-size:12px;color:var(--hint);margin-top:14px}

/* filtro de data e abas */
.filtro{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;margin-bottom:14px}
.filtro::before{display:none}
.f-tit{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.f-tit svg{width:16px;height:16px;color:var(--gold);display:block}
.f-rot{font-size:12px;font-weight:400;color:var(--muted)}
.f-campos{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.f-campos input[type=date]{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;color-scheme:dark}
.f-campos input[type=date]:focus{outline:none;border-color:var(--gold)}
.link-btn{background:none;border:none;color:var(--gold);font:inherit;font-size:12px;cursor:pointer;padding:4px 6px}
.link-btn:hover{color:var(--gold-light)}
.abas{display:flex;gap:4px;padding:5px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:22px;overflow-x:auto}
.aba{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.aba svg{width:15px;height:15px}
.aba:hover{color:var(--text)}
.aba.on{background:var(--surface);color:var(--gold-light);box-shadow:inset 0 0 0 1px rgba(205,160,76,.3)}
.carregando{color:var(--muted);padding:40px 0;text-align:center}

/* visão macro */
.macro{padding:18px 20px}
.macro-linha{display:flex;align-items:center;gap:12px;margin-top:10px}
.macro-valor{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macro .sub{font-size:12px;color:var(--muted);margin-top:8px}
.grafico.alto{height:330px;margin-top:10px}
.mini{padding:18px 20px;min-height:280px;display:flex;flex-direction:column;min-width:0}
.mini-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.mini-sub{font-size:12px;color:var(--muted);margin:4px 0 14px}
.mini-vazio{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;padding:0 12px}
.explorar{cursor:pointer;transition:border-color .15s}
.explorar:hover,.explorar:focus-within{border-color:rgba(205,160,76,.45)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid rgba(205,160,76,.4);color:var(--gold-light);
  border-radius:99px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;opacity:0;transform:translateY(-2px);transition:opacity .15s,transform .15s}
.chip svg{width:13px;height:13px}
.explorar:hover .chip,.explorar:focus-within .chip,.chip:focus-visible{opacity:1;transform:none}
@media (hover:none){.chip{opacity:1;transform:none}}
.barras-h{display:flex;flex-direction:column;gap:9px;max-height:190px;overflow-y:auto;padding-right:4px}
.bh{display:grid;grid-template-columns:minmax(0,42%) 1fr auto;align-items:center;gap:10px;font-size:12px}
.bh-rot{color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-trilho{height:12px;background:var(--surface);border-radius:3px;overflow:hidden}
.bh-trilho span{display:block;height:100%;background:var(--green);border-radius:3px}
.bh-num{font-family:'DM Mono',monospace;color:var(--text);min-width:28px;text-align:right}
.funil-svg{width:100%;height:auto;max-height:210px;margin-top:auto}
.funil-svg .fv{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;fill:#fff}
.funil-svg .fr{font-family:'DM Sans',sans-serif;font-size:10px;fill:rgba(255,255,255,.8)}

/* link dos criativos */
.link-criativo{color:inherit;text-decoration:none;border-bottom:1px dashed rgba(205,160,76,.45);display:inline-flex;align-items:center;gap:4px}
.link-criativo svg{width:12px;height:12px;color:var(--gold);flex-shrink:0;opacity:.8}
.link-criativo:hover{color:var(--gold-light);border-bottom-color:var(--gold)}
.link-criativo:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}

/* quadro do funil */
.funil-svg .camada{cursor:default;outline:none}
.funil-svg .camada polygon{transition:filter .15s}
.funil-svg .camada:hover polygon,.funil-svg .camada:focus-visible polygon{filter:brightness(1.18)}
.funil-svg .camada:focus-visible polygon{stroke:var(--gold);stroke-width:2}
.dica-funil{position:fixed;z-index:60;pointer-events:none;background:rgba(14,21,48,.96);border:1px solid rgba(169,139,255,.45);border-radius:8px;
  padding:10px 12px;font-size:12px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:170px}
.df-titulo{font-weight:600;font-size:13px;margin-bottom:6px}
.df-linha{display:flex;align-items:center;gap:7px;margin-top:3px;color:var(--muted)}
.df-linha b{color:var(--text);font-family:'DM Mono',monospace;font-weight:500}
.df-cor{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* animação do Explorar */
@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.entra{animation:entra .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--atraso,0ms)}
::view-transition-group(explorar){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(explorar),::view-transition-new(explorar){height:100%;width:100%;object-fit:cover;object-position:top center}
::view-transition-old(explorar){animation-duration:.2s}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s}
@media (prefers-reduced-motion:reduce){.entra{animation:none}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

/* explorar em tela cheia */
.sub-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.migalha{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.link-migalha{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;padding:2px 0}
.link-migalha svg{width:14px;height:14px}
.link-migalha:hover{color:var(--gold-light)}
.sep-migalha{color:var(--hint)}
.migalha .atual{font-weight:600;color:var(--text)}
.periodo-migalha{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-left:10px}
.sel{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;min-width:150px;max-width:260px}
.sel:focus{outline:none;border-color:var(--gold)}
.bloco-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.org-grade{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;align-items:stretch}
.org-esq{display:flex;flex-direction:column;gap:16px;min-width:0}
.org-origem{flex:1}
.org-barras{max-height:260px}
.org-dir{display:flex;flex-direction:column;min-width:0}
.org-grafico{flex:1;min-height:320px;height:auto}
.sub-rodape{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:18px;font-size:12px;color:var(--muted)}

<script>

);

const TZ = 'America/Sao_Paulo';
Chart.defaults.color = '#8b93b8';
Chart.defaults.font.family = "'DM Mono', monospace";
Chart.defaults.font.size = 11;
Chart.defaults.locale = 'pt-BR';
const INTERVALO = 60000;
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const int = new Intl.NumberFormat('pt-BR');
const pct = v => (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';

let lancamentos = [];
let timer = null;
let criativos = [];
let ordCriativos = { col: 'leads', dir: -1 };
let ehAdmin = false;
let ckTimer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hojeSP = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date());
const norm = s => String(s ?? '').trim().toLowerCase();
const div = (a, b) => b > 0 ? a / b : null;

function aviso(msg, erro = false) {
  const el = $('aviso');
  el.textContent = msg;
  el.className = 'aviso on' + (erro ? ' erro' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'aviso', 3500);
}

function diasEntre(inicio, fim) {
  const out = [];
  const d = new Date(inicio + 'T12:00:00Z');
  const f = new Date(fim + 'T12:00:00Z');
  while (d <= f) { out.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 1); }
  return out;
}

function tempoAtras(iso) {
  if (!iso) return null;
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return 'agora';
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min / 60);
  return `há ${h} h`;
}

async function checarAdmin() {
  const { data } = await sb.auth.getUser();
  ehAdmin = data?.user?.user_metadata?.role === 'admin';
}

let atualId = null;

async function iniciar(selecionar) {
  await checarAdmin();
  const { data, error } = await sb.from('painel_lancamentos').select('*').order('inicio', { ascending: false });
  if (error) { aviso('Não foi possível ler os lançamentos: ' + error.message, true); return; }
  lancamentos = data || [];
  $('topbarCount').textContent = `${lancamentos.length} ${lancamentos.length === 1 ? 'lançamento' : 'lançamentos'}`;
  if (selecionar) history.replaceState(null, '', '?id=' + encodeURIComponent(selecionar));
  rotear();
}

function rotear() {
  const q = new URLSearchParams(location.search);
  const id = q.get('id');
  est.sub = SUBS[q.get('ver')] ? q.get('ver') : null;
  if (id && lancamentos.some(l => l.id === id)) {
    // mesma tela de lançamento (ex.: voltar do Explorar): só redesenha
    if (id === atualId && est.lanc?.id === id && !$('telaPainel').hidden) { renderAba(); return; }
    mostrarPainel(id);
  } else mostrarLista();
}
window.addEventListener('popstate', rotear);

function abrirLancamento(id) {
  est.sub = null;
  history.pushState(null, '', '?id=' + encodeURIComponent(id));
  mostrarPainel(id);
  window.scrollTo(0, 0);
}
async function sair() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

function voltarLista() {
  est.sub = null;
  history.pushState(null, '', location.pathname);
  mostrarLista();
}

function situacao(l) {
  const hoje = hojeSP();
  if (l.inicio > hoje) return { classe: 'agendado', txt: 'Agendado', ordem: 1 };
  if (l.fim && l.fim < hoje) return { classe: 'encerrado', txt: 'Encerrado', ordem: 2 };
  return { classe: 'andamento', txt: 'Em andamento', ordem: 0 };
}
function periodo(l) {
  const ini = fmtData(l.inicio);
  if (l.fim) return `${ini.slice(0, 5)} a ${fmtData(l.fim)}`;
  return l.inicio > hojeSP() ? `começa em ${ini}` : `desde ${ini}`;
}

function mostrarPainel(id) {
  const l = lancamentos.find(x => x.id === id);
  if (!l) return mostrarLista();
  atualId = id;
  $('telaLista').hidden = true;
  $('telaPainel').hidden = false;
  $('titulo').textContent = l.rotulo || l.id;
  $('subtitulo').textContent = `${periodo(l)} · ${situacao(l).txt}`;
  $('btnTodos').hidden = false;
  $('boxStatus').hidden = false;
  $('btnAtualizar').hidden = false;
  $('btnChecklist').hidden = $('btnEditar').hidden = !ehAdmin;
  $('btnNovo').hidden = true;
  document.title = `${l.rotulo || l.id} · Painel do Lançamento`;
  if (est.lanc?.id !== id) { $('conteudo').innerHTML = '<p class="carregando">Carregando…</p>'; $('abas').innerHTML = ''; }
  carregar();
}

async function mostrarLista() {
  clearTimeout(timer);
  atualId = null;
  $('telaPainel').hidden = true;
  $('telaLista').hidden = false;
  $('titulo').textContent = 'Painel do Lançamento';
  $('subtitulo').textContent = 'Escolha um lançamento para analisar';
  $('btnTodos').hidden = true;
  $('boxStatus').hidden = true;
  $('btnAtualizar').hidden = $('btnChecklist').hidden = $('btnEditar').hidden = true;
  $('btnNovo').hidden = !ehAdmin;
  document.title = 'Painel do Lançamento · Instituto Kaleizu';

  if (!lancamentos.length) {
    $('gradeLanc').innerHTML = ehAdmin
      ? '<button class="lanc-novo" onclick="abrirForm()"><span class="mais">+</span>Cadastrar o primeiro lançamento</button>'
      : '<p class="lista-vazia">Nenhum lançamento cadastrado ainda.</p>';
    return;
  }

  const [meta, lds] = await Promise.all([
    sb.from('painel_meta_diario').select('lancamento_id, gasto'),
    sb.from('painel_leads_diario').select('lancamento_id, leads'),
  ]);
  if (atualId) return; // o usuário já abriu um lançamento enquanto carregava
  const soma = (linhas, campo) => (linhas || []).reduce((m, r) => {
    m[r.lancamento_id] = (m[r.lancamento_id] || 0) + Number(r[campo]); return m;
  }, {});
  const gastos = soma(meta.data, 'gasto');
  const leads = soma(lds.data, 'leads');

  const ordenados = [...lancamentos].sort((a, b) =>
    situacao(a).ordem - situacao(b).ordem || b.inicio.localeCompare(a.inicio));

  $('gradeLanc').innerHTML = ordenados.map(l => {
    const st = situacao(l);
    const g = gastos[l.id] || 0, n = leads[l.id] || 0;
    const barra = l.meta_leads
      ? `<div class="lc-meta" title="${int.format(n)} de ${int.format(l.meta_leads)} leads"><span style="width:${Math.min(100, n / l.meta_leads * 100)}%"></span></div>`
      : '';
    return `<button class="card lanc-card" onclick="abrirLancamento('${esc(l.id)}')">
      <div class="lc-topo"><span class="lc-nome">${esc(l.rotulo || l.id)}</span><span class="selo ${st.classe}">${st.txt}</span></div>
      <div class="lc-periodo">${esc(periodo(l))}</div>
      <div class="lc-nums">
        <div><span class="rotulo">Investido</span><b>${brl0.format(g)}</b></div>
        <div><span class="rotulo">Leads</span><b>${int.format(n)}</b></div>
        <div><span class="rotulo">CPL</span><b>${n && g ? brl.format(g / n) : '—'}</b></div>
      </div>
      ${barra}
    </button>`;
  }).join('') + (ehAdmin ? '<button class="lanc-novo" onclick="abrirForm()"><span class="mais">+</span>Novo lançamento</button>' : '');
}

const charts = {};

const ICONES = {

  .toLowerCase().replace(/[\s_]+/g, ' ').trim();
function linkCriativo(nome) {

}

const ddmm = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';

// PostgREST devolve no máximo 1000 linhas por chamada: pagina até acabar.
async function buscarTudo(tabela, id, ordem) {
  const out = [];
  for (let de = 0; ; de += 1000) {
    let q = sb.from(tabela).select('*').eq('lancamento_id', id);
    for (const col of ordem) q = q.order(col);
    const { data, error } = await q.range(de, de + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

async function carregar(manual = false) {
  clearTimeout(timer);
  const lanc = lancamentos.find(l => l.id === atualId);
  if (!lanc) return;
  const trocou = est.lanc?.id !== lanc.id;
  try {
    const [adDia, utmDia, sync, criativosDrive] = await Promise.all([
      buscarTudo('painel_meta_ad_dia', lanc.id, ['data', 'ad_id']),
      buscarTudo('painel_leads_utm_dia', lanc.id, ['data', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term']),
      sb.from('meta_insights').select('atualizado_em').order('atualizado_em', { ascending: false }).limit(1),
      sb.from('painel_criativos').select('chave, url').eq('lancamento_id', lanc.id).range(0, 4999),
    ]);
    if (atualId !== lanc.id) return; // trocou de tela enquanto carregava
    Object.assign(est, { lanc, adDia, utmDia, sync: sync.data?.[0]?.atualizado_em, carregadoEm: new Date() });
    // Arquivo do Drive de cada criativo, pelo nome (a tabela pode não existir ainda: aí só não há links)
    est.links = new Map((criativosDrive.data || []).map(r => [r.chave, r.url]));
    if (trocou) { est.aba = 'geral'; est.filtroMexido = false; }
    est.pesq = null;
    rel.grupos = null;
    if (est.aba === 'pesquisa') await carregarPesquisa();
    definirPeriodoPadrao();
    if (!est.filtroMexido) { est.de = est.padraoDe; est.ate = est.padraoAte; }
    atualizarStatus();
    montarAbas();
    montarFiltro();
    renderAba();
    if (manual === true) aviso('Painel atualizado');
  } catch (e) {
    aviso('Erro ao carregar: ' + e.message, true);
    $('pulso').classList.add('parado');
    $('txtStatus').textContent = 'erro ao carregar';
  }
  timer = setTimeout(carregar, INTERVALO);
}

function atualizarStatus() {
  const atras = tempoAtras(est.sync);
  const velho = !est.sync || (Date.now() - new Date(est.sync).getTime()) > 40 * 60000;
  $('pulso').classList.toggle('parado', velho);
  $('txtStatus').textContent = atras ? `Meta atualizado ${atras} · leads ao vivo` : 'Meta ainda sem dados · leads ao vivo';
}

// Período padrão: do começo dos anúncios (ou do primeiro lead, se veio antes)
// até o fim (ou o último lead, se veio depois), nunca além de hoje.
function definirPeriodoPadrao() {
  const l = est.lanc, hoje = hojeSP();
  const datas = est.utmDia.map(r => r.data).filter(Boolean).sort();
  let de = l.inicio, ate = l.fim && l.fim < hoje ? l.fim : hoje;
  if (datas.length) {
    if (datas[0] < de) de = datas[0];
    if (datas[datas.length - 1] > ate) ate = datas[datas.length - 1];
  }
  if (ate > hoje) ate = hoje;
  if (de > ate) de = ate;
  est.padraoDe = de; est.padraoAte = ate;
}

function montarAbas() {
  $('abas').innerHTML = ABAS.map(a =>

}

function montarFiltro() {
  $('fIco').innerHTML = ico('calendario');

    : est.aba === 'pesquisa' ? '· a aba Pesquisa considera todas as respostas'

    : `· ${ddmm(est.de)} — ${ddmm(est.ate)}`;

function mudarFiltro() {
  let de = $('fDe').value, ate = $('fAte').value;
  if (!de || !ate) return;
  if (de > ate) [de, ate] = [ate, de];
  Object.assign(est, { de, ate, filtroMexido: true });
  montarFiltro();
  renderAba();
}

function limparFiltro() {
  Object.assign(est, { de: est.padraoDe, ate: est.padraoAte, filtroMexido: false });
  montarFiltro();
  renderAba();
}

function trocarAba(id) {
  est.aba = id;

  renderAba();
}

// O lead casa com o anúncio pelo utm_content (padrão novo, {{ad.name}});
// se não casar, tenta o utm_term (bases antigas usavam o nome do anúncio ali).
function casaLead(r, anuncio) {
  return casa(r.utm_content, anuncio) || casa(r.utm_term, anuncio);
}
function casa(valor, anuncio) {
  const u = norm(valor);
  return !!u && (u === norm(anuncio.ad_name) || u === norm(anuncio.ad_id));
}
function ehPago(r, nomesAnuncio) {
  const c = norm(r.utm_content), t = norm(r.utm_term);
  return (c && nomesAnuncio.has(c)) || (t && nomesAnuncio.has(t)) ||
    FONTES_PAGAS.includes(norm(r.utm_source)) || MEIOS_PAGOS.includes(norm(r.utm_medium));
}

function calcular(de, ate) {
  const dentro = d => d >= de && d <= ate;
  const ads = est.adDia.filter(a => dentro(a.data));
  const utm = est.utmDia.filter(r => dentro(r.data));
  const nomes = new Set();
  est.adDia.forEach(a => { if (norm(a.ad_name)) nomes.add(norm(a.ad_name)); nomes.add(norm(a.ad_id)); });

  const vazio = () => ({ gasto: 0, impr: 0, cliques: 0, lpv: 0, leadsMeta: 0, leads: 0, pagos: 0, organicos: 0 });
  const dias = diasEntre(de, ate);
  const porDia = Object.fromEntries(dias.map(d => [d, vazio()]));
  const t = vazio();
  const campos = [['gasto', 'gasto'], ['impr', 'impressoes'], ['cliques', 'cliques_link'], ['lpv', 'lpv'], ['leadsMeta', 'leads_meta']];
  for (const a of ads) {
    for (const [k, c] of campos) {
      const v = Number(a[c] || 0);
      t[k] += v;
      if (porDia[a.data]) porDia[a.data][k] += v;
    }
  }
  for (const r of utm) {
    const n = Number(r.leads);
    r._pago = ehPago(r, nomes);
    const k = r._pago ? 'pagos' : 'organicos';
    t.leads += n; t[k] += n;
    if (porDia[r.data]) { porDia[r.data].leads += n; porDia[r.data][k] += n; }
  }
  // Sem nenhum lead identificado como tráfego, usa a atribuição do Meta para as taxas.
  const trafego = t.pagos || t.leadsMeta;
  const trafegoDia = d => porDia[d].pagos || (t.pagos ? 0 : porDia[d].leadsMeta);
  return { de, ate, dias, porDia, t, ads, utm, nomes, trafego, trafegoDia, usaBanco: t.pagos > 0 };
}

function renderAba() {
  esconderDicaFunil();
  for (const k in charts) { charts[k].destroy(); delete charts[k]; }
  document.querySelectorAll('.aba').forEach(b => {
    const on = b.dataset.aba === est.aba;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });
  // Explorar abre em tela cheia: some o filtro e as abas
  $('filtroBox').hidden = $('abas').hidden = !!est.sub;
  if (est.aba === 'relatorio') $('filtroBox').hidden = true; // o relatório tem a própria data
  if (est.sub) return renderSub();
  const inteiro = est.aba === 'metas' || est.aba === 'pesquisa';
  const c = inteiro ? calcular(est.padraoDe, est.padraoAte) : calcular(est.de, est.ate);
  ({ geral: abaGeral, midia: abaMidia, criativos: abaCriativos, origem: abaOrigem, organico: abaOrganico, pesquisa: abaPesquisa, metas: abaMetas, relatorio: abaRelatorio })[est.aba](c);
}

function formatar(v, fmt) {
  if (v == null || !isFinite(v)) return '—';
  return fmt === 'moeda' ? brl.format(v) : fmt === 'pct' ? pct(v) : int.format(v);
}
function formatarEixo(v, fmt) {
  if (fmt === 'moeda') return 'R$ ' + int.format(v);
  if (fmt === 'pct') return (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
  return int.format(v);
}

function desenhar(id, tipo, labels, series, { empilhar = false } = {}) {
  const fmtEixo = eixo => (series.find(s => (s.eixo || 'y') === eixo) || {}).fmt || 'int';
  const usaY1 = series.some(s => s.eixo === 'y1');
  const escala = (eixo, extra) => ({
    beginAtZero: true,
    ticks: { callback: v => formatarEixo(v, fmtEixo(eixo)), ...(fmtEixo(eixo) === 'int' ? { precision: 0 } : {}) },
    ...extra,
  });
  charts[id] = new Chart($(id), {
    type: tipo,
    data: {
      labels,
      datasets: series.map(s => {
        const t = s.tipo || tipo;
        return {
          type: t, label: s.label, data: s.data, fmt: s.fmt || 'int', yAxisID: s.eixo || 'y',
          backgroundColor: s.area ? s.cor + '2e' : s.cor, borderColor: s.cor, fill: !!s.area,
          borderWidth: t === 'line' ? 2 : 0, borderRadius: 4, maxBarThickness: 34,
          pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: s.cor, tension: .3, spanGaps: true,
          stack: empilhar ? 'pilha' : undefined,
        };
      }),
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: series.length > 1, labels: { boxWidth: 10, boxHeight: 10 } },
        tooltip: {
          backgroundColor: '#0e1530', borderColor: 'rgba(205,160,76,.5)', borderWidth: 1, padding: 10,
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${formatar(ctx.raw, ctx.dataset.fmt)}` },
        },
      },
      scales: {
        x: { stacked: empilhar, grid: { display: false } },
        y: escala('y', { stacked: empilhar, grid: { color: 'rgba(255,255,255,.05)' } }),
        ...(usaY1 ? { y1: escala('y1', { position: 'right', grid: { display: false } }) } : {}),
      },
    },
  });
}

function funilSvg(camadas, tamanho) {
  const grande = tamanho === 'grande';
  const W = 400, H = grande ? 78 : 44, gap = grande ? 6 : 4, n = camadas.length;
  const larg = i => W - (W * 0.55) * (i / n);      // topo de cada camada
  const cores = ['#6d4fd1', '#7f62dc', '#9277e4', '#a98bff'];
  // Camadas com "dica" mostram um quadro com os números por trás da taxa ao passar o mouse
  camadas.forEach((c, i) => { c.cor = cores[i % cores.length]; });
  FUNIL_DICAS = camadas;
  return `<svg class="funil-svg" viewBox="0 0 ${W} ${n * (H + gap)}" role="img" aria-label="Funil do tráfego">
    ${camadas.map((c, i) => {
      const t = larg(i), b = larg(i + 1), y = i * (H + gap);
      const x1 = (W - t) / 2, x2 = (W + t) / 2, x3 = (W + b) / 2, x4 = (W - b) / 2;
      const eventos = c.dica
        ? ` class="camada" tabindex="0" aria-label="${esc(c.dica.titulo)}: ${c.dica.linhas.map(l => `${esc(l[0])} ${esc(l[1])}`).join(', ')}" onmousemove="mostrarDicaFunil(event, ${i})" onmouseleave="esconderDicaFunil()" onfocus="mostrarDicaFunil(event, ${i})" onblur="esconderDicaFunil()"`
        : '';
      return `<g${eventos}>
        <polygon points="${x1},${y} ${x2},${y} ${x3},${y + H} ${x4},${y + H}" fill="${c.cor}"/>
        <text x="${W / 2}" y="${y + H / 2 - 1}" text-anchor="middle" class="fv">${esc(c.v)}</text>
        <text x="${W / 2}" y="${y + H / 2 + 13}" text-anchor="middle" class="fr">${esc(c.r)}</text>
      </g>`;
    }).join('')}
  </svg>`;
}

let FUNIL_DICAS = [];
function mostrarDicaFunil(ev, i) {
  const c = FUNIL_DICAS[i];
  if (!c?.dica) return;
  let el = $('dicaFunil');
  if (!el) { el = document.createElement('div'); el.id = 'dicaFunil'; el.className = 'dica-funil'; el.setAttribute('role', 'tooltip'); document.body.appendChild(el); }
  el.innerHTML = `<div class="df-titulo">${esc(c.dica.titulo)}</div>` +
    c.dica.linhas.map(([rot, val]) => `<div class="df-linha"><span class="df-cor" style="background:${c.cor}"></span>${esc(rot)}: <b>${esc(val)}</b></div>`).join('');
  el.hidden = false;
  // Segue o mouse; no teclado, fica ao lado da camada
  const alvo = ev.currentTarget.getBoundingClientRect();
  let x = ev.clientX || (alvo.left + alvo.width / 2), y = ev.clientY || (alvo.top + alvo.height / 2);
  const w = el.offsetWidth, h = el.offsetHeight;
  x = x + 16 + w > innerWidth ? x - w - 16 : x + 16;
  y = Math.max(8, Math.min(y - h / 2, innerHeight - h - 8));
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function esconderDicaFunil() { const el = $('dicaFunil'); if (el) el.hidden = true; }

// ---------- Explorar: visões de tela cheia (Orgânico e Tráfego) ----------
const SUBS = { organico: 'Orgânico', trafego: 'Tráfego' };
const PALETA_ORG = ['#8b5cf6', '#a78bfa', '#c4b5fd', '#e8eaf6', '#9ca3c7', '#7c7fa3', '#63668a', '#4f5274'];
const org = { canal: 'todos', agrupar: 'canal', periodo: 'data' };

// Transição: o card clicado "cresce" até virar a tela cheia (e encolhe de volta ao sair).
// Usa View Transitions quando o navegador tem; senão, só a entrada em cascata dos cards.
const semMovimento = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function transicionar(de, atualizar, para) {
  if (!document.startViewTransition || semMovimento() || !de) { atualizar(); return; }
  de.style.viewTransitionName = 'explorar';
  const t = document.startViewTransition(() => {
    de.style.viewTransitionName = '';
    atualizar();
    const alvo = para();
    if (alvo) alvo.style.viewTransitionName = 'explorar';
  });
  t.finished.finally(() => { document.querySelectorAll('[style*="view-transition-name"]').forEach(el => { el.style.viewTransitionName = ''; }); });
}

function explorar(tipo) {
  history.pushState(null, '', `?id=${encodeURIComponent(atualId)}&ver=${tipo}`);
  if (tipo === 'organico') Object.assign(org, { canal: 'todos', agrupar: 'canal', periodo: 'data' });
  if (tipo === 'trafego') Object.assign(traf, { temp: 'todas', foco: 'oportunidades', nivel: 'campanha', slide: 0 });
  const card = document.querySelector(`.explorar[data-tipo="${tipo}"]`);
  transicionar(card, () => {
    est.sub = tipo;
    est.animarEntrada = true;
    renderAba();
    window.scrollTo(0, 0);
  }, () => $('conteudo'));
}

function sairSub() {
  const tipo = est.sub;
  history.pushState(null, '', `?id=${encodeURIComponent(atualId)}`);
  transicionar($('conteudo'), () => {
    est.sub = null;
    renderAba();
    window.scrollTo(0, 0);
  }, () => document.querySelector(`.explorar[data-tipo="${tipo}"]`));
}

// Cards da tela cheia entram em cascata, um pouco depois do outro
function animarEntrada() {
  if (!est.animarEntrada) return;
  est.animarEntrada = false;
  if (semMovimento()) return;
  document.querySelectorAll('#conteudo .sub-topo, #conteudo .card, #conteudo .sub-rodape').forEach((el, i) => {
    el.style.setProperty('--atraso', `${Math.min(i, 9) * 55}ms`);
    el.classList.add('entra');
    el.addEventListener('animationend', () => el.classList.remove('entra'), { once: true });
  });
}

function migalha(nome) {
  return `
    <div class="sub-topo">
      <nav class="migalha" aria-label="Caminho">
        <button class="link-migalha" onclick="sairSub()">${ico('casa')}Início</button>
        <span class="sep-migalha">/</span><span class="atual">${nome}</span>
        <span class="periodo-migalha">${ddmm(est.de)} — ${ddmm(est.ate)}</span>
      </nav>
      <div id="subFiltro"></div>
    </div>`;
}

function rodapeSub() {
  const hora = est.carregadoEm ? est.carregadoEm.toLocaleTimeString('pt-BR') : '—';
  return `<div class="sub-rodape"><span>Atualizado: ${hora}</span><button class="btn primario" onclick="carregar(true)">Atualizar tudo</button></div>`;
}

function renderSub() {
  const c = calcular(est.de, est.ate);
  if (est.sub === 'organico') subOrganico(c);
  else subTrafego(c);
  animarEntrada();
}

const chaveOrg = {
  canal: r => r.utm_source + (r.utm_medium ? ' / ' + r.utm_medium : ''),
  campanha: r => r.utm_campaign || '(sem campanha)',
  conteudo: r => r.utm_content || '(sem conteúdo)',
};

function subOrganico(c) {
  const todos = c.utm.filter(r => !r._pago);
  // lista de canais para o seletor do topo
  const canais = {};
  todos.forEach(r => { const k = chaveOrg.canal(r); canais[k] = (canais[k] || 0) + Number(r.leads); });
  const listaCanais = Object.entries(canais).sort((a, b) => b[1] - a[1]).map(([k]) => k);
  if (org.canal !== 'todos' && !listaCanais.includes(org.canal)) org.canal = 'todos';
  const rows = org.canal === 'todos' ? todos : todos.filter(r => chaveOrg.canal(r) === org.canal);
  const total = rows.reduce((s, r) => s + Number(r.leads), 0);

  // leads por origem, no agrupamento escolhido
  const grupos = {};
  rows.forEach(r => { const k = chaveOrg[org.agrupar](r); grupos[k] = (grupos[k] || 0) + Number(r.leads); });
  const origem = Object.entries(grupos).sort((a, b) => b[1] - a[1]);
  const max = origem[0]?.[1] || 1;

  const sel = (id, valor, opcoes, onchange, rotulo) => `
    <select class="sel" id="${id}" aria-label="${rotulo}" onchange="${onchange}">
      ${opcoes.map(([v, t]) => `<option value="${esc(v)}"${v === valor ? ' selected' : ''}>${esc(t)}</option>`).join('')}
    </select>`;

  $('conteudo').innerHTML = `
    ${migalha('Orgânico')}
    <div class="org-grade">
      <div class="org-esq">
        <div class="card macro">
          <div class="rotulo">Total leads (orgânico)</div>
          <div class="macro-linha"><span class="k-ico" style="--c:${COR.purple}">${ico('pessoas')}</span><span class="macro-valor">${int.format(total)}</span></div>
          <div class="sub">${pct(div(total, c.t.leads) || 0)} de todos os leads do período</div>
        </div>
        <div class="card bloco org-origem">
          <div class="bloco-cab">
            <div class="rotulo">Leads por origem</div>
            ${sel('selAgrupar', org.agrupar, [['canal', 'Canais'], ['campanha', 'Campanhas'], ['conteudo', 'Conteúdo']], "org.agrupar=this.value; renderAba()", 'Agrupar por')}
          </div>
          ${origem.length ? `<div class="barras-h org-barras">${origem.map(([k, n], i) => `
            <div class="bh"><span class="bh-rot" title="${esc(k)}">${esc(k)}</span>
              <span class="bh-trilho"><span style="width:${Math.max(2, n / max * 100)}%;background:${PALETA_ORG[Math.min(i, PALETA_ORG.length - 1)]}"></span></span>
              <span class="bh-num">${int.format(n)}</span></div>`).join('')}</div>`
            : '<div class="mini-vazio">Nenhum lead orgânico no período.</div>'}
        </div>
      </div>
      <div class="card bloco org-dir">
        <div class="bloco-cab">
          <div class="rotulo">Leads por dia (orgânico)</div>
          ${sel('selPeriodo', org.periodo, [['data', 'Por data'], ['semana', 'Por semana'], ['diasemana', 'Por dia da semana']], "org.periodo=this.value; renderAba()", 'Agrupar datas')}
        </div>
        <div class="grafico org-grafico"><canvas id="gOrgDia"></canvas></div>
      </div>
    </div>
    ${rodapeSub()}`;

  $('subFiltro').innerHTML = sel('selCanal', org.canal, [['todos', 'Todos'], ...listaCanais.map(k => [k, k])], "org.canal=this.value; renderAba()", 'Canal');

  // série do gráfico conforme o agrupamento de datas
  const porDia = Object.fromEntries(c.dias.map(d => [d, 0]));
  rows.forEach(r => { if (r.data in porDia) porDia[r.data] += Number(r.leads); });
  let rotulos, dados;
  if (org.periodo === 'semana') {
    const semanas = {};
    c.dias.forEach(d => {
      const dt = new Date(d + 'T12:00:00Z');
      dt.setUTCDate(dt.getUTCDate() - ((dt.getUTCDay() + 6) % 7)); // segunda-feira
      const k = dt.toISOString().slice(0, 10);
      semanas[k] = (semanas[k] || 0) + porDia[d];
    });
    rotulos = Object.keys(semanas).map(k => `Sem. ${ddmm(k)}`);
    dados = Object.values(semanas);
  } else if (org.periodo === 'diasemana') {
    const nomes = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
    const soma = [0, 0, 0, 0, 0, 0, 0];
    c.dias.forEach(d => { soma[(new Date(d + 'T12:00:00Z').getUTCDay() + 6) % 7] += porDia[d]; });
    rotulos = nomes; dados = soma;
  } else {
    rotulos = c.dias.map(ddmm); dados = c.dias.map(d => porDia[d]);
  }
  desenhar('gOrgDia', 'bar', rotulos, [{ label: 'Leads orgânicos', data: dados, cor: '#8b5cf6' }]);
}

// ---------- Explorar: Tráfego ----------
const traf = { temp: 'todas', foco: 'oportunidades', nivel: 'campanha', slide: 0 };
const TEMPERATURAS = { quente: /quente|rmkt|remarketing|retarget|engaj|envolv|lal.*quente/i, frio: /frio|fria|cold|prospec|aberto|interesse|lookalike|\blal\b/i };
const MIN_LEADS_RANKING = 3;

// Recorte do tráfego (todas / quente / frio) com leads atribuídos a cada anúncio
function calcTrafego(c) {
  const casaTemp = a => traf.temp === 'todas' || TEMPERATURAS[traf.temp].test(`${a.campaign_name || ''} ${a.adset_name || ''}`);
  const ads = c.ads.filter(casaTemp);

  // Índice nome/ID do anúncio → ad_id, para ligar cada linha de UTM a um anúncio
  const indice = {};
  est.adDia.forEach(a => { if (norm(a.ad_name)) indice[norm(a.ad_name)] = a.ad_id; indice[norm(a.ad_id)] = a.ad_id; });
  const idsNoRecorte = new Set(ads.map(a => a.ad_id));

  const leadsAd = {};          // ad_id → leads do banco
  const leadsDiaRecorte = {};  // dia → leads do banco ligados a anúncios do recorte
  for (const r of c.utm) {
    if (!r._pago) continue;
    const id = indice[norm(r.utm_content)] || indice[norm(r.utm_term)];
    if (!id) continue;
    leadsAd[id] = (leadsAd[id] || 0) + Number(r.leads);
    if (idsNoRecorte.has(id)) leadsDiaRecorte[r.data] = (leadsDiaRecorte[r.data] || 0) + Number(r.leads);
  }

  const vazio = () => ({ gasto: 0, impr: 0, cliques: 0, lpv: 0, leadsMeta: 0 });
  const porDia = Object.fromEntries(c.dias.map(d => [d, vazio()]));
  const t = vazio();
  for (const a of ads) {
    for (const [k, col] of [['gasto', 'gasto'], ['impr', 'impressoes'], ['cliques', 'cliques_link'], ['lpv', 'lpv'], ['leadsMeta', 'leads_meta']]) {
      const v = Number(a[col] || 0);
      t[k] += v;
      if (porDia[a.data]) porDia[a.data][k] += v;
    }
  }
  const usaBanco = c.usaBanco;
  // Leads de tráfego: no recorte "todas", os mesmos das outras telas; num recorte, os ligados aos anúncios dele
  const leadsDia = c.dias.map(d => !usaBanco ? porDia[d].leadsMeta
    : traf.temp === 'todas' ? c.trafegoDia(d) : (leadsDiaRecorte[d] || 0));
  const leads = leadsDia.reduce((s, n) => s + n, 0);
  return { ads, porDia, t, leads, leadsDia, leadsAd, usaBanco };
}

function agregarNivel(tr, nivel) {
  const chave = { campanha: a => a.campaign_name || '(sem campanha)', conjunto: a => a.adset_name || '(sem conjunto)', anuncio: a => a.ad_id }[nivel];
  const m = {};
  const contados = new Set();
  for (const a of tr.ads) {
    const k = chave(a);
    const x = m[k] ||= { nome: nivel === 'anuncio' ? (a.ad_name || a.ad_id) : k, sub: nivel === 'anuncio' ? (a.adset_name || '') : nivel === 'conjunto' ? (a.campaign_name || '') : '', gasto: 0, impr: 0, cliques: 0, lpv: 0, leadsMeta: 0, leads: 0 };
    x.gasto += Number(a.gasto || 0); x.impr += Number(a.impressoes || 0); x.cliques += Number(a.cliques_link || 0);
    x.lpv += Number(a.lpv || 0); x.leadsMeta += Number(a.leads_meta || 0);
    if (nivel === 'anuncio' && a.ad_name) x.nome = a.ad_name;
    // leads do banco entram uma vez por anúncio em cada grupo
    const marca = `${k}|${a.ad_id}`;
    if (!contados.has(marca)) { contados.add(marca); x.leads += tr.leadsAd[a.ad_id] || 0; }
  }
  return Object.values(m).map(x => {
    const l = tr.usaBanco ? x.leads : x.leadsMeta;
    return { ...x, l, cpl: div(x.gasto, l), ctr: div(x.cliques, x.impr), connect: x.lpv ? div(x.lpv, x.cliques) : null };
  });
}

function subTrafego(c) {
  const tr = calcTrafego(c);
  const t = tr.t;
  const cplMedio = div(t.gasto, tr.leads);
  const camadas = [
    { v: moeda(div(t.gasto * 1000, t.impr)), r: 'CPM',
      dica: { titulo: 'Impressões', linhas: [['Impressões', int.format(t.impr)], ['Investido', moeda(t.gasto)]] } },
    { v: taxa(div(t.cliques, t.impr)), r: 'CTR',
      dica: { titulo: 'Cliques no link', linhas: [['Cliques no link', int.format(t.cliques)], ['CPC', moeda(div(t.gasto, t.cliques))]] } },
    ...(t.lpv ? [{ v: taxa(div(t.lpv, t.cliques)), r: 'Connect rate',
      dica: { titulo: 'Visualizações da página', linhas: [['Visualizações', int.format(t.lpv)], ['Custo por visualização', moeda(div(t.gasto, t.lpv))]] } }] : []),
    { v: t.lpv ? taxa(div(tr.leads, t.lpv)) : taxa(div(tr.leads, t.cliques)), r: 'Tx. conversão',
      dica: { titulo: 'Leads', linhas: [['Leads', int.format(tr.leads)], ['CPL', moeda(cplMedio)]] } },
  ];
  const macro = (rot, valor, icone, cor, sub) => `
    <div class="card macro">
      <div class="rotulo">${rot}</div>
      <div class="macro-linha"><span class="k-ico" style="--c:${cor}">${ico(icone)}</span><span class="macro-valor">${valor}</span></div>
      <div class="sub">${sub || '&nbsp;'}</div>
    </div>`;
  const pills = (grupo, atual, opcoes, cls = '') => `<div class="pills ${cls}" role="group">${opcoes.map(([v, txt]) =>
    `<button class="pill${v === atual ? ' on' : ''}" aria-pressed="${v === atual}" onclick="traf.${grupo}='${v}'; ${grupo === 'temp' ? 'traf.slide=0; ' : ''}renderAba()">${txt}</button>`).join('')}</div>`;

  // Principais criativos: os anúncios com mais leads (ou mais gasto, sem leads)
  const anuncios = agregarNivel(tr, 'anuncio').filter(a => a.gasto > 0 || a.l > 0)
    .sort((a, b) => (b.l - a.l) || (b.gasto - a.gasto)).slice(0, 5);
  traf.slide = Math.min(traf.slide, Math.max(0, anuncios.length - 1));

  $('conteudo').innerHTML = `
    ${migalha('Tráfego')}
    <div class="tr-grade">
      <div class="card bloco tr-funil">
        <div class="rotulo">Funil de tráfego</div>
        ${t.impr ? funilSvg(camadas, 'grande') : '<div class="mini-vazio">Sem dados do Meta no período.</div>'}
      </div>
      <div class="tr-dir">
        <div class="g3 sem-margem">
          ${macro('Valor gasto', moeda(t.gasto), 'dinheiro', COR.gold, `${int.format(tr.ads.length ? new Set(tr.ads.map(a => a.ad_id)).size : 0)} anúncios veiculados`)}
          ${macro('Total leads (tráfego)', int.format(tr.leads), 'pessoas', COR.purple, tr.usaBanco ? '' : 'Atribuição do Meta')}
          ${macro('Custo por lead', moeda(cplMedio), 'alvo', COR.red, '')}
        </div>
        <div class="card bloco">
          <div class="rotulo">Desempenho por dia</div>
          <div class="grafico tr-grafico"><canvas id="gTrDesemp"></canvas></div>
        </div>
      </div>
    </div>

    <div class="tr-base">
      <div class="card bloco">
        <div class="op-cab">
          ${pills('foco', traf.foco, [['oportunidades', 'Melhores oportunidades'], ['menorcpl', 'Menor custo por lead'], ['qualidade', 'Melhor qualidade do lead']])}
        </div>
        <div class="sub-abas" role="tablist">
          ${[['campanha', 'Campanhas'], ['conjunto', 'Conjuntos'], ['anuncio', 'Anúncios']].map(([v, txt]) =>
            `<button class="sub-aba${traf.nivel === v ? ' on' : ''}" role="tab" aria-selected="${traf.nivel === v}" onclick="traf.nivel='${v}'; renderAba()">${txt}</button>`).join('')}
        </div>
        <div id="opConteudo"></div>
      </div>

      <div class="card bloco tr-criativos">
        <div class="rotulo">Principais criativos</div>
        ${anuncios.length ? `
          <div class="carrossel">
            ${anuncios.map((a, i) => `
              <div class="slide${i === traf.slide ? ' on' : ''}" aria-hidden="${i !== traf.slide}">
                <div class="slide-arte">${ico('imagem')}<span>#${i + 1} em leads</span></div>
                <div class="slide-info">
                  <div class="slide-nome">${linkCriativo(a.nome)}</div>
                  <div class="slide-conj">${esc(a.sub)}</div>
                  <div class="slide-chips">
                    <span class="chip-dado">Gasto: ${moeda(a.gasto)}</span>
                    <span class="chip-dado">Leads: ${int.format(a.l)}</span>
                    <span class="chip-dado">CPL: ${moeda(a.cpl)}</span>
                  </div>
                </div>
              </div>`).join('')}
            <div class="carrossel-nav">
              <button class="seta-car" aria-label="Anterior" onclick="traf.slide=(traf.slide+${anuncios.length}-1)%${anuncios.length}; mostrarSlide()">‹</button>
              <div class="pontos">${anuncios.map((_, i) => `<button class="ponto${i === traf.slide ? ' on' : ''}" aria-label="Criativo ${i + 1}" onclick="traf.slide=${i}; mostrarSlide()"></button>`).join('')}</div>
              <button class="seta-car" aria-label="Próximo" onclick="traf.slide=(traf.slide+1)%${anuncios.length}; mostrarSlide()">›</button>
            </div>
          </div>` : '<div class="mini-vazio">Nenhum anúncio no período.</div>'}
      </div>
    </div>
    ${rodapeSub()}`;

  $('subFiltro').innerHTML = pills('temp', traf.temp, [['todas', 'Todas'], ['quente', 'Quente'], ['frio', 'Frio']], 'pills-topo');

  // Oportunidades
  const linhas = agregarNivel(tr, traf.nivel);
  let lista = [], vazio = '';
  if (traf.foco === 'qualidade') {
    vazio = 'Ainda não há um critério de qualidade definido para os leads. Quando houver, este ranking mostra quem traz os melhores.';
  } else if (traf.foco === 'menorcpl') {
    lista = linhas.filter(x => x.l >= MIN_LEADS_RANKING).sort((a, b) => a.cpl - b.cpl);
    vazio = `Nenhum item com pelo menos ${MIN_LEADS_RANKING} leads no período.`;
  } else {
    // Melhores oportunidades: CPL abaixo da média e volume relevante, os que mais trazem leads primeiro
    lista = linhas.filter(x => x.l >= MIN_LEADS_RANKING && cplMedio && x.cpl <= cplMedio).sort((a, b) => b.l - a.l);
    vazio = 'Nenhum item com CPL abaixo da média e volume suficiente no período.';
  }
  lista = lista.slice(0, 10);
  $('opConteudo').innerHTML = !lista.length ? `<div class="op-vazio">${vazio}</div>` : `
    <div class="tabela-wrap"><table class="op-tabela">
      <thead><tr><th>${{ campanha: 'Campanha', conjunto: 'Conjunto', anuncio: 'Anúncio' }[traf.nivel]}</th><th>Investido</th><th>Leads</th><th>CPL</th><th>vs. média</th><th>CTR</th><th>Connect</th></tr></thead>
      <tbody>${lista.map(x => {
        const dif = cplMedio && x.cpl != null ? x.cpl / cplMedio - 1 : null;
        return `<tr>
          <td>${traf.nivel === 'anuncio' ? linkCriativo(x.nome) : esc(x.nome)}${x.sub ? `<span class="fraco">${esc(x.sub)}</span>` : ''}</td>
          <td>${moeda(x.gasto)}</td><td>${int.format(x.l)}</td><td>${moeda(x.cpl)}</td>
          <td class="${dif == null || Math.abs(dif) < .005 ? '' : dif < 0 ? 'bom' : 'ruim'}">${dif == null ? '—' : Math.abs(dif) < .005 ? 'na média' : `${dif < 0 ? '−' : '+'}${pct(Math.abs(dif))}`}</td>
          <td>${taxa(x.ctr)}</td><td>${taxa(x.connect)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    <p class="op-nota">Mínimo de ${MIN_LEADS_RANKING} leads por item · CPL médio do recorte: ${moeda(cplMedio)}</p>`;

  const gasto = c.dias.map(d => tr.porDia[d].gasto);
  desenharDesempenho(c, {
    id: 'gTrDesemp', leads: tr.leadsDia, gasto, trafego: tr.leadsDia, rotuloLeads: 'Leads', rodape: () => '',
  });
}

function mostrarSlide() {
  document.querySelectorAll('.slide').forEach((s, i) => { s.classList.toggle('on', i === traf.slide); s.setAttribute('aria-hidden', String(i !== traf.slide)); });
  document.querySelectorAll('.ponto').forEach((p, i) => p.classList.toggle('on', i === traf.slide));

// ---------- Relatório diário (texto para o grupo) ----------
const rel = { lanc: null, data: null, pessoas: '', grupos: null };

async function carregarGrupos() {
  const { data, error } = await sb.from('painel_grupos').select('data, pessoas').eq('lancamento_id', est.lanc.id).order('data');
  if (error) throw error;
  rel.grupos = data || [];
}

// Pessoas nos grupos na data: o valor salvo nela ou o último antes dela
function gruposNaData(data) {
  const ant = (rel.grupos || []).filter(g => g.data <= data);
  return ant.length ? ant[ant.length - 1] : null;
}

const reais = v => 'R$' + (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct2 = v => v == null || !isFinite(v) ? '—' : (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';

function abaRelatorio() {
  const l = est.lanc, hoje = hojeSP();
  if (rel.lanc !== l.id) Object.assign(rel, { lanc: l.id, data: null, pessoas: '', grupos: null });
  if (!est.pesq || !rel.grupos) {
    $(alvoRender).innerHTML = '<p class="carregando">Montando o relatório…</p>';
    Promise.all([est.pesq ? null : carregarPesquisa(), rel.grupos ? null : carregarGrupos()])
      .then(() => { if (est.aba === 'relatorio' && !est.sub) renderAba(); })
      .catch(e => { $('conteudo').innerHTML = `<div class="faixa"><b>Não foi possível montar o relatório</b><p>${esc(e.message)}</p></div>`; });
    return;
  }

  // Data do relatório: hoje durante a captação; o último dia, se já encerrou
  const minimo = est.padraoDe < l.inicio ? est.padraoDe : l.inicio;
  if (!rel.data) rel.data = l.fim && l.fim < hoje ? l.fim : hoje;
  if (rel.data > hoje) rel.data = hoje;
  const salvo = gruposNaData(rel.data);
  const pessoasTxt = rel.pessoas !== '' ? rel.pessoas : (salvo ? String(salvo.pessoas) : '');
  const pessoas = pessoasTxt === '' ? null : Number(pessoasTxt);

  // Números acumulados do início do lançamento até o fim do dia escolhido
  const c = calcular(minimo <= rel.data ? minimo : rel.data, rel.data);
  const total = c.t.leads, org = c.t.organicos, pago = c.trafego;
  const respostas = est.pesq.rows.filter(r => r._dia <= rel.data).length;

  const [a, m, d] = rel.data.split('-');
  const texto = [
    `Métricas ${l.id} - ${d}.${m}.${a}`,
    '',
    `Leads totais: ${int.format(total)}`,
    `* Org: ${int.format(org)}`,
    `* Pago: ${int.format(pago)}`,
    '',
    `Total investido: ${reais(c.t.gasto)}`,
    '',
    `* Custo por lead: ${reais(div(c.t.gasto, pago) || 0)}`,
    `* Taxa de grupos: ${pessoas != null ? pct2(div(pessoas, total)) : '—'}`,
    `* Taxa de pesquisa: ${pct2(div(respostas, total))}`,
  ].join('\n');

  const linha = (rot, valor, obs = '') => `<div class="rel-linha"><span>${rot}</span><b>${valor}</b>${obs ? `<small>${obs}</small>` : ''}</div>`;
  $(alvoRender).innerHTML = `
    <div class="rel-grade">
      <div class="card bloco">
        <h2>Relatório diário</h2>
        <p class="desc">Números acumulados do início do lançamento até o fim do dia escolhido.</p>
        <div class="rel-campos">
          <label>Data do relatório
            <input type="date" id="relData" value="${rel.data}" min="${minimo}" max="${hoje}" onchange="rel.data=this.value; rel.pessoas=''; renderAba()">
          </label>
          <label>Pessoas nos grupos
            <input type="number" id="relPessoas" min="0" step="1" inputmode="numeric" value="${esc(pessoasTxt)}" placeholder="Ex.: 320"
              onchange="salvarPessoas(this.value)">
            <small>${salvo ? (salvo.data === rel.data ? 'Salvo para este dia.' : `Último valor informado em ${fmtData(salvo.data)}. Atualize com o número de hoje.`) : 'Informe o total de pessoas nos grupos de WhatsApp.'}</small>
          </label>
        </div>
        <div class="rel-origem">
          ${linha('Leads totais', int.format(total))}
          ${linha('Orgânicos', int.format(org), 'sem UTM de anúncio')}
          ${linha('Pagos', int.format(pago), c.usaBanco ? 'ligados a anúncio ou com fonte paga' : 'atribuição do Meta')}
          ${linha('Total investido', reais(c.t.gasto))}
          ${linha('Custo por lead', reais(div(c.t.gasto, pago) || 0), 'investido ÷ pagos')}
          ${linha('Taxa de grupos', pessoas != null ? pct2(div(pessoas, total)) : '—', pessoas != null ? `${int.format(pessoas)} ÷ ${int.format(total)} leads` : 'falta o número de pessoas')}
          ${linha('Taxa de pesquisa', pct2(div(respostas, total)), `${int.format(respostas)} respostas ÷ ${int.format(total)} leads`)}
        </div>
      </div>
      <div class="card bloco rel-previa">
        <div class="bloco-cab"><h2>Mensagem para o grupo</h2>
          <button class="btn primario" id="btnCopiarRel" onclick="copiarRelatorio()">${ico('copiar')}Copiar</button></div>
        <pre id="relTexto">${esc(texto)}</pre>
        ${pessoas == null ? '<p class="rel-aviso">A taxa de grupos está sem valor. Preencha as pessoas nos grupos antes de copiar.</p>' : ''}
      </div>
    </div>`;
}

async function salvarPessoas(valor) {
  rel.pessoas = valor;
  const n = parseInt(valor, 10);
  if (valor === '' || !(n >= 0)) { renderAba(); return; }
  const { error } = await sb.from('painel_grupos')
    .upsert({ lancamento_id: est.lanc.id, data: rel.data, pessoas: n, atualizado_em: new Date().toISOString() }, { onConflict: 'lancamento_id,data' });
  if (error) { aviso('Não foi possível salvar: ' + error.message, true); return; }
  await carregarGrupos();
  rel.pessoas = '';
  renderAba();
  aviso('Pessoas nos grupos salvas');
}

async function copiarRelatorio() {
  const btn = $('btnCopiarRel');
  try {
    await navigator.clipboard.writeText($('relTexto').textContent);
    btn.innerHTML = `${ico('copiar')}Copiado`;
    setTimeout(() => { if ($('btnCopiarRel')) btn.innerHTML = `${ico('copiar')}Copiar`; }, 1800);
  } catch {
    aviso('Não foi possível copiar. Selecione o texto e copie manualmente.', true);
  }
}

function tabelaGrupo(titulo, desc, linhas, total, comLink = false) {
  const ord = linhas.sort((a, b) => b.n - a.n);
  const topo = ord.slice(0, 12);
  const resto = ord.slice(12).reduce((s, r) => s + r.n, 0);
  if (resto) topo.push({ nome: `Outros (${ord.length - 12})`, n: resto });
  const max = topo[0]?.n || 1;
  return `
    <div class="card bloco">
      <h2>${titulo}</h2><p class="desc">${desc}</p>
      <div class="tabela-wrap"><table>
        ${topo.length ? `<thead><tr><th>${titulo.replace('Por ', '')}</th><th>Leads</th><th>%</th></tr></thead><tbody>` +
          topo.map(r => `<tr><td>${comLink ? linkCriativo(r.nome) : esc(r.nome)}${r.tag ? `<span class="tag ${r.tag}">${r.tag === 'pago' ? 'tráfego' : 'orgânico'}</span>` : ''}</td>
            <td>${int.format(r.n)}<span class="barrinha" style="width:${Math.round(r.n / max * 48)}px"></span></td>
            <td>${pct(r.n / total)}</td></tr>`).join('') + '</tbody>'
          : '<tr><td class="vazio">Nenhum lead no período.</td></tr>'}
      </table></div>
    </div>`;
}
function agrupar(rows, chave, comTag) {
  const m = {};
  for (const r of rows) {
    const k = chave(r) || '(vazio)';
    const x = m[k] ||= { nome: k, n: 0, pagos: 0 };
    x.n += Number(r.leads); if (r._pago) x.pagos += Number(r.leads);
  }
  return Object.values(m).map(x => ({ ...x, tag: comTag ? (x.pagos > x.n / 2 ? 'pago' : 'org') : '' }));
}

// ---------- Pesquisa ----------
const pesquisaId = l => l.pesquisa_id || `${l.id} - Captação`;
const diaSP = iso => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date(iso));
const CAMPOS_CONTATO = /^(email|e-mail|telefone|nome|whatsapp|celular)$/i;

// ---- Data de cada resposta ----
// Respostas importadas por CSV trazem a data numa coluna; as do webhook, na hora de entrada.
const MESES = { jan: 1, fev: 2, feb: 2, mar: 3, abr: 4, apr: 4, mai: 5, may: 5, jun: 6, jul: 7, ago: 8, aug: 8, set: 9, sep: 9, out: 10, oct: 10, nov: 11, dez: 12, dec: 12 };
const NOME_DATA = /^(data|date|data e hora|data\/hora|carimbo de data\/hora|timestamp|data de envio|enviad[oa] em|submitted( at)?|created( at)?|criad[oa] em|hor[aá]rio)$/i;

function isoValido(a, m, d) {
  if (a < 100) a += 2000;
  if (a < 2000 || a > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  return `${a}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function lerData(valor) {
  const v = String(valor ?? '').trim();
  if (!v) return null;
  let m;
  // Número de série do Excel (ex.: 46283 ou 46283,58)
  if (/^\d{5}([.,]\d+)?$/.test(v)) {
    const n = parseFloat(v.replace(',', '.'));
    if (n > 36000 && n < 80000) return new Date(Date.UTC(1899, 11, 30) + Math.floor(n) * 86400000).toISOString().slice(0, 10);
  }
  // ISO com fuso (2026-09-18T02:10:00Z): converte para o dia em São Paulo
  if (/^\d{4}-\d{2}-\d{2}T.*(Z|[+-]\d{2}:?\d{2})$/.test(v)) { const d = new Date(v); if (!isNaN(d)) return diaSP(d.toISOString()); }
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(v))) return isoValido(+m[1], +m[2], +m[3]);
  // 18/09/2026, 18-09-26, 18.09.2026 (dia primeiro; se o "mês" passar de 12, inverte)
  if ((m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/.exec(v))) {
    let d = +m[1], mes = +m[2];
    if (mes > 12 && d <= 12) [d, mes] = [mes, d];
    return isoValido(+m[3], mes, d);
  }
  // 18 de setembro de 2026 · 18 set 2026
  if ((m = /^(\d{1,2})\s*(?:de\s+)?([a-zç]{3})[a-zç]*\.?\s*(?:de\s+)?(\d{4})/i.exec(v)) && MESES[m[2].toLowerCase()])
    return isoValido(+m[3], MESES[m[2].toLowerCase()], +m[1]);
  // September 18, 2026 · setembro 18, 2026
  if ((m = /^([a-zç]{3})[a-zç]*\.?\s+(\d{1,2}),?\s+(\d{4})/i.exec(v)) && MESES[m[1].toLowerCase()])
    return isoValido(+m[3], MESES[m[1].toLowerCase()], +m[2]);
  return null;
}

// Acha a coluna de data: primeiro pelo nome; senão, a coluna em que quase tudo é data
function acharColunaData(rows, cols) {
  const amostra = rows.slice(0, 60);
  const taxaDatas = k => {
    const vals = amostra.map(r => r.dados?.[k]).filter(v => String(v ?? '').trim());
    return vals.length ? vals.filter(lerData).length / vals.length : 0;
  };
  const porNome = cols.filter(k => NOME_DATA.test(k.trim()));
  for (const k of porNome) if (taxaDatas(k) >= .6) return k;
  let melhor = null, nota = 0;
  for (const k of cols) {
    if (CAMPOS_CONTATO.test(k)) continue;
    const t = taxaDatas(k);
    if (t >= .8 && t > nota) { melhor = k; nota = t; }
  }
  return melhor;
}

async function carregarPesquisa() {
  const id = pesquisaId(est.lanc);
  const rows = [];
  for (let de = 0; ; de += 1000) {
    const { data, error } = await sb.from('respostas').select('dados, criado_em')
      .eq('lancamento_id', id).order('criado_em').order('id').range(de, de + 999);
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000) break;
  }
  const { data: card } = await sb.from('lancamentos').select('id, cols, total').eq('id', id).maybeSingle();
  // todas as chaves das respostas, não só as do card: a coluna de data pode não estar no cols
  const colunas = [...new Set([...(card?.cols || []), ...rows.slice(0, 200).flatMap(r => Object.keys(r.dados || {}))])].filter(k => !k.startsWith('_'));
  const colData = acharColunaData(rows, colunas);
  rows.forEach(r => { r._dia = (colData && lerData(r.dados?.[colData])) || diaSP(r.criado_em); });
  rows.sort((a, b) => a._dia.localeCompare(b._dia));
  est.pesq = { id, card, rows, colData };
}

function abaPesquisa(c) {
  if (!est.pesq) {
    $('conteudo').innerHTML = '<p class="carregando">Carregando respostas…</p>';
    carregarPesquisa()
      .then(() => { if (est.aba === 'pesquisa') renderAba(); })
      .catch(e => { $('conteudo').innerHTML = `<div class="faixa"><b>Não foi possível ler a pesquisa</b><p>${esc(e.message)}</p></div>`; });
    return;
  }
  const { id, card, rows } = est.pesq;
  if (!rows.length) {
    $('conteudo').innerHTML = `<div class="faixa"><b>Nenhuma resposta ainda</b>
      <p>As respostas chegam no card <b>${esc(id)}</b> da Central de Pesquisas pelo webhook da pesquisa. A URL pronta está no Checklist.</p>
      ${ehAdmin ? '<button class="btn" onclick="abrirChecklist()">Abrir checklist</button>' : ''}</div>`;
    return;
  }
  const hoje = hojeSP();
  const n = rows.length, leads = c.t.leads;
  const hojeN = rows.filter(r => r._dia === hoje).length;
  const ultima = rows[rows.length - 1]._dia;
  const { colData } = est.pesq;
  const cols = (card?.cols?.length ? card.cols : [...new Set(rows.flatMap(r => Object.keys(r.dados || {})))])
    .filter(k => !k.startsWith('_'));
  const perguntas = cols.filter(k => !CAMPOS_CONTATO.test(k) && k !== colData);
  const vivo = situacao(est.lanc).classe === 'andamento';

  const dias = diasEntre(rows[0]._dia, vivo && hoje > ultima ? hoje : ultima);
  const porDia = Object.fromEntries(dias.map(d => [d, 0]));
  rows.forEach(r => { if (r._dia in porDia) porDia[r._dia]++; });

  const blocos = perguntas.map((q, i) => {
    const vals = rows.map(r => String(r.dados?.[q] ?? '').trim()).filter(Boolean);
    const freq = {};
    vals.forEach(v => { freq[v] = (freq[v] || 0) + 1; });
    const opcoes = Object.entries(freq).sort((a, b) => b[1] - a[1]);
    if (!vals.length) return { html: '' };
    if (opcoes.length <= 12) {
      return {
        html: `<div class="card bloco"><h2>${esc(q)}</h2><p class="desc">${int.format(vals.length)} respostas · ${opcoes.length} opções</p>
          <div class="grafico" style="height:${Math.max(150, opcoes.length * 30 + 30)}px"><canvas id="gq${i}"></canvas></div></div>`,
        desenhar: () => desenharOpcoes(`gq${i}`, opcoes, vals.length),
      };
    }
    const recentes = rows.slice().reverse().map(r => String(r.dados?.[q] ?? '').trim()).filter(Boolean).slice(0, 6);
    return {
      html: `<div class="card bloco"><h2>${esc(q)}</h2><p class="desc">Pergunta aberta · ${int.format(vals.length)} respostas · as mais recentes:</p>
        <ul class="abertas">${recentes.map(v => `<li>${esc(v)}</li>`).join('')}</ul></div>`,
    };
  }).filter(b => b.html);

  $('conteudo').innerHTML = `
    <div class="g4">
      ${kcard('Respostas', int.format(n), esc(id), 'prancheta', COR.purple)}
      ${kcard('Taxa de resposta', leads ? taxa(n / leads) : '—', `${int.format(n)} de ${int.format(leads)} leads`, 'porcento', COR.gold)}
      ${vivo ? kcard('Hoje', int.format(hojeN), 'Respostas no dia', 'relogio', COR.blue)
             : kcard('Última resposta', fmtData(ultima), '', 'relogio', COR.blue)}
      ${kcard('Perguntas', int.format(perguntas.length), 'Sem contar nome, e-mail e telefone', 'bandeira', COR.teal)}
    </div>
    ${secao('Respostas por dia')}
    ${bloco('Respostas por dia', colData ? `Pela coluna "${esc(colData)}" da pesquisa; respostas sem data contam no dia em que entraram` : 'Quando cada resposta chegou', 'gResp', true)}
    ${secao('Respostas por pergunta')}
    <div class="g2">${blocos.map(b => b.html).join('')}</div>`;

  desenhar('gResp', 'bar', dias.map(ddmm), [{ label: 'Respostas', data: dias.map(d => porDia[d]), cor: COR.purple }]);
  blocos.forEach(b => b.desenhar && b.desenhar());
}

function desenharOpcoes(id, opcoes, total) {
  const curto = t => t.length > 34 ? t.slice(0, 33) + '…' : t;
  charts[id] = new Chart($(id), {
    type: 'bar',
    data: {
      labels: opcoes.map(o => o[0]),
      datasets: [{ data: opcoes.map(o => o[1]), backgroundColor: COR.gold, borderRadius: 4, maxBarThickness: 20 }],
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0e1530', borderColor: 'rgba(205,160,76,.5)', borderWidth: 1, padding: 10,
          callbacks: { title: ctx => ctx[0].label, label: ctx => ` ${int.format(ctx.raw)} · ${pct(ctx.raw / total)}` },
        },
      },
      scales: {

        y: { grid: { display: false }, ticks: { callback: function (v) { return curto(this.getLabelForValue(v)); } } },
      },

}
